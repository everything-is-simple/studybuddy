<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 课堂采集与报告</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">课堂采集与报告</p>
<h1>音频转写与学习报告</h1>
<p class="lead">管理课堂音频采集、确认转写结果、查看脱敏报告。</p>
</div>
</div>

<div class="grid">
<section class="card span-6" data-od-id="classroom-captures">
<h2>采集会话</h2>
<div id="capture-status" class="notice" role="status" aria-live="polite">正在加载采集会话…</div>
<button id="refresh-captures" class="btn mt-12" type="button" title="[1] 刷新采集列表 - 重新加载当前会话的采集记录">刷新采集列表</button>
<button id="load-more-captures" class="btn mt-12" type="button" hidden title="[翻页] 加载更多采集记录">加载更多会话</button>
<div id="captures"></div>
</section>

<section class="card span-6" data-od-id="classroom-reports">
<h2>学习报告</h2>
<div id="report-status" class="notice" role="status" aria-live="polite">正在加载报告列表…</div>
<button id="refresh-reports" class="btn mt-12" type="button" title="[报告] 刷新报告列表">刷新报告列表</button>
<div id="reports"></div>
</section>
</div>

<section class="card" data-od-id="classroom-detail">
<h2>详情区</h2>
<div id="detail-status" class="notice" role="status" aria-live="polite" hidden></div>
<button id="retry-detail" class="btn mt-12" type="button" hidden title="[重试] 重新加载详情">重试加载详情</button>
<div id="detail-content"></div>
</section>

</main>
</div>
<script src="/app/js/api.js"></script>
<script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(()=>{
'use strict';
const pageRequest=sbApi.setPageScope('classroom');
window.addEventListener('pagehide',()=>sbApi.cancelAll());

const captureStatus=document.querySelector('#capture-status');
const refreshCaptures=document.querySelector('#refresh-captures');
const loadMoreCaptures=document.querySelector('#load-more-captures');
const capturesContainer=document.querySelector('#captures');
const reportStatus=document.querySelector('#report-status');
const refreshReports=document.querySelector('#refresh-reports');
const reportsContainer=document.querySelector('#reports');
const detailStatus=document.querySelector('#detail-status');
const retryDetail=document.querySelector('#retry-detail');
const detailContent=document.querySelector('#detail-content');

let captureGeneration=0,reportGeneration=0,detailGeneration=0;
let currentCaptureId=null,currentReportId=null,detailMode=null;
let busyConfirm=false;
let capOffset=0,capHasMore=false,capItems=[];

const KIND_LABEL={audio:'音频',image:'图片'};
const QUALITY_LABEL={clear:'清晰',uncertain:'低置信'};
function kindLabel(value){return KIND_LABEL[value]||'未知类型'}

const errorMap={
capture_list_failed:'采集会话列表加载失败，请重试',
capture_read_failed:'采集会话详情加载失败，请重试',
capture_not_found:'采集会话不存在或已删除',
capture_invalid_state:'当前会话状态不允许此操作',
transcript_not_found:'转写草稿不存在或已删除',
transcript_confirm_failed:'转写确认失败，请重试',
transcript_reject_failed:'转写拒绝失败，请重试',
transcript_user_edit_protected:'草稿已确认，不能再次编辑',
report_list_failed:'报告列表加载失败，请重试',
report_read_failed:'报告详情加载失败，请重试',
report_not_found:'报告不存在或已删除',
delivery_audit_failed:'交付审计加载失败，请重试',
};
function mapError(e){
const code=e.code||e.message||'';
return errorMap[code]||'请求失败，请重试';
}

async function loadCaptures(reset=true){
const gen=++captureGeneration;
if(reset){capOffset=0;capItems=[];capHasMore=false}
try{
captureStatus.textContent=reset?'正在加载采集会话…':'正在加载更多…';
captureStatus.className='notice';
captureStatus.hidden=false;
refreshCaptures.disabled=true;
const response=await sbApi.json(`/api/study/capture-sessions?limit=100&offset=${capOffset}`,{signal:pageRequest.signal});
if(gen!==captureGeneration)return;
const items=Array.isArray(response.items)?response.items:[];
capItems=capItems.concat(items);
capHasMore=Boolean(response.has_more);
capOffset+=items.length;
capturesContainer.replaceChildren();
if(capItems.length===0){
captureStatus.textContent='暂无采集会话';
captureStatus.className='notice';
refreshCaptures.disabled=false;
return;
}
const list=document.createElement('div');
list.className='list';
for(const capture of capItems){
const item=document.createElement('div');
item.className='capture-item';
item.setAttribute('data-capture-id',capture.id);
const title=document.createElement('div');
title.className='item-title';
title.textContent=capture.original_name||capture.title||'未命名会话';
item.append(title);
const meta=document.createElement('div');
meta.className='meta';
const typeLabel=document.createElement('span');
typeLabel.className='badge';
typeLabel.textContent=kindLabel(capture.asset_kind);
meta.append(typeLabel);
const statusLabel=document.createElement('span');
statusLabel.className='badge';
statusLabel.textContent=sbState.label(capture.status,'状态未知');
meta.append(statusLabel);
item.append(meta);
const actions=document.createElement('div');
actions.className='action-group';
const viewBtn=document.createElement('button');
viewBtn.className='btn btn-sm';
viewBtn.type='button';
viewBtn.dataset.control='classroom-capture-detail';
viewBtn.dataset.captureId=capture.id;
viewBtn.textContent='查看详情';viewBtn.title='[查看] 查看详情 - 打开这条记录的详细信息';
viewBtn.setAttribute('aria-label','查看详情');
viewBtn.onclick=()=>viewCapture(capture.id);
actions.append(viewBtn);
item.append(actions);
list.append(item);
}
capturesContainer.append(list);
captureStatus.hidden=true;
loadMoreCaptures.hidden=!capHasMore;
if(capHasMore){
captureStatus.textContent=`已显示 ${capItems.length} 个会话（还有更多）`;
captureStatus.hidden=false;
}
refreshCaptures.disabled=false;
}catch(e){
if(e.name==='AbortError')return;
if(gen!==captureGeneration)return;
captureStatus.textContent=mapError(e);
captureStatus.className='notice warn';
captureStatus.setAttribute('role','alert');
captureStatus.hidden=false;
refreshCaptures.disabled=false;
}
}

async function loadReports(){
const gen=++reportGeneration;
try{
reportStatus.textContent='正在加载报告列表…';
reportStatus.className='notice';
reportStatus.hidden=false;
refreshReports.disabled=true;
const response=await sbApi.json('/api/study/reports?limit=100&offset=0',{signal:pageRequest.signal});
if(gen!==reportGeneration)return;
reportsContainer.replaceChildren();
if(!response.items||response.items.length===0){
reportStatus.textContent='暂无学习报告';
reportStatus.className='notice';
refreshReports.disabled=false;
return;
}
const list=document.createElement('div');
list.className='list';
for(const report of response.items){
const item=document.createElement('div');
item.className='report-item';
item.setAttribute('data-report-id',report.id);
item.dataset.control='classroom-report';
const title=document.createElement('div');
title.className='item-title';
title.textContent=`${sbState.label(report.report_kind,'报告')} · ${report.period_start||''}`;
item.append(title);
const viewBtn=document.createElement('button');
viewBtn.className='btn btn-sm';
viewBtn.type='button';
viewBtn.dataset.control='classroom-report-detail';
viewBtn.dataset.reportId=report.id;
viewBtn.textContent='查看详情';viewBtn.title='[查看] 查看详情 - 打开这条记录的详细信息';
viewBtn.setAttribute('aria-label','查看详情');
viewBtn.onclick=()=>viewReport(report.id);
item.append(viewBtn);
list.append(item);
}
reportsContainer.append(list);
reportStatus.hidden=true;
refreshReports.disabled=false;
}catch(e){
if(e.name==='AbortError')return;
if(gen!==reportGeneration)return;
reportStatus.textContent=mapError(e);
reportStatus.className='notice warn';
reportStatus.setAttribute('role','alert');
reportStatus.hidden=false;
refreshReports.disabled=false;
}
}

async function viewCapture(captureId){
const gen=++detailGeneration;
currentCaptureId=captureId;
currentReportId=null;
detailMode='capture';
try{
detailStatus.textContent='正在加载采集详情…';
detailStatus.className='notice';
detailStatus.hidden=false;
retryDetail.hidden=true;
detailContent.replaceChildren();
const capture=await sbApi.json(`/api/study/capture-sessions/${encodeURIComponent(captureId)}`,{signal:pageRequest.signal});
if(gen!==detailGeneration)return;
const container=document.createElement('div');
const heading=document.createElement('h3');
heading.textContent='采集会话详情';
container.append(heading);
const info=document.createElement('div');
info.className='meta-grid';
const nameRow=document.createElement('div');
const nameLabel=document.createElement('strong');
nameLabel.textContent='名称：';
nameRow.append(nameLabel);
const nameValue=document.createElement('span');
nameValue.textContent=capture.original_name||capture.title||'未命名';
nameRow.append(nameValue);
info.append(nameRow);
const kindRow=document.createElement('div');
const kindLabelNode=document.createElement('strong');
kindLabelNode.textContent='类型：';
kindRow.append(kindLabelNode);
const kindValue=document.createElement('span');
kindValue.textContent=kindLabel(capture.asset_kind);
kindRow.append(kindValue);
info.append(kindRow);
const statusRow=document.createElement('div');
const statusLabel=document.createElement('strong');
statusLabel.textContent='状态：';
statusRow.append(statusLabel);
const statusValue=document.createElement('span');
statusValue.textContent=sbState.label(capture.status,'未知');
statusRow.append(statusValue);
info.append(statusRow);
container.append(info);
const actions=document.createElement('div');
actions.className='action-group mt-12';
const transcriptBtn=document.createElement('button');
transcriptBtn.className='btn';
transcriptBtn.type='button';
transcriptBtn.dataset.control='classroom-transcript';
transcriptBtn.dataset.captureId=captureId;
transcriptBtn.textContent='查看转写稿';
transcriptBtn.setAttribute('aria-label','查看转写稿');
transcriptBtn.title='查看转写稿';
transcriptBtn.onclick=()=>viewTranscript(captureId);
actions.append(transcriptBtn);
if(capture.status==='review_required'&&capture.transcript_drafts&&capture.transcript_drafts.length>0){
const draft=capture.transcript_drafts[capture.transcript_drafts.length-1];
const confirmBtn=document.createElement('button');
confirmBtn.className='btn btn-primary';
confirmBtn.type='button';
confirmBtn.dataset.control='classroom-confirm-transcript';
confirmBtn.dataset.captureId=captureId;
confirmBtn.textContent='确认转写';
confirmBtn.setAttribute('aria-label','确认转写');
confirmBtn.title='确认转写';
confirmBtn.onclick=()=>confirmCapture(captureId,draft.id,confirmBtn);
actions.append(confirmBtn);
}
container.append(actions);
detailContent.append(container);
detailStatus.hidden=true;
}catch(e){
if(gen!==detailGeneration)return;
detailStatus.textContent=mapError(e);
detailStatus.className='notice warn';
detailStatus.setAttribute('role','alert');
detailStatus.hidden=false;
retryDetail.hidden=false;
}
}

async function viewTranscript(captureId){
const gen=++detailGeneration;
currentCaptureId=captureId;
currentReportId=null;
detailMode='transcript';
try{
detailStatus.textContent='正在加载转写稿…';
detailStatus.className='notice';
detailStatus.hidden=false;
retryDetail.hidden=true;
detailContent.replaceChildren();
const response=await sbApi.json(`/api/study/capture-sessions/${encodeURIComponent(captureId)}/transcript`,{signal:pageRequest.signal});
if(gen!==detailGeneration)return;
const container=document.createElement('div');
const heading=document.createElement('h3');
heading.textContent='转写稿';
container.append(heading);
if(!response.transcript_drafts||response.transcript_drafts.length===0){
const empty=document.createElement('div');
empty.className='notice';
empty.textContent='无转写内容';
container.append(empty);
detailContent.append(container);
detailStatus.hidden=true;
return;
}
const draft=response.transcript_drafts[response.transcript_drafts.length-1];
const textContainer=document.createElement('div');
textContainer.style.whiteSpace='pre-wrap';
textContainer.textContent=draft.text||'（空白转写）';
container.append(textContainer);
if(draft.segments&&draft.segments.length>0){
const segmentsHeading=document.createElement('h4');
segmentsHeading.className='mt-12';
segmentsHeading.textContent='分段详情';
container.append(segmentsHeading);
const segmentList=document.createElement('div');
for(const segment of draft.segments){
const segmentItem=document.createElement('div');
segmentItem.className='mt-6';
const segmentText=document.createElement('div');
segmentText.textContent=segment.text;
segmentItem.append(segmentText);
const segmentMeta=document.createElement('div');
segmentMeta.className='meta';
const qualityBadge=document.createElement('span');
qualityBadge.className='badge';
qualityBadge.textContent=QUALITY_LABEL[segment.quality]||'未知';
segmentMeta.append(qualityBadge);
const confidenceSpan=document.createElement('span');
confidenceSpan.textContent=`置信度：${(segment.confidence*100).toFixed(1)}%`;
segmentMeta.append(confidenceSpan);
segmentItem.append(segmentMeta);
segmentList.append(segmentItem);
}
container.append(segmentList);
}
detailContent.append(container);
detailStatus.hidden=true;
}catch(e){
if(gen!==detailGeneration)return;
detailStatus.textContent=mapError(e);
detailStatus.className='notice warn';
detailStatus.setAttribute('role','alert');
detailStatus.hidden=false;
retryDetail.hidden=false;
}
}

async function confirmCapture(captureId,draftId,btn){
if(busyConfirm)return;
busyConfirm=true;
if(btn)btn.disabled=true;
try{
detailStatus.textContent='正在确认转写…';
detailStatus.className='notice';
detailStatus.hidden=false;
await sbApi.json(`/api/study/capture-sessions/${encodeURIComponent(captureId)}/confirm`,{
method:'POST',
signal:pageRequest.signal,
headers:{'content-type':'application/json'},
body:JSON.stringify({draft_id:draftId})
});
detailStatus.textContent='转写已确认，已转为学习材料。';
detailStatus.className='notice';
detailStatus.hidden=false;
await loadCaptures(true);
await viewCapture(captureId);
}catch(e){
if(e.name!=='AbortError'){
detailStatus.textContent=mapError(e);
detailStatus.className='notice warn';
detailStatus.setAttribute('role','alert');
detailStatus.hidden=false;
}
if(btn)btn.disabled=false;
}finally{
busyConfirm=false;
}
}

async function viewReport(reportId){
const gen=++detailGeneration;
currentReportId=reportId;
currentCaptureId=null;
detailMode='report';
try{
detailStatus.textContent='正在加载报告详情…';
detailStatus.className='notice';
detailStatus.hidden=false;
retryDetail.hidden=true;
detailContent.replaceChildren();
const report=await sbApi.json(`/api/study/reports/${encodeURIComponent(reportId)}`,{signal:pageRequest.signal});
if(gen!==detailGeneration)return;
const container=document.createElement('div');
const heading=document.createElement('h3');
heading.textContent=`报告 · ${sbState.label(report.report_kind,'未知')}`;
container.append(heading);
const info=document.createElement('div');
info.className='meta-grid';
const periodRow=document.createElement('div');
const periodLabel=document.createElement('strong');
periodLabel.textContent='范围：';
periodRow.append(periodLabel);
const periodValue=document.createElement('span');
periodValue.textContent=`${report.period_start||''} 至 ${report.period_end||''}`;
periodRow.append(periodValue);
info.append(periodRow);
const statusRow=document.createElement('div');
const statusLabel=document.createElement('strong');
statusLabel.textContent='状态：';
statusRow.append(statusLabel);
const statusValue=document.createElement('span');
statusValue.textContent=sbState.label(report.status,'未知');
statusRow.append(statusValue);
info.append(statusRow);
container.append(info);
const actions=document.createElement('div');
actions.className='action-group mt-12';
const auditBtn=document.createElement('button');
auditBtn.className='btn';
auditBtn.type='button';
auditBtn.textContent='查看交付审计';
auditBtn.onclick=()=>viewDeliveryAudit(reportId);
actions.append(auditBtn);
container.append(actions);
detailContent.append(container);
detailStatus.hidden=true;
}catch(e){
if(gen!==detailGeneration)return;
detailStatus.textContent=mapError(e);
detailStatus.className='notice warn';
detailStatus.setAttribute('role','alert');
detailStatus.hidden=false;
retryDetail.hidden=false;
}
}

async function viewDeliveryAudit(reportId){
const gen=++detailGeneration;
currentReportId=reportId;
currentCaptureId=null;
detailMode='audit';
try{
detailStatus.textContent='正在加载交付审计…';
detailStatus.className='notice';
detailStatus.hidden=false;
retryDetail.hidden=true;
detailContent.replaceChildren();
const response=await sbApi.json(`/api/study/reports/${encodeURIComponent(reportId)}/delivery-attempts`,{signal:pageRequest.signal});
if(gen!==detailGeneration)return;
const container=document.createElement('div');
const heading=document.createElement('h3');
heading.textContent='交付审计';
container.append(heading);
if(!response.items||response.items.length===0){
const empty=document.createElement('div');
empty.className='notice';
empty.textContent='暂无交付记录';
container.append(empty);
}else{
const list=document.createElement('div');
list.className='list';
for(const attempt of response.items){
const item=document.createElement('div');
item.className='list-item';
const modeLabel=document.createElement('div');
modeLabel.className='list-title';
modeLabel.textContent=`模式：${sbState.label(attempt.mode,'未知')}`;
item.append(modeLabel);
const meta=document.createElement('div');
meta.className='meta';
const statusBadge=document.createElement('span');
statusBadge.className='badge';
statusBadge.textContent=sbState.label(attempt.status,'未知');
meta.append(statusBadge);
if(attempt.error_code){
const errorSpan=document.createElement('span');
errorSpan.textContent=mapError({code:attempt.error_code});
meta.append(errorSpan);
}
item.append(meta);
list.append(item);
}
container.append(list);
}
const notice=document.createElement('div');
notice.className='notice mt-12';
notice.textContent='交付功能仅支持 off/dry-run 模式。live 交付被系统明确禁用。';
container.append(notice);
detailContent.append(container);
detailStatus.hidden=true;
}catch(e){
if(gen!==detailGeneration)return;
detailStatus.textContent=mapError(e);
detailStatus.className='notice warn';
detailStatus.setAttribute('role','alert');
detailStatus.hidden=false;
retryDetail.hidden=false;
}
}

retryDetail.onclick=()=>{
if(detailMode==='capture'&&currentCaptureId){
viewCapture(currentCaptureId);
}else if(detailMode==='transcript'&&currentCaptureId){
viewTranscript(currentCaptureId);
}else if(detailMode==='report'&&currentReportId){
viewReport(currentReportId);
}else if(detailMode==='audit'&&currentReportId){
viewDeliveryAudit(currentReportId);
}
};

refreshCaptures.addEventListener('click',()=>loadCaptures(true));
loadMoreCaptures.addEventListener('click',()=>loadCaptures(false));
refreshReports.addEventListener('click',loadReports);
loadCaptures(true);
loadReports();

// Deep links: classroom.html?capture_id=... or ?report_id=... opens the detail view.
const params=new URLSearchParams(location.search);
const deepCapture=params.get('capture_id');
const deepReport=params.get('report_id');
if(deepCapture)viewCapture(deepCapture);
else if(deepReport)viewReport(deepReport);
})();
</script>
</body>
</html>
