<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 学习计划</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">学习计划 · 目标与节奏</p><h1>目标与计划</h1><p class="lead">建立学习目标，安排学习项，并管理学习节奏。</p></div></div><div class="grid"><section class="card span-4" data-od-id="plans-sidebar"><h2>目标与模块</h2><div id="goal-status" class="notice" role="status"></div><form id="goal-form" class="stack"><div class="field"><label for="goal-title">目标名称</label><input id="goal-title" maxlength="400" required></div><button class="btn btn-primary" type="submit">新建目标</button></form><ul id="goals" class="goal-list"></ul><div id="module-status" class="notice mt-16" role="status"></div><form id="module-form" class="stack"><div class="field"><label for="module-title">模块名称</label><input id="module-title" maxlength="400" required></div><button class="btn" type="submit">新建模块</button></form><ul id="modules" class="module-list"></ul></section><section class="card span-8" data-od-id="plans-main"><h2>学习计划</h2><div id="plan-status" class="notice" role="status" aria-live="polite">正在加载计划…</div><form id="plan-form" class="stack"><div class="field"><label for="plan-title">计划名称</label><input id="plan-title" maxlength="400" required></div><div class="field"><label for="plan-goal">所属目标</label><select id="plan-goal" required></select></div><button class="btn btn-primary" type="submit">新建计划草稿</button></form><ul id="plans" class="plan-list"></ul><div id="plan-detail" class="plan-detail" hidden></div><button id="refresh-all" class="btn mt-16" type="button">刷新数据</button></section></div></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){
const request=sbApi.setPageScope('plans'),goalsRoot=document.querySelector('#goals'),modulesRoot=document.querySelector('#modules'),plansRoot=document.querySelector('#plans'),goalStatus=document.querySelector('#goal-status'),moduleStatus=document.querySelector('#module-status'),status=document.querySelector('#plan-status'),detail=document.querySelector('#plan-detail'),goalSelect=document.querySelector('#plan-goal');let goals=[],modules=[],plans=[],selected=null,busy=false,generation=0,selectionGeneration=0,mutationGeneration=0;
const text=value=>typeof value==='string'?value:'';const json=(url,options)=>sbApi.json(url,Object.assign({signal:request.signal},options||{}));
function setStatus(message,kind){status.className='notice'+(kind?' '+kind:'');status.textContent=message}function setBusy(value){busy=value;document.querySelectorAll('button,input,select,textarea').forEach(node=>{if(node.id!=='refresh-all')node.disabled=value})}function button(label,handler,id){const node=document.createElement('button');node.className='btn';node.type='button';node.textContent=label;if(id)node.id=id;node.onclick=handler;return node}
function errorMessage(error){return ({study_rhythm_not_configured:'请先保存学习节奏',study_rhythm_edit_not_allowed:'当前计划或学习项不可编辑节奏',study_rhythm_allocation_duplicate:'该学习项当天已有分配',study_rhythm_allocation_limit_exceeded:'计划工作量超过允许上限',study_rhythm_invalid_date:'请输入有效日期',study_rhythm_invalid_timezone:'请输入 IANA 时区，例如 Asia/Shanghai',study_rhythm_target_out_of_range:'目标分钟数超出范围',study_plan_dependency_cycle:'检测到依赖环，未保存',study_plan_edit_not_allowed:'当前计划不能编辑'})[error.code]||'计划操作失败，可重试'}
function renderLists(){goalsRoot.replaceChildren();goalSelect.replaceChildren();goals.forEach(goal=>{const item=document.createElement('li');item.className='goal-item';item.textContent=text(goal.title)||'未命名目标';item.append(Object.assign(document.createElement('span'),{className:'status-badge',textContent:sbState.label(goal.status)}));goalsRoot.append(item);if(goal.status!=='archived'){const option=new Option(text(goal.title),goal.id);goalSelect.append(option)}});modulesRoot.replaceChildren();modules.forEach(module=>{const item=document.createElement('li');item.className='module-item';item.textContent=text(module.title)||'未命名模块';modulesRoot.append(item)});plansRoot.replaceChildren();plans.forEach(plan=>{const item=document.createElement('li');item.className='plan-item'+(plan.id===selected?' selected':'');item.tabIndex=0;item.setAttribute('role','button');item.append(document.createTextNode(text(plan.title)||'未命名计划'),Object.assign(document.createElement('div'),{className:'item-meta muted',textContent:(plan.item_count||0)+' 个项目 · '+sbState.label(plan.status)}));const select=()=>{if(plan.id!==selected||detail.hidden)selectPlan(plan.id)};item.onclick=select;item.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select()}};plansRoot.append(item)})}
async function load(){const run=++generation;goalStatus.textContent='正在加载目标…';moduleStatus.textContent='正在加载模块…';setStatus('正在加载计划…');try{[goals,modules,plans]=await Promise.all([json('/api/study/goals'),json('/api/study/modules'),json('/api/study/plans')]);if(run!==generation)return;goalStatus.textContent=goals.length?'':'暂无目标';moduleStatus.textContent=modules.length?'':'暂无模块';renderLists();const requested=new URLSearchParams(location.search).get('plan_id'),next=plans.find(plan=>plan.id===requested)||plans.find(plan=>plan.id===selected);if(next)await selectPlan(next.id);else{detail.hidden=true;setStatus(goals.length?'请选择或创建学习计划':'请先创建学习目标')}}catch(error){const message=sbApi.safeError(error);goalStatus.textContent=message;moduleStatus.textContent=message;setStatus(message,'warn')}}
async function mutate(action,success){if(busy)return;const mutationRun=++mutationGeneration;setBusy(true);try{const result=await action();if(result&&result.id&&plans.some(plan=>plan.id===result.id))selected=result.id;await load();if(mutationRun===mutationGeneration)setStatus(success,'status-ready')}catch(error){if(mutationRun===mutationGeneration)setStatus(errorMessage(error),'warn')}finally{if(mutationRun===mutationGeneration)setBusy(false)}}
document.querySelector('#goal-form').onsubmit=event=>{event.preventDefault();const title=document.querySelector('#goal-title').value.trim();if(title)mutate(()=>json('/api/study/goals',{method:'POST',body:JSON.stringify({title})}),'目标已创建')};document.querySelector('#module-form').onsubmit=event=>{event.preventDefault();const title=document.querySelector('#module-title').value.trim();if(title)mutate(()=>json('/api/study/modules',{method:'POST',body:JSON.stringify({title})}),'模块已创建')};document.querySelector('#plan-form').onsubmit=event=>{event.preventDefault();const title=document.querySelector('#plan-title').value.trim(),goal_id=goalSelect.value;if(!title||!goal_id){setStatus('请输入计划名称并选择目标','warn');return}mutate(async()=>{const plan=await json('/api/study/plans',{method:'POST',body:JSON.stringify({title,goal_id})});selected=plan.id},'计划草稿已创建')};document.querySelector('#refresh-all').onclick=load;
function addItemEditor(plan){const form=document.createElement('form');form.className='stack mt-16';const title=document.createElement('input');title.id='plan-item-title';title.placeholder='新增学习项';title.required=true;const module=document.createElement('select');module.id='plan-item-module';module.append(new Option('不绑定模块',''));modules.filter(value=>value.status!=='archived').forEach(value=>module.append(new Option(text(value.title),value.id)));const add=button('添加学习项',()=>{if(title.value.trim())mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/items',{method:'POST',body:JSON.stringify({title:title.value,module_id:module.value||null})}),'学习项已添加')},'plan-item-add');form.append(title,module,add);form.onsubmit=event=>event.preventDefault();return form}
function addItems(plan){const root=document.createElement('div');root.className='plan-items';(plan.items||[]).forEach(item=>{const row=document.createElement('div');row.className='plan-item-entry';const editable=['draft','confirmed'].includes(plan.status)&&!['completed','skipped','archived'].includes(item.status);const title=document.createElement('input');title.value=text(item.title);title.setAttribute('aria-label','学习项 '+text(item.title));title.disabled=!editable;const position=document.createElement('input');position.type='number';position.min='0';position.value=item.position||0;position.setAttribute('aria-label','学习项排序');position.disabled=!editable;row.append(title,position,Object.assign(document.createElement('span'),{className:'muted',textContent:sbState.label(item.status)}),Object.assign(document.createElement('span'),{className:'muted',textContent:'来源: '+sbState.source(sbState.sourceForItem(item,plan.source_links))}));if(editable){row.append(button('保存学习项',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/items/'+encodeURIComponent(item.id),{method:'PATCH',body:JSON.stringify({title:title.value,position:Number(position.value)})}),'学习项已保存')),button('归档学习项',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/items/'+encodeURIComponent(item.id)+'/archive',{method:'POST'}),'学习项已归档')))}if(plan.status==='active'&&!['completed','archived'].includes(item.status))row.append(button('完成学习项',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/items/'+encodeURIComponent(item.id)+'/progress',{method:'POST',body:JSON.stringify({event_type:'completed'})}),'学习进度已保存')));root.append(row)});return root}
function addDependencyEditor(plan){if(!['draft','confirmed'].includes(plan.status)||(plan.items||[]).length<2)return null;const form=document.createElement('form');form.className='stack mt-16';const before=document.createElement('select'),after=document.createElement('select');before.id='plan-dependency-predecessor';after.id='plan-dependency-successor';plan.items.filter(item=>item.status!=='archived').forEach(item=>{before.append(new Option(text(item.title),item.id));after.append(new Option(text(item.title),item.id))});const submit=button('添加依赖',()=>{if(before.value===after.value){setStatus('依赖关系无效','warn');return}mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/dependencies',{method:'POST',body:JSON.stringify({predecessor_item_id:before.value,successor_item_id:after.value})}),'依赖已添加')});form.append(before,after,submit);form.onsubmit=event=>event.preventDefault();return form}
async function renderRhythm(plan){const root=document.createElement('section');root.className='rhythm-workspace';root.append(Object.assign(document.createElement('h3'),{className:'detail-section-title',textContent:'学习节奏'}));detail.append(root);try{const [settings,allocations]=await Promise.all([json('/api/study/plans/'+encodeURIComponent(plan.id)+'/rhythm'),json('/api/study/plans/'+encodeURIComponent(plan.id)+'/rhythm/allocations')]);const configured=settings.settings||{};const form=document.createElement('form');form.className='stack';const cadence=document.createElement('select');cadence.id='rhythm-cadence';cadence.append(new Option('每日','daily'),new Option('每周','weekly'));cadence.value=configured.cadence||'daily';const zone=document.createElement('input');zone.id='rhythm-timezone';zone.value=configured.timezone||'Asia/Shanghai';const start=document.createElement('input');start.id='rhythm-period-start';start.type='date';start.value=configured.period_start||new Date().toISOString().slice(0,10);const target=document.createElement('input');target.id='rhythm-target-minutes';target.type='number';target.min='0';target.max='10080';target.value=configured.target_minutes||60;const save=button('保存节奏设置',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/rhythm',{method:'PUT',body:JSON.stringify({cadence:cadence.value,timezone:zone.value,period_start:start.value,target_minutes:Number(target.value)})}),'学习节奏已保存'));form.append('周期',cadence,'时区',zone,'起始日',start,'目标分钟',target,save);form.onsubmit=event=>event.preventDefault();root.append(form);const item=document.createElement('select');item.id='rhythm-item';(plan.items||[]).filter(value=>!['completed','archived'].includes(value.status)).forEach(value=>item.append(new Option(text(value.title),value.id)));const date=document.createElement('input');date.id='rhythm-date';date.type='date';date.value=start.value;const minutes=document.createElement('input');minutes.id='rhythm-minutes';minutes.type='number';minutes.min='1';minutes.max='1440';minutes.value='30';const allocation=document.createElement('form');allocation.className='stack mt-16';const add=button('添加分配',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/rhythm/allocations',{method:'POST',body:JSON.stringify({item_id:item.value,local_date:date.value,planned_minutes:Number(minutes.value)})}),'学习项已分配'));add.disabled=!settings.settings||!item.options.length;allocation.append(Object.assign(document.createElement('h4'),{textContent:'分配学习项'}),item,date,minutes,add);allocation.onsubmit=event=>event.preventDefault();root.append(allocation);allocations.forEach(value=>{const row=document.createElement('div');row.className='plan-item-entry';const valueDate=document.createElement('input');valueDate.type='date';valueDate.value=value.local_date;const valueMinutes=document.createElement('input');valueMinutes.type='number';valueMinutes.value=value.planned_minutes;row.append(document.createTextNode('已分配 '+value.planned_minutes+' 分钟'),valueDate,valueMinutes,button('调整',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/rhythm/allocations/'+encodeURIComponent(value.id),{method:'PATCH',body:JSON.stringify({local_date:valueDate.value,planned_minutes:Number(valueMinutes.value)})}),'学习项分配已调整')),button('删除分配',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/rhythm/allocations/'+encodeURIComponent(value.id),{method:'DELETE'}),'学习项分配已删除')));root.append(row)})}catch(error){root.append(Object.assign(document.createElement('div'),{className:'notice warn',textContent:'节奏加载失败，可重试。'}))}}
async function selectPlan(id){const selectionRun=++selectionGeneration,mutationRun=mutationGeneration;selected=id;history.replaceState({},'','/app/plans.html?plan_id='+encodeURIComponent(id));try{const plan=await json('/api/study/plans/'+encodeURIComponent(id));if(selectionRun!==selectionGeneration)return;detail.hidden=false;detail.replaceChildren();const heading=document.createElement('h3');heading.textContent=text(plan.title);detail.append(heading,Object.assign(document.createElement('div'),{className:'notice',textContent:'状态：'+sbState.label(plan.status)}));const edit=document.createElement('form');edit.className='stack mt-16';const title=document.createElement('input');title.value=text(plan.title);title.setAttribute('aria-label','计划名称');const description=document.createElement('textarea');description.value=text(plan.description);description.setAttribute('aria-label','计划描述');const save=button('保存计划编辑',()=>{});save.type='submit';edit.append(title,description,save);edit.onsubmit=event=>{event.preventDefault();mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id),{method:'PATCH',body:JSON.stringify({title:title.value,description:description.value})}),'计划编辑保存')};if(!['draft','confirmed'].includes(plan.status)){title.disabled=true;description.disabled=true;save.disabled=true}detail.append(edit);const transitions={draft:[['确认草稿','confirm']],confirmed:[['激活计划','activate']],active:[['暂停计划','pause'],['完成计划','complete']],paused:[['恢复计划','activate'],['完成计划','complete']]};const actions=document.createElement('div');actions.className='stack-actions';(transitions[plan.status]||[]).forEach(([label,action])=>actions.append(button(label,()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/'+action,{method:'POST'}),label+'成功'))));if(plan.status!=='archived')actions.append(button('归档计划',()=>mutate(()=>json('/api/study/plans/'+encodeURIComponent(plan.id)+'/archive',{method:'POST'}),'计划已归档')));detail.append(actions);if(['draft','confirmed'].includes(plan.status))detail.append(addItemEditor(plan));detail.append(addItems(plan));const dependency=addDependencyEditor(plan);if(dependency)detail.append(dependency);await renderRhythm(plan);if(selectionRun===selectionGeneration&&mutationRun===mutationGeneration)setStatus('计划已加载')}catch(error){if(selectionRun===selectionGeneration&&mutationRun===mutationGeneration)setStatus(sbApi.safeError(error),'warn')}}load()})();</script></body></html>
