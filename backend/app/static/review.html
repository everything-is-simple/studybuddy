<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 复盘</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">学习复盘</p>
<h1>错题与薄弱点</h1>
<p class="lead">查看错误原因、来源状态，并在需要时再次练习。</p>
</div>
<a class="btn" href="/app/practice.html">返回练习</a>
</div>

<section class="card" data-od-id="review-mistakes">
<h2>错题清单</h2>
<div id="review-status" class="notice" role="status" aria-live="polite">正在加载复盘…</div>
<label class="mt-12" id="archived-filter">
<input type="checkbox" id="show-archived">
显示已归档
</label>
<div id="review-list"></div>
<button id="retry-review" class="btn mt-16" type="button" hidden>重试</button>
<button id="load-more-review" class="btn mt-16" type="button" hidden>加载更多</button>
</section>

<section class="card mt-24" data-od-id="review-weak-points">
<h2>薄弱点汇总</h2>
<div id="weak-point-status" class="notice" role="status" aria-live="polite">正在加载薄弱点…</div>
<div id="weak-points" class="stack"></div>
<button id="retry-weak-points" class="btn mt-16" type="button" hidden>重试</button>
</section>
</main>
</div>
<script src="/app/js/api.js"></script>
<script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script src="/app/js/templates.js"></script>
<script>
(function(){
const params=new URLSearchParams(location.search),request=sbApi.setPageScope('review'),status=document.querySelector('#review-status'),list=document.querySelector('#review-list'),retry=document.querySelector('#retry-review'),loadMoreButton=document.querySelector('#load-more-review'),weakStatus=document.querySelector('#weak-point-status'),weakList=document.querySelector('#weak-points'),weakRetry=document.querySelector('#retry-weak-points'),showArchivedInput=document.querySelector('#show-archived');
let saved=null;
try{saved=JSON.parse(sessionStorage.getItem('review:state')||'null')}catch(_){saved=null}
let selectedId=params.get('mistake_id')||params.get('id')||(saved&&saved.mistake_id)||null;
let showArchived=params.get('show_archived')==='1'||(params.get('show_archived')===null&&Boolean(saved&&saved.show_archived));
let generation=0,detailGeneration=0,weakGeneration=0,lastItems=[],listHasMore=false,listBusy=false;
const busy=new Set();

function text(value){return typeof value==='string'?value:''}
function show(message,kind){sbTemplates.showStatus(status,message,kind||'')}
function makeButton(label,handler){const button=document.createElement('button');button.className='btn';button.type='button';button.textContent=label;button.addEventListener('click',()=>handler(button));return button}
function sourceLabel(value){return sbState.source(value||'valid')}

function syncState(){
const url=new URL(location.href);
if(selectedId)url.searchParams.set('mistake_id',selectedId);else url.searchParams.delete('mistake_id');
if(showArchived)url.searchParams.set('show_archived','1');else url.searchParams.delete('show_archived');
try{history.replaceState(null,'',url.toString())}catch(_){}
try{sessionStorage.setItem('review:state',JSON.stringify({mistake_id:selectedId,show_archived:showArchived}))}catch(_){}
}

function renderSource(occurrence){
if(!occurrence||occurrence.source_status==='valid')return null;
const node=document.createElement('div');
node.className='notice warn mt-12';
node.textContent='来源状态：'+sourceLabel(occurrence.source_status);
return node;
}

function renderFeedbackEvents(events){
const box=document.createElement('div');
box.className='review-feedback mt-12';
const heading=document.createElement('strong');
heading.textContent='反馈记录';
box.append(heading);
if(!events.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='暂无反馈记录';box.append(empty);return box}
events.forEach(event=>{const row=document.createElement('p');row.className='muted';row.textContent=`${text(event.event_kind)||'反馈'}：${text(event.content)||'已记录'}`;box.append(row)});
return box;
}

function renderSourceLink(data,occurrence){
if(!occurrence||occurrence.source_status!=='valid'||!data.source_material_id)return null;
const link=document.createElement('a');
link.className='btn mt-12';
link.rel='noopener';
link.href='/app/material-detail.html?material='+encodeURIComponent(data.source_material_id);
link.textContent='查看来源材料';
return link;
}

function renderDetail(data,row){
row.querySelector('.mistake-detail')?.remove();
const detail=document.createElement('div');
detail.className='mistake-detail notice mt-12';
const question=document.createElement('p');
const questionLabel=document.createElement('strong');
questionLabel.textContent='题面：';
question.append(questionLabel,document.createTextNode(text(data.question)||'题目'));
detail.append(question);
const state=document.createElement('p');
state.className='muted';
state.textContent='状态：'+sbState.label(data.status||'open');
detail.append(state);
const occurrence=(data.occurrences||[]).slice(-1)[0];
const source=renderSource(occurrence);
if(source)detail.append(source);
const sourceLink=renderSourceLink(data,occurrence);
if(sourceLink)detail.append(sourceLink);
detail.append(renderFeedbackEvents(Array.isArray(data.feedback_events)?data.feedback_events:[]));
const feedback=document.createElement('textarea');
feedback.className='review-feedback-input';
feedback.setAttribute('aria-label','复盘反馈');
feedback.placeholder='可选：填写复盘反馈或修正说明';
feedback.maxLength=2000;
const actions=document.createElement('div');
actions.className='stack-actions mt-12';
const attemptId=occurrence&&occurrence.attempt_id;
if(attemptId){
actions.append(makeButton('提交复核',button=>reviewAttempt(attemptId,'incorrect',feedback.value,button)));
actions.append(makeButton('标记为错题',button=>markAttempt(attemptId,feedback.value,button)));
}
actions.append(makeButton('保存反馈',button=>submitFeedback(data.id,feedback.value,button)));
actions.append(makeButton('标记已掌握',button=>markMastered(data.id,feedback.value,button)));
detail.append(document.createTextNode('复盘反馈'),feedback,actions);
row.append(detail);
}

function renderDetailError(id,row,loading,message){
loading.className='mistake-detail notice warn mt-12';
loading.replaceChildren(document.createTextNode(message+'\u3000'));
const button=document.createElement('button');
button.className='btn retry-detail';
button.type='button';
button.textContent='重试';
button.addEventListener('click',()=>loadDetail(id,row,button));
loading.append(button);
}

function render(items){
lastItems=Array.isArray(items)?items:[];
const visible=showArchived?lastItems:lastItems.filter(item=>item.status!=='archived');
list.replaceChildren();
if(!lastItems.length){show('暂无错题记录');loadMoreButton.hidden=true;return}
status.textContent='';
status.hidden=true;
const hiddenArchived=showArchived?0:lastItems.length-visible.length;
if(hiddenArchived>0){
const hint=document.createElement('p');
hint.className='muted mt-12';
hint.dataset.reviewHint='archived-hidden';
hint.textContent=`已归档 ${hiddenArchived} 条错题已隐藏，勾选「显示已归档」可查看`;
list.append(hint);
}
visible.forEach(item=>{
const row=document.createElement('article');
row.className='card mt-12';
row.dataset.mistakeId=item.id;
const title=document.createElement('h3');
title.textContent=text(item.question)||'题目';
row.append(title);
const state=document.createElement('p');
state.className='muted';
state.textContent='状态：'+sbState.label(item.status||'open');
row.append(state);
if(item.mistake_fact){const fact=document.createElement('p');fact.textContent='错误原因：'+text(item.mistake_fact);row.append(fact)}
if(item.weak_point){const weak=document.createElement('p');weak.className='muted';weak.textContent='薄弱点：'+text(item.weak_point);row.append(weak)}
const source=renderSource((item.occurrences||[]).slice(-1)[0]);
if(source)row.append(source);
const actions=document.createElement('div');
actions.className='stack-actions';
actions.append(makeButton('查看详情',button=>loadDetail(item.id,row,button)));
const redo=makeButton('再次练习',button=>redoMistake(item.id,button));
const archive=makeButton('归档',button=>archiveMistake(item.id,button));
if(item.status==='archived'){redo.disabled=true;archive.disabled=true}
actions.append(redo,archive);
row.append(actions);
list.append(row);
if(item.id===selectedId)loadDetail(item.id,row);
});
loadMoreButton.hidden=!listHasMore;
}

async function load(){
const run=++generation;
show('正在加载复盘…');
retry.hidden=true;
loadMoreButton.hidden=true;
list.replaceChildren();
try{
const data=await sbApi.json('/api/study/mistakes?limit=20&offset=0',{signal:request.signal});
if(run!==generation)return;
const page=Array.isArray(data)?{items:data,has_more:false}:{items:data.items||[],has_more:Boolean(data.has_more)};
listHasMore=page.has_more;
render(page.items);
}catch(error){
if(run!==generation)return;
show(sbApi.safeError(error),'error');
retry.hidden=false;
}
}

async function loadMore(){
if(listBusy||!listHasMore)return;
const run=++generation;
listBusy=true;
loadMoreButton.disabled=true;
loadMoreButton.textContent='正在加载…';
try{
const data=await sbApi.json('/api/study/mistakes?limit=20&offset='+lastItems.length,{signal:request.signal});
if(run!==generation)return;
const page=Array.isArray(data)?{items:data,has_more:false}:{items:data.items||[],has_more:Boolean(data.has_more)};
lastItems=lastItems.concat(page.items);
listHasMore=page.has_more;
render(lastItems);
}catch(error){
if(run===generation)show(sbApi.safeError(error),'error');
}finally{
listBusy=false;
loadMoreButton.disabled=false;
loadMoreButton.textContent='加载更多';
}
}

async function loadWeakPoints(){
const run=++weakGeneration;
weakStatus.hidden=false;
weakStatus.className='notice';
weakStatus.textContent='正在加载薄弱点…';
weakRetry.hidden=true;
weakList.replaceChildren();
try{
const data=await sbApi.json('/api/study/weak-points',{signal:request.signal});
if(run!==weakGeneration)return;
const items=Array.isArray(data)?data:data.items||[];
if(!items.length){weakStatus.textContent='暂无薄弱点记录';return}
weakStatus.hidden=true;
items.forEach(item=>{
const row=document.createElement('article');
row.className='item-card';
const title=document.createElement('strong');
title.textContent='练习题 '+(text(item.exercise_id)||'未知题目');
row.append(title);
const meta=document.createElement('p');
meta.className='muted';
meta.textContent=`出现 ${Number(item.occurrence_count)||0} 次 · 未解决 ${Number(item.open_count)||0} · 已修复 ${Number(item.fixed_count)||0}`;
row.append(meta);
if(Number(item.source_warning_count)>0){const warning=document.createElement('p');warning.className='notice warn';warning.textContent='部分来源当前不可用';row.append(warning)}
weakList.append(row);
});
}catch(error){
if(run!==weakGeneration)return;
weakStatus.className='notice error';
weakStatus.textContent=sbApi.safeError(error);
weakRetry.hidden=false;
}
}

function clearDetails(){list.querySelectorAll('.mistake-detail').forEach(node=>node.remove())}

async function loadDetail(id,row,trigger){
selectedId=id;
syncState();
const run=++detailGeneration;
clearDetails();
const loading=document.createElement('div');
loading.className='mistake-detail notice mt-12';
loading.textContent='正在加载错题详情…';
row.append(loading);
try{
const data=await sbApi.json(`/api/study/mistakes/${encodeURIComponent(id)}`,{signal:request.signal});
if(run!==detailGeneration)return;
loading.remove();
renderDetail(data,row);
}catch(error){
if(run!==detailGeneration)return;
renderDetailError(id,row,loading,sbApi.safeError(error));
}
}

async function post(url,payload,key,button){
if(busy.has(key))return null;
busy.add(key);
if(button)sbTemplates.setBusy(button,true);
try{
const options={method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':sbApi.idempotencyKey()},body:JSON.stringify(payload||{}),signal:request.signal};
return await sbApi.json(url,options);
}catch(error){
show(sbApi.safeError(error),'error');
return null;
}finally{
busy.delete(key);
if(button)sbTemplates.setBusy(button,false);
}
}

async function mutateAttempt(attemptId,kind,url,payload,button){
const data=await post(url,payload,kind+attemptId,button);
if(data){await load();show(kind==='review'?'复核已提交':'已标记为错题')}
}

async function reviewAttempt(attemptId,decision,feedback,button){
return mutateAttempt(attemptId,'review',`/api/study/attempts/${encodeURIComponent(attemptId)}/review`,{decision,feedback},button)
}

async function markAttempt(attemptId,feedback,button){
return mutateAttempt(attemptId,'mark',`/api/study/attempts/${encodeURIComponent(attemptId)}/mark-mistake`,{feedback},button)
}

async function submitFeedback(id,content,button){
if(!content.trim()){show('请输入复盘反馈','error');return}
const data=await post(`/api/study/mistakes/${encodeURIComponent(id)}/feedback`,{event_kind:'user_note',content},'feedback'+id,button);
if(data){await load();show('复盘反馈已保存')}
}

async function markMastered(id,content,button){
const note=(content||'').trim()||'标记为已掌握';
const data=await post(`/api/study/mistakes/${encodeURIComponent(id)}/feedback`,{event_kind:'user_correction',content:note},'mastered'+id,button);
if(data){await load();show('已标记为已掌握')}
}

async function archiveMistake(id,button){
const data=await post(`/api/study/mistakes/${encodeURIComponent(id)}/archive`,{},'archive'+id,button);
if(data){await load();show('错题已归档')}
}

async function redoMistake(id,button){
const data=await post(`/api/study/mistakes/${encodeURIComponent(id)}/redo`,{},'redo'+id,button);
if(data&&data.id){show('已创建再次练习会话');location.href='/app/practice-session.html?session_id='+encodeURIComponent(data.id);return}
if(data){await load();show('已创建再次练习会话')}
}

retry.addEventListener('click',load);
loadMoreButton.addEventListener('click',loadMore);
weakRetry.addEventListener('click',loadWeakPoints);
showArchivedInput.checked=showArchived;
showArchivedInput.addEventListener('change',()=>{showArchived=showArchivedInput.checked;syncState();render(lastItems)});
syncState();
load();
loadWeakPoints();
})();
</script>
</body></html>
