<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 复盘</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">学习复盘</p><h1>错题与薄弱点</h1><p class="lead">查看错误原因、来源状态，并在需要时再次练习。</p></div><a class="btn" href="/app/practice.html">返回练习</a></div><section class="card"><div id="review-status" class="notice" role="status" aria-live="polite">正在加载复盘…</div><div id="review-list"></div><button id="retry-review" class="btn mt-16" type="button" hidden>重试</button></section></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){
const params=new URLSearchParams(location.search),initialId=params.get('mistake_id')||params.get('id'),request=sbApi.setPageScope('review'),status=document.querySelector('#review-status'),list=document.querySelector('#review-list'),retry=document.querySelector('#retry-review');let generation=0,selectedId=initialId,busy=new Set();
function text(value){return typeof value==='string'?value:''}function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}function makeButton(label,handler){const button=document.createElement('button');button.className='btn';button.type='button';button.textContent=label;button.addEventListener('click',handler);return button}function sourceLabel(value){return sbState.source(value||'valid')}
function renderSource(occurrence){if(!occurrence||occurrence.source_status==='valid')return null;const node=document.createElement('div');node.className='notice warn mt-12';node.textContent='来源状态：'+sourceLabel(occurrence.source_status);return node}
function renderFeedbackEvents(events){const box=document.createElement('div');box.className='review-feedback mt-12';const heading=document.createElement('strong');heading.textContent='反馈记录';box.append(heading);if(!events.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='暂无反馈记录';box.append(empty);return box}events.forEach(event=>{const row=document.createElement('p');row.className='muted';row.textContent=`${text(event.event_kind)||'反馈'}：${text(event.content)||'已记录'}`;box.append(row)});return box}
function renderDetail(data,row){row.querySelector('.mistake-detail')?.remove();const detail=document.createElement('div');detail.className='mistake-detail notice mt-12';const occurrence=(data.occurrences||[]).slice(-1)[0];detail.append(renderSource(occurrence)||document.createTextNode('来源有效'));detail.append(renderFeedbackEvents(Array.isArray(data.feedback_events)?data.feedback_events:[]));const attemptId=occurrence?.attempt_id;const actions=document.createElement('div');actions.className='stack-actions mt-12';if(attemptId){const reviewButton=makeButton('提交复核',()=>reviewAttempt(attemptId,'incorrect',feedback.value));const markButton=makeButton('标记为错题',()=>markAttempt(attemptId,feedback.value));actions.append(reviewButton,markButton)}const feedback=document.createElement('textarea');feedback.className='review-feedback-input';feedback.setAttribute('aria-label','复盘反馈');feedback.placeholder='可选：填写复盘反馈或修正说明';feedback.maxLength=2000;const feedbackButton=makeButton('保存反馈',()=>submitFeedback(data.id,feedback.value));actions.append(feedbackButton);detail.append(document.createTextNode('复盘反馈'),feedback,actions);row.append(detail)}
function render(items){list.replaceChildren();if(!items.length){show('暂无错题记录');return}status.hidden=true;items.forEach(item=>{const row=document.createElement('article');row.className='card mt-12';row.dataset.mistakeId=item.id;const title=document.createElement('h3');title.textContent=text(item.question)||'题目';row.append(title);const state=document.createElement('p');state.className='muted';state.textContent='状态：'+sbState.label(item.status||'open');row.append(state);if(item.mistake_fact){const fact=document.createElement('p');fact.textContent='错误原因：'+text(item.mistake_fact);row.append(fact)}if(item.weak_point){const weak=document.createElement('p');weak.className='muted';weak.textContent='薄弱点：'+text(item.weak_point);row.append(weak)}const source=renderSource((item.occurrences||[]).slice(-1)[0]);if(source)row.append(source);const actions=document.createElement('div');actions.className='stack-actions';const detail=makeButton('查看详情',()=>loadDetail(item.id,row));const redo=makeButton('再次练习',()=>mutate(item.id,'redo',`/api/study/mistakes/${encodeURIComponent(item.id)}/redo`));const archive=makeButton('归档',()=>mutate(item.id,'archive',`/api/study/mistakes/${encodeURIComponent(item.id)}/archive`));if(item.status==='archived'){redo.disabled=true;archive.disabled=true}actions.append(detail,redo,archive);row.append(actions);list.append(row);if(item.id===selectedId)loadDetail(item.id,row)})}
async function load(){const run=++generation;show('正在加载复盘…');retry.hidden=true;list.replaceChildren();try{const data=await sbApi.json('/api/study/mistakes',{signal:request.signal});if(run!==generation)return;render(Array.isArray(data)?data:data.items||[])}catch(error){if(run!==generation)return;show(sbApi.safeError(error),'error');retry.hidden=false}}
async function loadDetail(id,row){selectedId=id;const run=++generation;const old=row.querySelector('.mistake-detail');if(old)old.remove();const loading=document.createElement('div');loading.className='mistake-detail notice mt-12';loading.textContent='正在加载错题详情…';row.append(loading);try{const data=await sbApi.json(`/api/study/mistakes/${encodeURIComponent(id)}`,{signal:request.signal});if(run!==generation)return;loading.remove();renderDetail(data,row)}catch(error){if(run!==generation)return;loading.className='mistake-detail notice warn mt-12';loading.textContent=sbApi.safeError(error)}}
async function reviewAttempt(attemptId,decision,feedback){return mutateAttempt(attemptId,'review',`/api/study/attempts/${encodeURIComponent(attemptId)}/review`,{decision,feedback})}async function markAttempt(attemptId,feedback){return mutateAttempt(attemptId,'mark',`/api/study/attempts/${encodeURIComponent(attemptId)}/mark-mistake`,{feedback})}
async function mutateAttempt(id,kind,url,payload){const key=kind+id;if(busy.has(key))return;busy.add(key);try{await sbApi.json(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:request.signal});show(kind==='review'?'复核已提交':'已标记为错题');await load()}catch(error){show(sbApi.safeError(error),'error')}finally{busy.delete(key)}}
async function submitFeedback(id,content){if(!content.trim()){show('请输入复盘反馈','error');return}return mutate(id,'feedback',`/api/study/mistakes/${encodeURIComponent(id)}/feedback`,{event_kind:'user_note',content})}
async function mutate(id,kind,url,payload){const key=kind+id;if(busy.has(key))return;busy.add(key);try{const options={method:'POST',headers:{'Idempotency-Key':sbApi.idempotencyKey()},signal:request.signal};if(payload){options.body=JSON.stringify(payload);options.headers['Content-Type']='application/json'}await sbApi.json(url,options);await load();show(kind==='redo'?'已创建再次练习会话':kind==='archive'?'错题已归档':kind==='feedback'?'复盘反馈已保存':'操作已完成')}catch(error){show(sbApi.safeError(error),'error')}finally{busy.delete(key)}}
retry.addEventListener('click',load);load();
})();</script></body></html>
