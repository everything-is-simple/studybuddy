<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 复盘</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">学习复盘</p><h1>错题与薄弱点</h1><p class="lead">查看需要再次练习的内容。</p></div><a class="btn" href="/app/practice.html">返回练习</a></div><section class="card"><div id="review-status" class="notice" role="status" aria-live="polite">正在加载复盘…</div><div id="review-list"></div><button id="retry-review" class="btn" type="button" hidden>重试</button></section></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){const request=sbApi.setPageScope('review'),status=document.querySelector('#review-status'),list=document.querySelector('#review-list'),retry=document.querySelector('#retry-review');function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}async function load(){show('正在加载复盘…');retry.hidden=true;list.replaceChildren();try{const data=await sbApi.json('/api/study/mistakes',{signal:request.signal}),items=Array.isArray(data)?data:data.items||[];if(!items.length){show('暂无错题记录');return}status.hidden=true;items.forEach(item=>{const row=document.createElement('article');row.className='card mt-12';const title=document.createElement('h3');title.textContent=typeof item.question==='string'?item.question:'题目';row.append(title);const fact=document.createElement('p');fact.textContent='错误原因：'+(typeof item.mistake_fact==='string'?item.mistake_fact:'未记录');row.append(fact);if(item.weak_point){const weak=document.createElement('p');weak.className='muted';weak.textContent='薄弱点：'+item.weak_point;row.append(weak)}list.append(row)})}catch(error){show(sbApi.safeError(error),'error');retry.hidden=false}}retry.onclick=load;load()})();</script></body></html>
