<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 复盘</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">学习复盘</p><h1>错题与薄弱点</h1><p class="lead">查看错误原因、来源状态，并在需要时再次练习。</p></div><a class="btn" href="/app/practice.html">返回练习</a></div><section class="card"><div id="review-status" class="notice" role="status" aria-live="polite">正在加载复盘…</div><div id="review-list"></div><button id="retry-review" class="btn mt-16" type="button" hidden>重试</button></section></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){const request=sbApi.setPageScope('review'),status=document.querySelector('#review-status'),list=document.querySelector('#review-list'),retry=document.querySelector('#retry-review');let generation=0,busy=new Set();function text(v){return typeof v==='string'?v:''}function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}function button(label,fn){const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=label;b.onclick=fn;return b}function render(items){list.replaceChildren();if(!items.length){show('暂无错题记录');return}status.hidden=true;items.forEach(item=>{const row=document.createElement('article');row.className='card mt-12';const title=document.createElement('h3');title.textContent=text(item.question)||'题目';row.append(title);const state=document.createElement('p');state.className='muted';state.textContent='状态：'+(item.status==='archived'?'已归档':'可复习');row.append(state);if(item.mistake_fact){const fact=document.createElement('p');fact.textContent='错误原因：'+text(item.mistake_fact);row.append(fact)}if(item.weak_point){const weak=document.createElement('p');weak.className='muted';weak.textContent='薄弱点：'+text(item.weak_point);row.append(weak)}const occurrence=item.occurrences?.[item.occurrences.length-1];if(occurrence?.source_status&&occurrence.source_status!=='valid'){const source=document.createElement('p');source.className='notice warn';source.textContent='来源状态：'+sbState.source(occurrence.source_status);row.append(source)}const actions=document.createElement('div');actions.className='stack-actions';const detail=button('查看详情',()=>loadDetail(item.id,row));const redo=button('再次练习',()=>mutate(item.id,'redo',`/api/study/mistakes/${encodeURIComponent(item.id)}/redo`));const archive=button('归档',()=>mutate(item.id,'archive',`/api/study/mistakes/${encodeURIComponent(item.id)}/archive`));if(item.status==='archived'){redo.disabled=true;archive.disabled=true}actions.append(detail,redo,archive);row.append(actions);list.append(row)})}async function load(){const run=++generation;show('正在加载复盘…');retry.hidden=true;list.replaceChildren();try{const data=await sbApi.json('/api/study/mistakes',{signal:request.signal});if(run!==generation)return;render(Array.isArray(data)?data:data.items||[])}catch(error){if(run!==generation)return;show(sbApi.safeError(error),'error');retry.hidden=false}}async function loadDetail(id,row){try{const data=await sbApi.json('/api/study/mistakes/'+encodeURIComponent(id),{signal:request.signal});const detail=document.createElement('div');detail.className='notice mt-12';detail.textContent='来源状态与反馈事件已读取：'+(Array.isArray(data.feedback_events)?data.feedback_events.length:0)+' 条；不显示答案 key。';row.append(detail)}catch(error){show(sbApi.safeError(error),'error')}}async function mutate(id,kind,url){const key=id+kind;if(busy.has(key))return;busy.add(key);try{const options={method:'POST',headers:{'Idempotency-Key':sbApi.idempotencyKey()},signal:request.signal};if(kind==='feedback'){options.body=JSON.stringify({event_kind:'user_note',content:'复盘记录'})}await sbApi.json(url,options);show(kind==='redo'?'已创建再次练习会话':kind==='archive'?'错题已归档':'操作已完成');await load()}catch(error){show(sbApi.safeError(error),'error')}finally{busy.delete(key)}}retry.onclick=load;load()})();</script></body></html>
