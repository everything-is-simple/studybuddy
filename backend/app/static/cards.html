<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 卡片复习</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header>
<main class="main"><div class="hero"><div><p class="eyebrow">卡片复习</p><h1>学习卡片组</h1><p class="lead">管理带来源的卡片草稿，确认后进入复习。</p></div></div>
<div class="grid"><section class="card span-4" data-od-id="cards-decks"><div class="section-heading"><h2>卡片组</h2><button class="btn" id="refresh-decks" type="button">刷新</button></div>
<form id="deck-create-form" class="stack"><input id="new-deck-title" placeholder="新卡片组名称" required maxlength="200"><button class="btn btn-primary" type="submit">创建卡片组</button></form>
<div id="deck-status" class="notice" role="status" aria-live="polite">正在加载卡片组...</div><ul id="decks" class="deck-list"></ul></section>
<section class="card span-8" data-od-id="cards-detail"><div class="section-heading"><h2 id="deck-title">选择卡片组</h2><select id="card-filter" aria-label="卡片状态"><option value="active">活动卡片</option><option value="all">全部状态</option><option value="draft">草稿</option><option value="ready">可用</option><option value="stale">来源过期</option><option value="rejected">已拒绝</option><option value="archived">已归档</option></select></div>
<div id="deck-actions" class="stack" hidden><form id="card-create-form" class="stack"><input id="new-card-front" placeholder="问题" required maxlength="4000"><textarea id="new-card-back" placeholder="答案" required maxlength="4000"></textarea><button class="btn" type="submit">创建卡片</button></form>
<form id="card-generate-form" class="stack"><input id="card-topic" placeholder="AI 草稿主题" required maxlength="500"><select id="card-material-id" required aria-label="生成材料"><option value="">选择材料</option></select><button class="btn" type="submit">生成卡片草稿</button></form><div id="material-status" class="muted" role="status" aria-live="polite"></div></div>
<div id="card-status" class="notice" role="status" aria-live="polite" hidden></div><div id="card-detail" class="stack"></div><ul id="cards" class="card-list" hidden></ul></section></div></main></div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script>
<script>(function(){
const pageRequest=sbApi.setPageScope('cards');const deckStatus=document.querySelector('#deck-status'),decks=document.querySelector('#decks'),refreshDecks=document.querySelector('#refresh-decks'),deckTitle=document.querySelector('#deck-title'),deckActions=document.querySelector('#deck-actions'),cardStatus=document.querySelector('#card-status'),cardDetail=document.querySelector('#card-detail'),cards=document.querySelector('#cards'),cardFilter=document.querySelector('#card-filter'),materialSelect=document.querySelector('#card-material-id'),materialStatus=document.querySelector('#material-status');let busy=false,selectedDeckId=null,selectedCardId=null,deckGeneration=0,cardGeneration=0,detailGeneration=0,materials=[];
const text=value=>typeof value==='string'?value:'';const setNotice=(node,message,kind)=>{node.hidden=false;node.className='notice'+(kind?' '+kind:'');node.textContent=message};const message=error=>({provider_not_configured:'AI 服务尚未配置',retrieval_not_ready:'材料尚未建立索引',retrieval_empty:'未找到相关材料',citation_invalid:'引用来源不可用',card_edit_not_allowed:'该卡片不可编辑',card_not_ready:'卡片尚未就绪',invalid_pagination:'分页参数无效',invalid_card_filter:'卡片筛选无效',invalid_card_review_key:'复习请求标识无效',card_review_idempotency_conflict:'复习请求标识已用于另一种结果，请重试'})[error.code]||sbApi.safeError(error);function setBusy(value){busy=value;document.querySelectorAll('button,input,textarea,select').forEach(node=>node.disabled=value)}
async function mutate(action,success){if(busy)return;const cardId=selectedCardId;setBusy(true);try{await action();await loadDecks();if(selectedDeckId)await selectDeck(selectedDeckId,deckTitle.textContent);if(cardId){selectedCardId=cardId;await viewCard(cardId)}setNotice(cardStatus,success)}catch(error){setNotice(cardStatus,message(error),'warn')}finally{setBusy(false)}}
function citationLine(citation){const status=text(citation.status)||'source_unavailable';const label=text(citation.material_name)||'材料';if(status==='valid'&&citation.material_id&&citation.citation_key){const link=document.createElement('a');link.className='citation-link';link.href='/app/material-detail.html?material='+encodeURIComponent(citation.material_id)+'&citation='+encodeURIComponent(citation.citation_key)+'&kind=card';link.textContent='来源: '+label+' · '+sbState.source(status);return link}const row=document.createElement('div');row.className='citation-status '+(status==='valid'?'':'unavailable');row.textContent='来源: '+label+' · '+sbState.source(status);return row}
function renderCardItem(card){const li=document.createElement('li');li.className='card-item';li.dataset.cardId=card.id;const meta=document.createElement('div');meta.className='card-meta';const info=document.createElement('div');const question=document.createElement('div');question.className='item-title';question.textContent=text(card.front)||'问题';info.append(question);const source=document.createElement('div');source.className='source-status '+(card.source_status==='valid'?'':card.source_status==='stale'?'stale':'unavailable');source.textContent='来源: '+sbState.source(card.source_status);info.append(source);const stats=document.createElement('div');stats.className='muted';stats.textContent=`复习 ${Number(card.review_count||0)} 次${card.due_at?' · 到期 '+new Date(card.due_at).toLocaleDateString('zh-CN'):''}`;info.append(stats);meta.append(info);const badge=document.createElement('span');badge.className='status-badge '+(card.status||'draft');badge.textContent=sbState.label(card.status||'draft');meta.append(badge);li.append(meta);if(card.back){const content=document.createElement('div');content.className='card-content';content.textContent=text(card.back);li.append(content)}li.onclick=()=>viewCard(card.id);cards.append(li)}
async function loadDecks(){deckStatus.hidden=false;deckStatus.textContent='正在加载卡片组...';deckStatus.className='notice';decks.replaceChildren();try{const run=++deckGeneration,data=await sbApi.json('/api/study/decks',{signal:pageRequest.signal});if(run!==deckGeneration)return;const items=Array.isArray(data)?data:data.items||[];if(!items.length){deckStatus.textContent='暂无卡片组';return}deckStatus.hidden=true;items.forEach(deck=>{const li=document.createElement('li');li.className='deck-item';li.dataset.deckId=deck.id;if(deck.id===selectedDeckId)li.classList.add('selected');const meta=document.createElement('div');meta.className='deck-meta';const info=document.createElement('div'),title=document.createElement('div');title.className='item-title';title.textContent=text(deck.title)||'未命名卡片组';info.append(title);const count=document.createElement('div');count.className='muted';count.textContent=`${Number(deck.card_count||0)} 张卡片（活动 ${Number(deck.active_card_count||0)}）`;info.append(count);meta.append(info);const badge=document.createElement('span');badge.className='status-badge '+(deck.status||'active');badge.textContent=sbState.label(deck.status||'active');meta.append(badge);li.append(meta);li.onclick=()=>selectDeck(deck.id,deck.title);decks.append(li)})}catch(error){setNotice(deckStatus,sbApi.safeError(error),'warn')}}
async function loadMaterials(){materialStatus.textContent='正在加载材料…';materialSelect.replaceChildren(new Option('选择材料',''));try{const data=await sbApi.json('/api/materials?limit=100',{signal:pageRequest.signal});materials=Array.isArray(data)?data:data.items||[];let indexedCount=0;for(const material of materials){const id=material.id||material.material_id;if(!id)continue;let indexed=false;try{const index=await sbApi.json('/api/materials/'+encodeURIComponent(id)+'/ai-index',{signal:pageRequest.signal});indexed=index.status==='ready'}catch(_){}if(indexed)indexedCount++;materialSelect.append(new Option((text(material.original_name)||'未命名材料')+' · '+(indexed?'已索引':'尚未建立索引'),id))}materialStatus.textContent=materials.length?(indexedCount?'请选择材料；生成需要已索引材料':'暂无已索引材料，请先在资料页建立索引。'):'暂无材料，请先在资料页导入。'}catch(error){materialStatus.textContent='材料列表加载失败，可刷新页面重试。'}}
async function selectDeck(deckId,title){selectedDeckId=deckId;selectedCardId=null;deckTitle.textContent=text(title)||'卡片详情';setNotice(cardStatus,'正在加载卡片...');cardDetail.replaceChildren();deckActions.hidden=false;cards.replaceChildren();cards.hidden=true;document.querySelectorAll('.deck-item').forEach(el=>el.classList.toggle('selected',el.dataset.deckId===deckId));const run=++cardGeneration;try{const data=await sbApi.json('/api/study/cards?deck_id='+encodeURIComponent(deckId)+'&status='+encodeURIComponent(cardFilter.value),{signal:pageRequest.signal});if(run!==cardGeneration)return;const items=Array.isArray(data)?data:data.items||[];if(!items.length){cardStatus.textContent=cardFilter.value==='active'?'该卡片组暂无活动卡片':'没有符合筛选条件的卡片';return}cardStatus.hidden=true;cards.hidden=false;items.forEach(renderCardItem)}catch(error){if(run!==cardGeneration)return;setNotice(cardStatus,sbApi.safeError(error),'warn')}}
async function editCard(card){const form=document.createElement('form');form.className='stack';const front=document.createElement('input');front.value=text(card.front);front.maxLength=4000;front.setAttribute('aria-label','卡片问题');const back=document.createElement('textarea');back.value=text(card.back);back.maxLength=4000;back.setAttribute('aria-label','卡片答案');const save=document.createElement('button');save.className='btn';save.type='submit';save.textContent='保存卡片';form.append(front,back,save);form.onsubmit=event=>{event.preventDefault();mutate(()=>sbApi.json('/api/study/cards/'+encodeURIComponent(card.id),{method:'PATCH',body:JSON.stringify({front:front.value,back:back.value,tags:card.tags||[],explanation:card.explanation||'',citations:card.citations||[],card_type:card.card_type||'user_created'}),signal:pageRequest.signal}),'卡片已保存')};return form}
async function viewCard(cardId){
 selectedCardId=cardId;const run=++detailGeneration;cardDetail.replaceChildren();setNotice(cardStatus,'正在加载卡片详情...');
 try{
  const card=await sbApi.json('/api/study/cards/'+encodeURIComponent(cardId),{signal:pageRequest.signal});if(run!==detailGeneration)return;cardStatus.hidden=true;
  const container=document.createElement('div');
  const front=document.createElement('div');front.append(Object.assign(document.createElement('strong'),{textContent:'问题：'}),document.createTextNode(text(card.front)));container.append(front);
  const back=document.createElement('div');back.className='mt-12';back.append(Object.assign(document.createElement('strong'),{textContent:'答案：'}),document.createTextNode(text(card.back)));container.append(back);
  const source=document.createElement('div');source.className='mt-12';source.append(Object.assign(document.createElement('strong'),{textContent:'引用状态：'}),document.createTextNode(sbState.source(card.source_status)));(card.citations||[]).forEach(citation=>source.append(citationLine(citation)));container.append(source);
  if(card.due_at){const schedule=document.createElement('div');schedule.className='muted mt-12';schedule.textContent=`已复习 ${Number(card.review_count||0)} 次 · 间隔 ${Number(card.interval_days||0)} 天 · 下次到期 ${new Date(card.due_at).toLocaleString('zh-CN')}`;container.append(schedule)}
  if(card.status==='draft'){
   container.append(await editCard(card));
   container.append(action('确认卡片',()=>mutate(()=>sbApi.json('/api/study/cards/'+encodeURIComponent(card.id)+'/confirm',{method:'POST',signal:pageRequest.signal}),'卡片已确认')));
   container.append(action('拒绝卡片',()=>mutate(()=>sbApi.json('/api/study/cards/'+encodeURIComponent(card.id)+'/reject',{method:'POST',signal:pageRequest.signal}),'卡片已拒绝')));
  }
  if(card.status==='archived')container.append(action('恢复卡片',()=>mutate(()=>sbApi.json('/api/study/cards/'+encodeURIComponent(card.id)+'/restore',{method:'POST',signal:pageRequest.signal}),'卡片已恢复')));
  else if(card.status!=='draft')container.append(action('归档卡片',()=>mutate(()=>sbApi.json('/api/study/cards/'+encodeURIComponent(card.id)+'/archive',{method:'POST',signal:pageRequest.signal}),'卡片已归档')));
  if(card.status==='ready')for(const [label,result] of [['记为掌握','good'],['需要复习','again']]){
   container.append(action(label,()=>mutate(()=>sbApi.json('/api/study/cards/'+encodeURIComponent(card.id)+'/reviews',{method:'POST',headers:{'Idempotency-Key':sbApi.idempotencyKey()},body:JSON.stringify({result}),signal:pageRequest.signal}),'复习记录已保存')));
  }
  const history=action('查看复习历史',async()=>{const rows=await sbApi.json('/api/study/cards/'+encodeURIComponent(card.id)+'/reviews',{signal:pageRequest.signal});const box=document.createElement('div');box.className='notice';box.textContent=`复习历史：${rows.length} 条`;container.append(box)});container.append(history);cardDetail.append(container)
 }catch(error){if(run!==detailGeneration)return;setNotice(cardStatus,sbApi.safeError(error),'warn')}
}
function action(label,handler){const node=document.createElement('button');node.className='btn';node.type='button';node.textContent=label;node.onclick=handler;return node}
async function reloadCards(){if(selectedDeckId)await selectDeck(selectedDeckId,deckTitle.textContent)}
document.querySelector('#deck-create-form').onsubmit=event=>{event.preventDefault();mutate(()=>sbApi.json('/api/study/decks',{method:'POST',body:JSON.stringify({title:document.querySelector('#new-deck-title').value}),signal:pageRequest.signal}),'卡片组已创建').then(()=>{document.querySelector('#new-deck-title').value=''})};document.querySelector('#card-create-form').onsubmit=event=>{event.preventDefault();mutate(()=>sbApi.json('/api/study/decks/'+encodeURIComponent(selectedDeckId)+'/cards',{method:'POST',body:JSON.stringify({front:document.querySelector('#new-card-front').value,back:document.querySelector('#new-card-back').value,card_type:'user_created',tags:[],explanation:'',citations:[]}),signal:pageRequest.signal}),'卡片已创建').then(()=>{document.querySelector('#new-card-front').value='';document.querySelector('#new-card-back').value=''})};document.querySelector('#card-generate-form').onsubmit=event=>{event.preventDefault();const materialId=materialSelect.value;if(!materialId){setNotice(cardStatus,'请选择已索引材料。','warn');return}mutate(()=>sbApi.json('/api/study/decks/'+encodeURIComponent(selectedDeckId)+'/generate',{method:'POST',headers:{'Idempotency-Key':sbApi.idempotencyKey()},body:JSON.stringify({topic:document.querySelector('#card-topic').value,material_ids:[materialId],count:1}),signal:pageRequest.signal}),'卡片草稿已生成')};refreshDecks.onclick=()=>{loadDecks();loadMaterials()};cardFilter.onchange=reloadCards;loadDecks();loadMaterials();
})();</script></body></html>
