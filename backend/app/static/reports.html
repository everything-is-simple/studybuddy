<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 报告</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">学习报告</p><h1>报告与摘要</h1><p class="lead">查看脱敏后的学习报告。报告不会自动发送或生成。</p></div><a class="btn" href="/app/classroom.html">返回课堂</a></div><div class="grid"><section class="card span-4"><h2>报告列表</h2><div id="report-status" class="notice" role="status" aria-live="polite">正在加载报告…</div><div id="report-list" class="report-list"></div><button id="retry-reports" class="btn" type="button" hidden>重试</button></section><section class="card span-8"><h2 id="report-detail-title">选择报告</h2><div id="report-detail" class="muted">从左侧选择一个已生成的报告以查看脱敏统计。</div><div id="report-actions" class="stack-actions" hidden><button id="export-json" class="btn" type="button">导出 JSON</button><button id="export-markdown" class="btn" type="button">导出 Markdown</button></div></section></div></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){const request=sbApi.setPageScope('reports'),status=document.querySelector('#report-status'),list=document.querySelector('#report-list'),retry=document.querySelector('#retry-reports'),title=document.querySelector('#report-detail-title'),detail=document.querySelector('#report-detail'),actions=document.querySelector('#report-actions'),params=new URLSearchParams(location.search);let currentId='';function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}function text(value){return typeof value==='string'||typeof value==='number'?String(value):'0'}function line(label,value){const row=document.createElement('p');row.textContent=label+'：'+text(value);return row}function renderDetail(report){currentId=report.id||'';title.textContent='报告 · '+text(report.report_kind);detail.replaceChildren();const payload=report.safe_payload;if(!payload||typeof payload!=='object'){detail.textContent='报告内容不可用';actions.hidden=true;return}const period=payload.period||{},source=payload.source_quality||{},flags=payload.quality_flags||{};detail.append(line('范围',text(period.period_start)+' 至 '+text(period.period_end)),line('时区',period.timezone),line('计划目标',payload.plan&&payload.plan.active_goal_count),line('练习尝试',payload.practice&&payload.practice.attempt_count),line('有效来源',source.valid_source_count),line('来源已删除',source.source_deleted_count),line('来源不可用',source.source_unavailable_count),line('待复核',flags.has_pending_review?'是':'否'),line('交付', '未发送'));actions.hidden=!currentId}async function loadDetail(id){title.textContent='正在加载报告…';detail.textContent='';actions.hidden=true;try{const report=await sbApi.json('/api/study/reports/'+encodeURIComponent(id),{signal:request.signal});renderDetail(report)}catch(error){title.textContent='报告不可用';detail.textContent=sbApi.safeError(error)}}function renderList(items){list.replaceChildren();if(!items.length){show('暂无报告');return}status.hidden=true;items.forEach(report=>{const item=document.createElement('button');item.type='button';item.className='report-item';item.textContent=typeof report.title==='string'?report.title:text(report.report_kind)+' · '+text(report.period_start)+' 至 '+text(report.period_end);item.addEventListener('click',()=>{history.replaceState(null,'','?report_id='+encodeURIComponent(report.id||''));loadDetail(report.id)});list.append(item)})}async function load(){show('正在加载报告…');retry.hidden=true;list.replaceChildren();try{const data=await sbApi.json('/api/study/reports',{signal:request.signal}),items=Array.isArray(data)?data:(data.items||[]);renderList(items);const selected=params.get('report_id');if(selected&&items.some(item=>item.id===selected))await loadDetail(selected)}catch(error){show(sbApi.safeError(error),'error');retry.hidden=false}}async function download(format){if(!currentId)return;try{const blob=await sbApi.download('/api/study/reports/'+encodeURIComponent(currentId)+'/export?format='+format,{signal:request.signal,headers:{Accept:format==='json'?'application/json':'text/markdown'}}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='studybuddy-report.'+(format==='json'?'json':'md');link.click();URL.revokeObjectURL(link.href)}catch(error){show(sbApi.safeError(error),'error')}}retry.onclick=load;document.querySelector('#export-json').onclick=()=>download('json');document.querySelector('#export-markdown').onclick=()=>download('markdown');load()})();</script></body></html>
