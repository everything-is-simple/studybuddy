<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 报告</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">学习报告</p><h1>报告与摘要</h1><p class="lead">查看脱敏后的学习报告。报告不会自动发送。</p></div><a class="btn" href="/app/classroom.html">返回课堂</a></div><section class="card report-create-panel" aria-labelledby="report-create-title"><h2 id="report-create-title">生成报告</h2><p class="muted">按指定周期生成本地脱敏快照；不会自动发送。</p><form id="report-create-form" class="form-row"><div class="field"><label for="report-create-kind">报告类型</label><select id="report-create-kind" required><option value="daily">每日</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="exam_alert">考试提醒</option></select></div><div class="field"><label for="report-create-start">开始日期</label><input id="report-create-start" type="date" required></div><div class="field"><label for="report-create-end">结束日期</label><input id="report-create-end" type="date" required></div><div class="field"><label for="report-create-timezone">时区</label><input id="report-create-timezone" required maxlength="100" autocomplete="off"></div><div class="field"><button id="report-create-submit" class="btn btn-primary" type="submit">生成报告</button></div></form><div id="report-create-status" class="notice" role="status" aria-live="polite" hidden></div></section><div class="grid"><section class="card span-4"><h2>报告列表</h2><div id="report-status" class="notice" role="status" aria-live="polite">正在加载报告…</div><div id="report-list" class="report-list"></div><button id="retry-reports" class="btn" type="button" hidden>重试</button><button id="load-more-reports" class="btn" type="button" hidden>加载更多报告</button></section><section class="card span-8"><h2 id="report-detail-title">选择报告</h2><div id="report-detail" class="muted">从左侧选择一个已生成的报告以查看脱敏统计。</div><button id="retry-detail" class="btn" type="button" hidden>重试</button><div id="report-actions" class="stack-actions" hidden><button id="preview-report" class="btn" type="button">刷新报告预览</button><button id="export-json" class="btn" type="button">导出 JSON</button><button id="export-markdown" class="btn" type="button">导出 Markdown</button></div></section></div></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script src="/app/js/templates.js"></script><script>(function(){const request=sbApi.setPageScope('reports'),status=document.querySelector('#report-status'),list=document.querySelector('#report-list'),retry=document.querySelector('#retry-reports'),loadMoreButton=document.querySelector('#load-more-reports'),title=document.querySelector('#report-detail-title'),detail=document.querySelector('#report-detail'),retryDetail=document.querySelector('#retry-detail'),actions=document.querySelector('#report-actions'),preview=document.querySelector('#preview-report'),exportJson=document.querySelector('#export-json'),exportMarkdown=document.querySelector('#export-markdown'),createForm=document.querySelector('#report-create-form'),createKind=document.querySelector('#report-create-kind'),createStart=document.querySelector('#report-create-start'),createEnd=document.querySelector('#report-create-end'),createTimezone=document.querySelector('#report-create-timezone'),createStatus=document.querySelector('#report-create-status');let currentId='',previewBusy=false,downloadBusy=false,createBusy=false,loadMoreBusy=false,createGeneration=0,detailGeneration=0,listGeneration=0,reportItems=[],listHasMore=false;function show(message,kind){sbTemplates.showStatus(status,message,kind||'')}function text(value){return typeof value==='string'||typeof value==='number'?String(value):'0'}function kindLabel(value){return sbState.label(value,'未知类型')}function line(label,value){const row=document.createElement('p');row.textContent=label+'：'+text(value);return row}function reportTitle(report){return typeof report.title==='string'&&report.title?report.title:kindLabel(report.report_kind)+' · '+text(report.period_start)+' 至 '+text(report.period_end)}function updateSelection(){list.querySelectorAll('.report-item').forEach(item=>{item.classList.toggle('selected',item.dataset.reportId===currentId)})}function resetStatus(){status.hidden=true}function formatDate(value){return value.getFullYear()+'-'+String(value.getMonth()+1).padStart(2,'0')+'-'+String(value.getDate()).padStart(2,'0')}function setInitialPeriod(){const start=new Date(),end=new Date(start);end.setDate(end.getDate()+1);createStart.value=formatDate(start);createEnd.value=formatDate(end);createTimezone.value=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}function renderDetail(report){currentId=report.id||'';title.textContent='报告 · '+kindLabel(report.report_kind);detail.replaceChildren();retryDetail.hidden=true;const payload=report.safe_payload;if(!payload||typeof payload!=='object'){detail.textContent='报告内容不可用';actions.hidden=true;updateSelection();return}const period=payload.period||{},source=payload.source_quality||{},flags=payload.quality_flags||{};detail.append(line('范围',text(period.period_start)+' 至 '+text(period.period_end)),line('时区',period.timezone),line('计划目标',payload.plan&&payload.plan.active_goal_count),line('练习尝试',payload.practice&&payload.practice.attempt_count),line('有效来源',source.valid_source_count),line('来源过期',source.stale_count),line('来源已删除',source.source_deleted_count),line('来源不可用',source.source_unavailable_count),line('待复核',flags.has_pending_review?'是':'否'),line('交付','未发送'));actions.hidden=!currentId;updateSelection()}async function loadDetail(id){const generation=++detailGeneration;currentId=id;resetStatus();title.textContent='正在加载报告…';detail.replaceChildren();detail.textContent='正在加载报告详情…';actions.hidden=true;retryDetail.hidden=true;updateSelection();try{const report=await sbApi.json('/api/study/reports/'+encodeURIComponent(id),{signal:request.signal});if(generation!==detailGeneration)return;renderDetail(report)}catch(error){if(generation!==detailGeneration)return;title.textContent='报告不可用';detail.textContent=sbApi.safeError(error);retryDetail.hidden=!currentId}}async function previewReport(){if(!currentId||previewBusy)return;previewBusy=true;preview.disabled=true;show('正在刷新报告预览…');const generation=++detailGeneration;try{const report=await sbApi.json('/api/study/reports/'+encodeURIComponent(currentId)+'/preview',{signal:request.signal});if(generation!==detailGeneration)return;renderDetail(report);status.hidden=true}catch(error){if(generation===detailGeneration)show(sbApi.safeError(error),'error')}finally{previewBusy=false;preview.disabled=false}}function renderList(items){list.replaceChildren();if(!items.length){show('暂无报告');loadMoreButton.hidden=true;return}status.hidden=true;items.forEach(report=>{const item=document.createElement('button');item.type='button';item.className='report-item';item.dataset.reportId=report.id||'';item.textContent=reportTitle(report);item.addEventListener('click',()=>{history.replaceState(null,'','?report_id='+encodeURIComponent(report.id||''));loadDetail(report.id)});list.append(item)});loadMoreButton.hidden=!listHasMore;updateSelection()}function reportPage(data){return Array.isArray(data)?{items:data,hasMore:false}:{items:Array.isArray(data&&data.items)?data.items:[],hasMore:Boolean(data&&data.has_more)}}async function load(selectedId=''){const generation=++listGeneration;detailGeneration++;show('正在加载报告…');retry.hidden=true;loadMoreButton.hidden=true;list.replaceChildren();try{const data=reportPage(await sbApi.json('/api/study/reports?limit=100&offset=0',{signal:request.signal}));if(generation!==listGeneration)return;reportItems=data.items;listHasMore=data.hasMore;renderList(reportItems);const selected=selectedId||new URLSearchParams(location.search).get('report_id');if(selected&&reportItems.some(item=>item.id===selected))await loadDetail(selected)}catch(error){if(generation!==listGeneration)return;show(sbApi.safeError(error),'error');retry.hidden=false}}async function loadMore(){if(loadMoreBusy||!listHasMore)return;const generation=++listGeneration;loadMoreBusy=true;loadMoreButton.disabled=true;loadMoreButton.textContent='正在加载…';try{const data=reportPage(await sbApi.json('/api/study/reports?limit=100&offset='+reportItems.length,{signal:request.signal}));if(generation!==listGeneration)return;reportItems=reportItems.concat(data.items);listHasMore=data.hasMore;renderList(reportItems)}catch(error){if(generation===listGeneration)show(sbApi.safeError(error),'error')}finally{loadMoreBusy=false;loadMoreButton.disabled=false;loadMoreButton.textContent='加载更多报告'}}async function createReport(event){event.preventDefault();if(createBusy)return;const generation=++createGeneration,selection=detailGeneration;const kind=createKind.value,start=createStart.value,end=createEnd.value,timezone=createTimezone.value.trim();if(!kind||!start||!end||!timezone){sbUi.status(createStatus,'failed','请填写报告类型、日期和时区');createKind.focus();return}if(start>=end){sbUi.status(createStatus,'failed','结束日期必须晚于开始日期');createEnd.focus();return}createBusy=true;sbTemplates.setFormBusy(createForm,true);sbUi.status(createStatus,'loading','正在生成报告…');try{const report=await sbApi.json('/api/study/reports',{method:'POST',body:JSON.stringify({report_kind:kind,timezone,period_start:start,period_end:end})});if(generation!==createGeneration)return;createStart.value='';createEnd.value='';createTimezone.value='';sbUi.status(createStatus,'success','报告已生成');await load(detailGeneration===selection&&report&&report.id)}catch(error){if(generation===createGeneration)sbUi.status(createStatus,'failed',sbApi.safeError(error))}finally{createBusy=false;sbTemplates.setFormBusy(createForm,false);if(!createStart.value&&!createEnd.value&&!createTimezone.value)createKind.focus()}}async function download(format){if(!currentId||downloadBusy)return;const reportId=currentId,generation=detailGeneration;downloadBusy=true;sbTemplates.setBusy([exportJson,exportMarkdown],true);show('正在导出报告…');try{const blob=await sbApi.download('/api/study/reports/'+encodeURIComponent(reportId)+'/export?format='+format,{signal:request.signal,headers:{Accept:format==='json'?'application/json':'text/markdown'}});if(generation!==detailGeneration||currentId!==reportId)return;const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='studybuddy-report.'+(format==='json'?'json':'md');link.click();URL.revokeObjectURL(link.href);status.hidden=true}catch(error){if(generation===detailGeneration&&currentId===reportId)show(sbApi.safeError(error),'error')}finally{downloadBusy=false;sbTemplates.setBusy([exportJson,exportMarkdown],false)}}setInitialPeriod();createForm.addEventListener('submit',createReport);retry.onclick=load;loadMoreButton.onclick=loadMore;retryDetail.onclick=()=>{if(currentId)loadDetail(currentId)};preview.onclick=previewReport;exportJson.onclick=()=>download('json');exportMarkdown.onclick=()=>download('markdown');load()})();</script></body></html>
