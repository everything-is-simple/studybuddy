<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 报告</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">学习报告</p><h1>报告与摘要</h1><p class="lead">查看脱敏后的学习报告和交付边界。</p></div><a class="btn" href="/app/classroom.html">返回课堂</a></div><section class="card"><div id="report-status" class="notice" role="status" aria-live="polite">正在加载报告…</div><div id="report-list"></div><button id="retry-reports" class="btn" type="button" hidden>重试</button></section></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){const request=sbApi.setPageScope('reports'),status=document.querySelector('#report-status'),list=document.querySelector('#report-list'),retry=document.querySelector('#retry-reports');function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}async function load(){show('正在加载报告…');retry.hidden=true;list.replaceChildren();try{const data=await sbApi.json('/api/study/reports',{signal:request.signal}),items=Array.isArray(data)?data:(data.items||[]);if(!items.length){show('暂无报告');return}status.hidden=true;items.forEach(report=>{const row=document.createElement('article');row.className='card mt-12';const title=document.createElement('h3');title.textContent=typeof report.title==='string'?report.title:'学习报告';row.append(title);if(report.created_at){const date=document.createElement('p');date.className='muted';date.textContent=new Date(report.created_at).toLocaleString('zh-CN');row.append(date)}const link=document.createElement('a');link.className='btn';link.href='/app/reports.html?report_id='+encodeURIComponent(report.id||'');link.textContent='查看详情';row.append(link);list.append(row)})}catch(error){show(sbApi.safeError(error),'error');retry.hidden=false}}retry.onclick=load;load()})();</script></body></html>
