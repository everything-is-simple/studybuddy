<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 练习会话</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header>
<main class="main"><div class="hero"><div><p class="eyebrow">练习 · 会话</p><h1 id="page-title">练习会话</h1><p class="lead">逐题完成练习，并在提交后查看允许公开的结果。</p></div><a class="btn" href="/app/practice.html">返回练习</a></div><section class="card"><div id="session-status" class="notice" role="status" aria-live="polite">正在加载会话…</div><div id="session-detail" hidden></div><button id="retry-session" class="btn" type="button" hidden>重试</button></section></main></div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script>
<script>(function(){const params=new URLSearchParams(location.search),id=params.get('session_id')||params.get('id'),request=sbApi.setPageScope('practice-session'),status=document.querySelector('#session-status'),detail=document.querySelector('#session-detail'),retry=document.querySelector('#retry-session');let generation=0,session=null,index=0,busy=false;function text(v){return typeof v==='string'?v:''}function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}function field(label,value){const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+'：';p.append(strong,document.createTextNode(text(value)));return p}function key(){return sbApi.idempotencyKey()}function render(data){session=data;detail.replaceChildren();const heading=document.createElement('h2');heading.textContent=text(data.title)||'练习会话';detail.append(heading,field('状态',sbState.label(data.status||'draft')),field('进度',`${data.summary?.submitted_count||0}/${data.summary?.total_item_count||0}`));if(data.summary?.source_warning_count){const warning=document.createElement('div');warning.className='notice warn mt-12';warning.textContent='部分题目来源：'+(data.summary.source_warning_count)+' 项存在来源提醒';detail.append(warning)}if(data.status==='draft'){const start=document.createElement('button');start.className='btn btn-primary';start.textContent='开始练习';start.onclick=startSession;detail.append(start)}const items=Array.isArray(data.items)?data.items:[];if(data.status==='active'&&items.length){renderQuestion(items)}else if(data.status==='finished'||data.status==='expired'){const link=document.createElement('a');link.className='btn';link.href='/app/practice-result.html?session_id='+encodeURIComponent(data.id);link.textContent='查看结果';detail.append(link)}else if(!items.length){const empty=document.createElement('div');empty.className='notice muted';empty.textContent='暂无练习题目';detail.append(empty)}detail.hidden=false}function renderQuestion(items){const item=items[index];detail.querySelector('.practice-question')?.remove();const box=document.createElement('article');box.className='card mt-24 practice-question';const heading=document.createElement('h3');heading.textContent=`第 ${index+1} 题 / ${items.length}`;box.append(heading);const prompt=document.createElement('p');prompt.textContent=text(item.prompt)||'题目';box.append(prompt);let answer;if(Array.isArray(item.options)&&item.options.length){answer=document.createElement('select');answer.id='answer';answer.setAttribute('aria-label','选择答案');const blank=document.createElement('option');blank.value='';blank.textContent='请选择';answer.append(blank);item.options.forEach((option,n)=>{const choice=document.createElement('option');choice.value=String(n);choice.textContent=text(option);answer.append(choice)})}else{answer=document.createElement('textarea');answer.id='answer';answer.setAttribute('aria-label','填写答案');answer.placeholder='填写你的答案…'}box.append(answer);const actions=document.createElement('div');actions.className='stack-actions';const submit=document.createElement('button');submit.className='btn btn-primary';submit.textContent='提交答案';submit.onclick=()=>submitAnswer(item,answer);actions.append(submit);if(index>0){const previous=document.createElement('button');previous.className='btn';previous.textContent='上一题';previous.onclick=()=>{index-=1;renderQuestion(items)};actions.append(previous)}if(index<items.length-1){const next=document.createElement('button');next.className='btn';next.textContent='下一题';next.onclick=()=>{index+=1;renderQuestion(items)};actions.append(next)}else{const finish=document.createElement('button');finish.className='btn';finish.textContent='完成会话';finish.onclick=finishSession;actions.append(finish)}box.append(actions);detail.append(box)}async function startSession(){if(busy)return;busy=true;try{await sbApi.json('/api/study/practice-sessions/'+encodeURIComponent(id)+'/start',{method:'POST',headers:{'Idempotency-Key':key()},signal:request.signal});show('会话已开始');await load()}catch(error){show(sbApi.safeError(error),'error')}finally{busy=false}}async function submitAnswer(item,answer){if(busy)return;let value=answer.value;if(answer.tagName==='SELECT'){if(value===''){show('请选择答案','error');return}value=Number(value)}if(typeof value==='string'&&!value.trim()){show('请填写答案','error');return}busy=true;show('正在提交答案…');try{const result=await sbApi.json('/api/study/practice-sessions/'+encodeURIComponent(id)+'/items/'+encodeURIComponent(item.id)+'/submit',{method:'POST',headers:{'Idempotency-Key':key()},body:JSON.stringify({answer:value}),signal:request.signal});show(result.grading_status==='pending_review'?'答案已提交，等待复核':'答案已提交');if(index<session.items.length-1){index+=1;await load()}else{renderQuestion(session.items);show(result.grading_status==='pending_review'?'答案已提交，等待复核':'答案已提交')}}catch(error){show(sbApi.safeError(error),'error')}finally{busy=false}}async function finishSession(){if(busy)return;busy=true;try{const result=await sbApi.json('/api/study/practice-sessions/'+encodeURIComponent(id)+'/finish',{method:'POST',headers:{'Idempotency-Key':key()},signal:request.signal});if(result.status==='expired'){show('会话已过期','error')}location.href='/app/practice-result.html?session_id='+encodeURIComponent(id)}catch(error){show(sbApi.safeError(error),'error')}finally{busy=false}}async function load(){const run=++generation;if(!id){show('缺少会话标识，无法加载详情','error');return}show('正在加载会话…');retry.hidden=true;detail.hidden=true;try{const data=await sbApi.json('/api/study/practice-sessions/'+encodeURIComponent(id),{signal:request.signal});if(run!==generation)return;render(data);status.hidden=true}catch(error){if(run!==generation)return;show(sbApi.safeError(error),'error');retry.hidden=false}}retry.onclick=load;load()})();</script>
</body></html>
