<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 练习与反馈</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">练习与反馈</p>
<h1>限时练习与错题复盘</h1>
<p class="lead">参与限时练习会话，查看错题库和薄弱知识点。</p>
</div>
</div>

<div class="grid">
<section class="card span-12" data-od-id="practice-recommendations"><h2>推荐练习</h2><div id="recommendation-status" class="notice" role="status" aria-live="polite">正在加载推荐...</div><div id="recommendations" class="stack"></div><div class="stack-actions mt-12"><label for="recommendation-limit">推荐数量</label><select id="recommendation-limit"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option></select><button class="btn btn-primary" id="create-recommended-session" type="button" disabled>创建练习会话</button><button class="btn" id="refresh-recommendations" type="button">刷新推荐</button></div></section>
<section class="card span-6" data-od-id="practice-sessions">
<h2>练习会话</h2>
<div id="session-status" class="notice" role="status" aria-live="polite">正在加载练习会话...</div>
<ul id="sessions" class="session-list"></ul>
<button class="btn mt-12" id="refresh-sessions" type="button">刷新列表</button>
</section>

<section class="card span-6" data-od-id="practice-mistakes">
<h2>错题库</h2>
<div id="mistake-status" class="notice" role="status" aria-live="polite">正在加载错题...</div>
<ul id="mistakes" class="mistake-list"></ul>
<button class="btn mt-12" id="refresh-mistakes" type="button">刷新</button>
</section>

<section class="card span-12" data-od-id="practice-detail" hidden>
<h2 id="detail-title">会话详情</h2>
<div id="detail-content"></div>
</section>
</div>
</main>
</div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(function(){
const pageRequest=sbApi.setPageScope('practice');
const sessionStatus=document.querySelector('#session-status');
const sessions=document.querySelector('#sessions');
const refreshSessions=document.querySelector('#refresh-sessions');
const mistakeStatus=document.querySelector('#mistake-status');
const mistakes=document.querySelector('#mistakes');
const refreshMistakes=document.querySelector('#refresh-mistakes');
const detailSection=document.querySelector('[data-od-id="practice-detail"]');
const detailTitle=document.querySelector('#detail-title');
const detailContent=document.querySelector('#detail-content');
const recommendationStatus=document.querySelector('#recommendation-status');
const recommendations=document.querySelector('#recommendations');
const recommendationLimit=document.querySelector('#recommendation-limit');
const createRecommendedSession=document.querySelector('#create-recommended-session');
const refreshRecommendations=document.querySelector('#refresh-recommendations');
let recommendedItems=[];
let recommendationGeneration=0;
let recommendationBusy=false;

let sessionGeneration=0;
let mistakeGeneration=0;
function text(value){return typeof value==='string'?value:''}
function showRecommendation(message,kind=''){recommendationStatus.hidden=false;recommendationStatus.className='notice'+(kind?' '+kind:'');recommendationStatus.textContent=message}
function renderRecommendations(items){recommendations.replaceChildren();recommendedItems=items;items.forEach(item=>{const label=document.createElement('label');label.className='recommendation-item';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=item.exercise_id;checkbox.addEventListener('change',()=>{createRecommendedSession.disabled=!recommendations.querySelector('input:checked')});const copy=document.createElement('span');copy.textContent=`${item.prompt} · ${(item.reason_labels||[]).join('、')}`;label.append(checkbox,copy);recommendations.append(label)});createRecommendedSession.disabled=!items.length;if(!items.length)showRecommendation('暂无可用推荐题目')}
async function loadRecommendations(){const run=++recommendationGeneration;showRecommendation('正在加载推荐...');recommendations.replaceChildren();createRecommendedSession.disabled=true;try{const limit=Number(recommendationLimit.value);const data=await sbApi.json(`/api/study/practice-recommendations?limit=${limit}`,{signal:pageRequest.signal});if(run!==recommendationGeneration)return;renderRecommendations(Array.isArray(data.items)?data.items:[]);if(data.status==='ready')recommendationStatus.hidden=true}catch(error){if(run===recommendationGeneration)showRecommendation(sbApi.safeError(error),'warn')}}
async function createRecommended(){if(recommendationBusy)return;const ids=[...recommendations.querySelectorAll('input:checked')].map(input=>input.value);if(!ids.length){showRecommendation('请先选择推荐题目','warn');return}recommendationBusy=true;createRecommendedSession.disabled=true;showRecommendation('正在创建练习会话...');try{const session=await sbApi.json('/api/study/practice-sessions',{method:'POST',body:JSON.stringify({title:'推荐练习',exercise_ids:ids,duration_seconds:600,timezone:'UTC',local_date:new Date().toISOString().slice(0,10)}),signal:pageRequest.signal});location.href=`/app/practice-session.html?session_id=${encodeURIComponent(session.id)}`}catch(error){showRecommendation(sbApi.safeError(error),'warn');createRecommendedSession.disabled=false}finally{recommendationBusy=false}}

async function loadSessions(){
sessionStatus.textContent='正在加载练习会话...';
sessionStatus.className='notice';
sessions.replaceChildren();
try{
const run=++sessionGeneration;
const data=await sbApi.json('/api/study/practice-sessions',{signal:pageRequest.signal});
if(run!==sessionGeneration)return;
const items=Array.isArray(data)?data:data.items||[];
if(!items.length){
sessionStatus.textContent='暂无练习会话';
return
}
sessionStatus.hidden=true;
items.forEach(session=>{
const li=document.createElement('li');
li.className='session-item';
const title=document.createElement('div');
title.style.fontWeight='600';
title.textContent=text(session.title)||'练习会话';
const status=document.createElement('span');
status.className='status-badge '+(session.status||'draft');
status.textContent=sbState.label(session.status||'draft');
title.append(status);
const sessionLink=document.createElement('a');
sessionLink.href=`/app/practice-session.html?session_id=${encodeURIComponent(session.id)}`;
sessionLink.className='session-link';
sessionLink.textContent='打开会话';
sessionLink.addEventListener('click',event=>event.stopPropagation());
title.append(sessionLink);
li.append(title);
const meta=document.createElement('div');
meta.className='muted';
meta.style.marginTop='4px';
meta.style.fontSize='12px';
if(session.deadline){
meta.textContent='截止: '+new Date(session.deadline).toLocaleString('zh-CN')
}
li.append(meta);
li.onclick=()=>viewSession(session.id);
sessions.append(li)
})
}catch(e){
sessionStatus.className='notice warn';
sessionStatus.textContent=sbApi.safeError(e)
}
}

async function loadMistakes(){
const run=++mistakeGeneration;
mistakeStatus.textContent='正在加载错题...';
mistakeStatus.className='notice';
mistakes.replaceChildren();
try{
const data=await sbApi.json('/api/study/mistakes',{signal:pageRequest.signal});
if(run!==mistakeGeneration)return;
const items=Array.isArray(data)?data:data.items||[];
if(!items.length){
mistakeStatus.textContent='暂无错题记录';
return
}
mistakeStatus.hidden=true;
items.forEach(mistake=>{
const li=document.createElement('li');
li.className='mistake-item';
const question=document.createElement('div');
question.style.fontWeight='600';
question.textContent=text(mistake.question)||'题目';
const mistakeLink=document.createElement('a');
mistakeLink.href=`/app/review.html?mistake_id=${encodeURIComponent(mistake.id)}`;
mistakeLink.className='mistake-link';
mistakeLink.textContent='查看错题';
mistakeLink.addEventListener('click',event=>event.stopPropagation());
question.replaceChildren(mistakeLink);
li.append(question);
const fact=document.createElement('div');
fact.className='mistake-fact';
fact.style.marginTop='8px';
fact.innerHTML='<strong>错误原因：</strong><br>';
const reason=document.createElement('span');
reason.textContent=text(mistake.mistake_fact)||'未记录';
fact.append(reason);
li.append(fact);
if(mistake.weak_point){
const weak=document.createElement('div');
weak.className='muted';
weak.style.marginTop='8px';
weak.style.fontSize='12px';
weak.textContent='薄弱点: '+text(mistake.weak_point);
li.append(weak)
}
mistakes.append(li)
})
}catch(e){
mistakeStatus.className='notice warn';
mistakeStatus.textContent=sbApi.safeError(e)
}
}

async function viewSession(sessionId){
detailSection.hidden=false;
detailTitle.textContent='会话详情';
detailContent.innerHTML='<div class="notice">正在加载会话详情...</div>';
try{
const session=await sbApi.json(`/api/study/practice-sessions/${encodeURIComponent(sessionId)}`,{signal:pageRequest.signal});
detailContent.replaceChildren();
const container=document.createElement('div');
container.className='session-detail';
const title=document.createElement('div');
title.innerHTML='<strong>标题：</strong>';
title.append(document.createTextNode(text(session.title)));
container.append(title);
const status=document.createElement('div');
status.style.marginTop='8px';
status.innerHTML='<strong>状态：</strong>';
const statusBadge=document.createElement('span');
statusBadge.className='status-badge '+(session.status||'draft');
statusBadge.textContent=sbState.label(session.status||'draft');
status.append(statusBadge);
container.append(status);
if(session.deadline){
const deadline=document.createElement('div');
deadline.style.marginTop='8px';
deadline.innerHTML='<strong>截止时间：</strong>';
deadline.append(document.createTextNode(new Date(session.deadline).toLocaleString('zh-CN')));
container.append(deadline)
}
if(session.status==='draft'){
const actions=document.createElement('div');
actions.style.marginTop='16px';
const startBtn=document.createElement('button');
startBtn.className='btn btn-primary';
startBtn.textContent='开始练习';
startBtn.onclick=()=>startSession(sessionId);
actions.append(startBtn);
container.append(actions)
}else if(session.status==='active'){
const info=document.createElement('div');
info.className='notice';
info.style.marginTop='16px';
info.textContent='会话进行中，请在截止时间前提交答案。';
container.append(info)
}else if(session.status==='finished'){
const resultBtn=document.createElement('button');
resultBtn.className='btn';
resultBtn.style.marginTop='16px';
resultBtn.textContent='查看结果';
resultBtn.onclick=()=>viewResult(sessionId);
container.append(resultBtn)
}
detailContent.append(container)
}catch(e){
detailContent.innerHTML=`<div class="notice warn">${sbApi.safeError(e)}</div>`
}
}

async function startSession(sessionId){
if(!confirm('开始此练习会话？开始后将有时间限制。'))return;
try{
await sbApi.json(`/api/study/practice-sessions/${encodeURIComponent(sessionId)}/start`,{method:'POST'});
alert('会话已开始');
viewSession(sessionId)
}catch(e){
alert(sbApi.safeError(e))
}
}

async function viewResult(sessionId){
try{
const result=await sbApi.json(`/api/study/practice-sessions/${encodeURIComponent(sessionId)}/result`,{signal:pageRequest.signal});
detailContent.replaceChildren();
const container=document.createElement('div');
container.className='session-detail';
const title=document.createElement('div');
title.innerHTML='<strong>练习结果</strong>';
container.append(title);
const score=document.createElement('div');
score.style.marginTop='12px';
score.style.fontSize='20px';
score.style.fontWeight='600';
score.textContent=`得分: ${result.score||0} / ${result.total||0}`;
container.append(score);
if(result.grading_note){
const note=document.createElement('div');
note.className='muted';
note.style.marginTop='8px';
note.textContent=text(result.grading_note);
container.append(note)
}
detailContent.append(container)
}catch(e){
detailContent.innerHTML=`<div class="notice warn">${sbApi.safeError(e)}</div>`
}
}

refreshRecommendations.addEventListener('click',loadRecommendations);
recommendationLimit.addEventListener('change',loadRecommendations);
createRecommendedSession.addEventListener('click',createRecommended);
refreshSessions.addEventListener('click',loadSessions);
refreshMistakes.addEventListener('click',loadMistakes);
loadRecommendations();
loadSessions();
loadMistakes()
})();
</script>
</body>
</html>
