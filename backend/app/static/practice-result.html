<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 练习结果</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header>
<main class="main"><div class="hero"><div><p class="eyebrow">练习 · 结果</p><h1 id="page-title">练习结果</h1><p class="lead">查看本次练习的结果摘要和允许公开的反馈。</p></div><a class="btn" href="/app/practice.html">返回练习</a></div><section class="card"><div id="result-status" class="notice" role="status" aria-live="polite">正在加载结果…</div><div id="result-detail" hidden></div><a id="review-link" class="btn mt-16" href="/app/review.html" hidden>进入复盘</a><button id="retry-result" class="btn mt-16" type="button" hidden>重试</button></section></main></div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){const params=new URLSearchParams(location.search),id=params.get('session_id')||params.get('id'),request=sbApi.setPageScope('practice-result'),status=document.querySelector('#result-status'),detail=document.querySelector('#result-detail'),review=document.querySelector('#review-link'),retry=document.querySelector('#retry-result');let generation=0;function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}async function load(){const run=++generation;if(!id){show('缺少会话标识，无法加载结果','error');return}show('正在加载结果…');retry.hidden=true;review.hidden=true;detail.hidden=true;try{const data=await sbApi.json('/api/study/practice-sessions/'+encodeURIComponent(id)+'/result',{signal:request.signal});if(run!==generation)return;const summary=data.summary||{};detail.replaceChildren();const score=document.createElement('h2');score.textContent=`得分：${summary.score_total||0} / ${summary.total_item_count||0}`;detail.append(score);const progress=document.createElement('p');progress.className='muted';progress.textContent=`已评分：${summary.scored_count||0}，已提交：${summary.submitted_count||0}`;detail.append(progress);detail.hidden=false;review.hidden=false;status.hidden=true}catch(error){if(run!==generation)return;show(sbApi.safeError(error),'error');retry.hidden=false}}retry.onclick=load;load()})();</script></body></html>
