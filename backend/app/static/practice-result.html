<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 练习结果</title>
<link rel="stylesheet" href="/app/css/tokens.css">
<link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header>
<main class="main"><div class="hero"><div><p class="eyebrow">练习 · 结果</p><h1 id="page-title">练习结果</h1><p class="lead">查看本次练习的结果摘要。</p></div><a class="btn" href="/app/practice.html">返回练习</a></div><section class="card" aria-labelledby="page-title"><div id="result-status" class="notice" role="status" aria-live="polite">正在加载结果…</div><div id="result-detail" hidden></div><button id="retry-result" class="btn" type="button" hidden>重试</button></section></main></div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script>
<script>(function(){const id=new URLSearchParams(location.search).get('session_id')||new URLSearchParams(location.search).get('id');const request=sbApi.setPageScope('practice-result');const status=document.querySelector('#result-status');const detail=document.querySelector('#result-detail');const retry=document.querySelector('#retry-result');let generation=0;function show(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}async function load(){const run=++generation;if(!id){show('缺少会话标识，无法加载结果','error');return}show('正在加载结果…');retry.hidden=true;detail.hidden=true;try{const data=await sbApi.json('/api/study/practice-sessions/'+encodeURIComponent(id)+'/result',{signal:request.signal});if(run!==generation)return;detail.replaceChildren();const score=document.createElement('h2');score.textContent=`得分：${data.score||0} / ${data.total||0}`;detail.append(score);if(typeof data.grading_note==='string'&&data.grading_note){const note=document.createElement('p');note.className='muted';note.textContent=data.grading_note;detail.append(note)}detail.hidden=false;status.hidden=true}catch(error){if(run!==generation)return;show(sbApi.safeError(error),'error');retry.hidden=false}}retry.onclick=load;load()})();</script>
</body></html>
