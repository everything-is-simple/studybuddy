<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 材料详情</title><link rel="stylesheet" href="/app/css/app.css"></head><body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><p class="eyebrow">材料详情 · 灰盒</p><h1 id="title">加载材料…</h1><p id="state" class="muted" role="status" aria-live="polite"></p><div class="grid"><section class="card span-8" data-od-id="material-detail-content"><h2>来源与索引</h2><div id="content" class="stack"><div class="notice">详情数据将从已验证材料 API 读取。完整 revision、导出和生命周期操作仍保留在原工作区，待本页回归后迁移。</div></div></section><aside class="card span-4" data-od-id="material-detail-actions"><h2>下一步</h2><div class="stack"><a id="qa" class="btn btn-primary" href="/app/qa.html">进入问答</a><a class="btn" href="/app/materials.html">返回资料库</a></div></aside></div></main></div><script src="/app/js/api.js"></script><script src="/app/js/shell.js"></script><script>(async function(){const id=new URLSearchParams(location.search).get('material'),title=document.querySelector('#title'),state=document.querySelector('#state'),content=document.querySelector('#content'),qa=document.querySelector('#qa');if(!id){title.textContent='缺少材料标识';state.textContent='请从资料库进入材料详情。';qa.removeAttribute('href');return}qa.href='/app/qa.html?material='+encodeURIComponent(id);try{const row=await sbApi.json('/api/materials/'+encodeURIComponent(id));const name=typeof row.original_name==='string'?row.original_name:(typeof row.display_name==='string'?row.display_name:'材料详情');title.textContent=name;state.textContent='材料已加载';const status=document.createElement('p');status.className='badge badge-success';status.textContent=typeof row.status==='string'?row.status:'可查看';content.append(status)}catch(e){title.textContent='材料不可用';state.textContent=sbApi.safeError(e);state.className='error';content.querySelector('.notice').textContent='该材料可能已删除、恢复中或当前不可访问。请返回资料库重试。'}})()</script></body></html>
