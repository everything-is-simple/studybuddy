<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 材料详情</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header>
<main class="main"><p class="eyebrow">材料详情</p><h1 id="title">加载材料…</h1><p id="state" class="muted" role="status" aria-live="polite"></p>
<div class="grid"><section class="card span-8" data-od-id="material-detail-content"><h2>材料信息</h2><div id="content" class="stack"><div class="notice">正在加载材料详情...</div></div><section class="material-body"><h2>解析正文</h2><div id="body-location" class="notice muted" hidden role="status"></div><pre id="body" class="material-text">正文将在材料加载后显示。</pre></section></section>
<aside class="card span-4" data-od-id="material-detail-actions"><h2>操作</h2><div class="stack"><div class="action-group"><a id="qa" class="btn btn-primary" href="/app/qa.html">进入问答</a><button id="index" class="btn" type="button">建立 AI 索引</button><button id="export-original" class="btn" type="button">下载原文件</button><button id="export-text" class="btn" type="button">导出解析文本</button></div><div id="index-status" class="notice muted" role="status" aria-live="polite">正在检查索引状态…</div><a class="btn" href="/app/materials.html">返回资料库</a></div></aside></div></main></div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script>
<script>(function(){
const id=new URLSearchParams(location.search).get('material'),citationKey=new URLSearchParams(location.search).get('citation'),request=sbApi.setPageScope('material-detail');
const title=document.querySelector('#title'),state=document.querySelector('#state'),content=document.querySelector('#content'),body=document.querySelector('#body'),locationNotice=document.querySelector('#body-location'),qa=document.querySelector('#qa'),index=document.querySelector('#index'),indexStatus=document.querySelector('#index-status'),original=document.querySelector('#export-original'),text=document.querySelector('#export-text');let material=null,indexing=false;
function showState(message,kind){state.className=kind?'error':'muted';state.textContent=message}function showIndex(message,kind){indexStatus.className='notice '+(kind||'muted');indexStatus.textContent=message}function label(value){return sbState.label(value||'unknown')}function disableActions(){qa.removeAttribute('href');index.disabled=true;original.disabled=true;text.disabled=true}
function renderBody(value,start,end){body.replaceChildren();const source=typeof value==='string'?value:'';if(typeof start!=='number'||typeof end!=='number'||start<0||end<start||end>source.length){body.textContent=source||'没有可显示的正文';return}body.append(document.createTextNode(source.slice(0,start)));const mark=document.createElement('mark');mark.className='citation-highlight';mark.id='citation-location';mark.textContent=source.slice(start,end);body.append(mark,document.createTextNode(source.slice(end)));requestAnimationFrame(()=>mark.scrollIntoView({block:'center',inline:'nearest'}))}
function renderMaterial(row){const name=typeof row.original_name==='string'?row.original_name:(typeof row.display_name==='string'?row.display_name:'材料详情');title.textContent=name;showState('材料已加载');const meta=document.createElement('dl');meta.className='meta-grid';for(const [key,value] of [['解析状态',label(row.status)],['解析器',row.parser_id||'未知'],['文件类型',row.media_type||'未知'],['文本长度',(row.text_length||0)+' 字符'],['片段数量',(row.span_count||0)+' 个']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;meta.append(dt,dd)}if(row.indexed_at){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent='索引时间';dd.textContent=new Date(row.indexed_at).toLocaleString('zh-CN');meta.append(dt,dd)}if(Array.isArray(row.warnings)&&row.warnings.length){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent='解析提示';dd.className='warn';dd.textContent=row.warnings.join('；');meta.append(dt,dd)}if(row.status==='empty'){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent='下一步';dd.className='warn';dd.textContent=row.media_type==='application/pdf'?'此 PDF 没有可提取的文字层。请先使用 OCR 生成可搜索 PDF，或上传 UTF-8 文本。':'文件中没有可提取的正文。请确认内容不是仅图片、文本框或嵌入对象，再转换为 PDF 或纯文本重试。';meta.append(dt,dd)}if(row.status==='rejected'||row.status==='failed'){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent='下一步';dd.className='warn';dd.textContent=(row.error_code?sbApi.safeError({code:row.error_code}):'解析失败')+'。请转换或修复文件后重新导入。';meta.append(dt,dd)}content.replaceChildren(meta);renderBody(row.text)}
async function refreshIndex(){try{const data=await sbApi.json('/api/materials/'+encodeURIComponent(id)+'/ai-index',{signal:request.signal});const status=data.status||'unknown';showIndex(status==='ready'?'AI 索引已建立，可用于问答':status==='empty'?'材料没有可用于问答的正文':'当前索引状态：'+label(status),status==='ready'?'status-ready':'muted')}catch(error){showIndex('索引状态暂不可用','warn')}}
async function locateCitation(){if(!citationKey)return;locationNotice.hidden=false;locationNotice.className='notice muted';locationNotice.textContent='正在定位引用…';try{const citation=await sbApi.json('/api/qa/citations/'+encodeURIComponent(citationKey),{signal:request.signal});if(citation.material_id!==id){locationNotice.className='notice warn';locationNotice.textContent='该引用不属于当前材料。';return}if(citation.status!=='valid'){locationNotice.className='notice warn';locationNotice.textContent=citation.status==='source_deleted'?'引用来源已删除，无法定位正文。':'引用来源当前不可用。';return}renderBody(material.text,citation.start_offset,citation.end_offset);locationNotice.className='notice status-ready';locationNotice.textContent='已定位引用来源'+(citation.excerpt?'：'+citation.excerpt:'');}catch(error){locationNotice.className='notice warn';locationNotice.textContent='引用定位失败，可返回问答历史重试。'}}
index.onclick=async()=>{if(indexing)return;indexing=true;index.disabled=true;showIndex('正在建立 AI 索引…');try{await sbApi.json('/api/materials/'+encodeURIComponent(id)+'/ai-index',{method:'POST',headers:{'Idempotency-Key':sbApi.idempotencyKey()},signal:request.signal});showIndex('AI 索引已建立，可用于问答','status-ready')}catch(error){showIndex(sbApi.safeError(error)+' 可重试。','warn')}finally{indexing=false;index.disabled=false}};
async function load(){if(!id){title.textContent='缺少材料标识';showState('请从资料库进入材料详情。');disableActions();showIndex('需要先选择材料。','warn');return}qa.href='/app/qa.html?material='+encodeURIComponent(id);try{material=await sbApi.json('/api/materials/'+encodeURIComponent(id),{signal:request.signal});renderMaterial(material);await Promise.all([refreshIndex(),locateCitation()]);original.onclick=()=>{location.href='/api/materials/'+encodeURIComponent(id)+'/original'};text.onclick=()=>{location.href='/api/materials/'+encodeURIComponent(id)+'/text'}}catch(error){title.textContent='材料不可用';showState(sbApi.safeError(error),true);content.replaceChildren(Object.assign(document.createElement('div'),{className:'notice warn',textContent:'该材料可能已删除、恢复中或当前不可访问。请返回资料库重试。'}));body.textContent='正文不可用。';disableActions();showIndex('索引状态不可用。','warn')}}load()})();</script></body></html>
