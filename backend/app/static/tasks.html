<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 任务状态</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">系统监控</p>
<h1>任务状态</h1>
<p class="lead">查看后台任务的运行状态、重试和取消操作。</p>
</div>
</div>

<section class="card" data-od-id="task-capability-notice">
<h2>任务运行器状态</h2>
<div class="task-notice">
<p><strong>当前支持的任务类型：</strong></p>
<ul class="list-indented">
<li><code class="code-inline">embedding_index</code> — 材料向量索引（已验证）</li>
</ul>
<p class="mt-12 mb-0"><strong>其它任务类型显示为"尚未接入任务运行器"。</strong></p>
</div>
</section>

<section class="card mt-24" data-od-id="task-list">
<div class="section-label">
<h2>任务列表</h2>
<span id="state" class="muted" role="status" aria-live="polite">说明</span>
</div>
<div class="filters">
<select id="status-filter" aria-label="状态筛选">
<option value="">全部状态</option>
<option value="queued">等待中</option>
<option value="running">运行中</option>
<option value="succeeded">已完成</option>
<option value="failed">失败</option>
<option value="cancelled">已取消</option>
</select>
<button class="btn" id="apply-filters" type="button">应用筛选</button>
<button class="btn" id="refresh-btn" type="button">刷新</button>
</div>
<div id="error" class="error" role="alert" hidden></div>
<div id="tasks" class="task-grid"></div>
<div id="info" class="notice mt-16">
<p><strong>说明：</strong>当前页面仅展示通过材料详情页、问答页面等触发的 <code>embedding_index</code> 任务。</p>
<p class="mt-8 mb-0">如需查看具体任务，请通过触发任务的功能入口（如材料索引、问答）访问，或在地址栏输入 <code>/app/tasks.html?task_id=&lt;任务ID&gt;</code>。</p>
</div>
</section>

<section class="card mt-24" data-od-id="task-detail" id="task-detail-section" hidden>
<div class="section-label">
<h2>任务详情</h2>
<span id="detail-state" class="muted" role="status" aria-live="polite"></span>
</div>
<div id="detail-error" class="error" role="alert" hidden></div>
<div id="task-detail"></div>
</section>
</main>
</div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(function(){
const pageRequest=sbApi.setPageScope('tasks');
const state=document.querySelector('#state');
const error=document.querySelector('#error');
const tasks=document.querySelector('#tasks');
const info=document.querySelector('#info');
const statusFilter=document.querySelector('#status-filter');
const applyFilters=document.querySelector('#apply-filters');
const refreshBtn=document.querySelector('#refresh-btn');
let listGeneration=0;let listBusy=false;

const taskDetailSection=document.querySelector('#task-detail-section');
const detailState=document.querySelector('#detail-state');
const detailError=document.querySelector('#detail-error');
const taskDetail=document.querySelector('#task-detail');

const urlParams=new URLSearchParams(window.location.search);
const taskId=urlParams.get('task_id');
let detailGeneration=0;
let pollTimer=null;

function text(value){return typeof value==='string'?value:''}

if(taskId){
info.hidden=true;
taskDetailSection.hidden=false;
loadTaskDetail(taskId);
pollTimer=setInterval(()=>loadTaskDetail(taskId),3000);
window.addEventListener('pagehide',()=>clearInterval(pollTimer),{once:true})
}else{
loadTaskList();
}

async function loadTaskDetail(id){
const generation=++detailGeneration;
detailState.textContent='加载中…';
detailError.hidden=true;
taskDetail.replaceChildren();
try{
const data=await sbApi.json(`/api/tasks/${encodeURIComponent(id)}`,{signal:pageRequest.signal});
if(generation!==detailGeneration)return;
detailState.textContent='已加载';
renderTaskDetail(data)
}catch(e){
detailState.textContent='加载失败';
detailError.textContent=sbApi.safeError(e);
detailError.hidden=false
}
}

function renderTaskDetail(data){
taskDetail.replaceChildren();

const card=document.createElement('div');
card.className='task-card';

const header=document.createElement('div');
header.className='task-header';

const h3=document.createElement('h3');
h3.textContent=text(data.task_id).slice(0,12)+'...';
h3.title=text(data.task_id);
header.append(h3);

const statusBadge=createStatusBadge(data.status);
header.append(statusBadge);

card.append(header);

const dl=document.createElement('dl');
dl.className='task-meta';

addMeta(dl,'任务类型',text(data.task_kind)||text(data.operation_type)||'未知');
addMeta(dl,'状态',sbState.label(data.status));
if(data.created_at)addMeta(dl,'创建于',formatDate(data.created_at));
if(data.started_at)addMeta(dl,'开始于',formatDate(data.started_at));
if(data.finished_at)addMeta(dl,'完成于',formatDate(data.finished_at));
if(data.error_code)addMeta(dl,'错误码',text(data.error_code));
if(data.retry_count!=null)addMeta(dl,'重试次数',String(data.retry_count));

card.append(dl);

if(data.progress_percent!=null&&data.progress_percent>=0&&data.progress_percent<=100){
const progress=data.progress_percent;
const progressBar=document.createElement('div');
progressBar.className='progress-bar';
const progressFill=document.createElement('div');
progressFill.className='progress-fill';
progressFill.style.width=progress+'%';
progressFill.setAttribute('role','progressbar');progressFill.setAttribute('aria-valuemin','0');progressFill.setAttribute('aria-valuemax','100');progressFill.setAttribute('aria-valuenow',String(data.progress));
progressBar.append(progressFill);
card.append(progressBar);

const progressLabel=document.createElement('p');
progressLabel.className='muted';
progressLabel.classList.add('item-meta');
progressLabel.textContent=`进度：${progress}%`;
card.append(progressLabel)
}

const actions=document.createElement('div');
actions.className='task-actions';

if(data.status==='pending'||data.status==='running'){
const cancelBtn=document.createElement('button');
cancelBtn.className='btn';
cancelBtn.textContent='取消';
cancelBtn.onclick=()=>cancelTask(data.task_id);
actions.append(cancelBtn)
}

if(data.status==='failed'||data.status==='cancelled'){
const retryBtn=document.createElement('button');
retryBtn.className='btn btn-primary';
retryBtn.textContent='重试';
retryBtn.onclick=()=>retryTask(data.task_id);
actions.append(retryBtn)
}

card.append(actions);

taskDetail.append(card)
}

async function loadTaskList(){
const run=++listGeneration;state.textContent='加载中…';error.hidden=true;tasks.replaceChildren();
try{const params=new URLSearchParams();if(statusFilter.value)params.set('status',statusFilter.value);const data=await sbApi.json('/api/tasks?'+params,{signal:pageRequest.signal});if(run!==listGeneration)return;const items=Array.isArray(data.items)?data.items:[];state.textContent=items.length?`共 ${data.total||0} 个任务`:'当前无全局任务列表';if(!items.length){tasks.append(Object.assign(document.createElement('p'),{className:'muted',textContent:'暂无任务'}));return}items.forEach(renderTaskCard)}catch(e){if(run!==listGeneration)return;state.textContent='加载失败';error.textContent=sbApi.safeError(e);error.hidden=false}}
function renderTaskCard(data){const card=document.createElement('article');card.className='task-card';const h3=document.createElement('h3');h3.textContent=text(data.task_id).slice(0,12)+'…';card.append(h3,createStatusBadge(data.status));const meta=document.createElement('p');meta.className='muted';meta.textContent=`${text(data.operation_type)||'任务'} · ${data.progress_percent||0}% · ${formatDate(data.created_at)}`;card.append(meta);const open=document.createElement('a');open.className='btn';open.href=`/app/tasks.html?task_id=${encodeURIComponent(data.task_id)}`;open.textContent='查看详情';card.append(open);tasks.append(card)}

function createStatusBadge(status){
const badge=document.createElement('span');
badge.className='task-status '+status;
const statusMap={
pending:'等待中',
queued:'等待中',
running:'运行中',
success:'已完成',
succeeded:'已完成',
failed:'失败',
cancelled:'已取消'
};
badge.textContent=statusMap[status]||sbState.label(status);
return badge
}

function addMeta(dl,key,value){
const dt=document.createElement('dt');
dt.textContent=key;
const dd=document.createElement('dd');
dd.textContent=value;
dl.append(dt,dd)
}

function formatDate(iso){
if(!iso)return'未知';
try{
return new Date(iso).toLocaleString('zh-CN')
}catch(e){
return iso
}
}

async function cancelTask(id){
if(!confirm('确定取消此任务吗？'))return;
try{
await sbApi.json(`/api/tasks/${encodeURIComponent(id)}/cancel`,{method:'POST',signal:pageRequest.signal});
alert('任务已取消');
loadTaskDetail(id)
}catch(e){
alert(sbApi.safeError(e))
}
}

async function retryTask(id){
if(!confirm('确定重试此任务吗？'))return;
try{
await sbApi.json(`/api/tasks/${encodeURIComponent(id)}/retry`,{method:'POST',signal:pageRequest.signal});
alert('任务已加入重试队列');
loadTaskDetail(id)
}catch(e){
alert(sbApi.safeError(e))
}
}

refreshBtn.onclick=()=>{
if(taskId){
loadTaskDetail(taskId)
}
};

applyFilters.onclick=()=>loadTaskList();
refreshBtn.onclick=()=>taskId?loadTaskDetail(taskId):loadTaskList();
})();
</script>
</body>
</html>
