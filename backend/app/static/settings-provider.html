<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · Provider 设置</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
<style>
.capability-grid{display:grid;gap:16px}
.capability-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.capability-header{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:12px}
.capability-header h3{margin:0}
.capability-status{display:flex;align-items:center;gap:8px;font-size:14px}
.capability-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.capability-status.available::before{background:var(--success)}
.capability-status.unavailable::before{background:var(--danger)}
.capability-meta{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.capability-meta dt{font-weight:600;color:var(--fg)}
.capability-meta dd{margin:0}
.config-notice{border-left:3px solid var(--warn);padding:12px 16px;background:#fffbf0;margin-top:16px}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);background-size:200% 100%;animation:skeleton 1.5s ease-in-out infinite}
@keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-text{height:1em;border-radius:4px;margin:4px 0}
@media(max-width:640px){
.capability-header{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">系统设置</p>
<h1>Provider 能力状态</h1>
<p class="lead">查看当前配置的 AI Provider 能力与连接状态。</p>
</div>
</div>

<section class="card" data-od-id="provider-config-notice">
<h2>配置说明</h2>
<div class="config-notice">
<p><strong>注意：</strong>Provider 配置写入契约尚未完成批准。</p>
<p class="mt-8 mb-0">当前页面仅显示后端配置的能力状态，不支持在浏览器中修改 Provider 配置、保存密钥或执行连接测试。</p>
</div>
</section>

<section class="card mt-24" data-od-id="provider-capabilities">
<div class="section-label">
<h2>能力状态</h2>
<span id="state" class="muted" role="status" aria-live="polite">加载中…</span>
</div>
<div id="error" class="error" role="alert" hidden></div>
<div id="loading" aria-hidden="true">
<div class="capability-card skeleton">
<div class="skeleton-text skeleton-40"></div>
<div class="skeleton-text skeleton-60"></div>
<div class="skeleton-text skeleton-80"></div>
</div>
</div>
<div id="capabilities" class="capability-grid" hidden></div>
</section>

<section class="card mt-24" data-od-id="provider-health">
<h2>系统健康状态</h2>
<div id="health-status" role="status" aria-live="polite">
<p class="muted">检查中…</p>
</div>
</section>
</main>
</div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(function(){
const pageRequest=sbApi.setPageScope('settings-provider');
const state=document.querySelector('#state');
const error=document.querySelector('#error');
const loading=document.querySelector('#loading');
const capabilities=document.querySelector('#capabilities');
const healthStatus=document.querySelector('#health-status');

function text(value){return typeof value==='string'?value:''}
function bool(value){return value===true}

let loadGeneration=0;
async function load(){
const generation=++loadGeneration;
state.textContent='加载中…';
error.hidden=true;
loading.hidden=false;
capabilities.hidden=true;
try{
const data=await sbApi.json('/api/ai/capabilities',{signal:pageRequest.signal});
if(generation!==loadGeneration)return;
renderCapabilities(data);
state.textContent='已加载';
loading.hidden=true;
capabilities.hidden=false
}catch(e){
state.textContent='加载失败';
error.textContent=sbApi.safeError(e);
error.hidden=false;
loading.hidden=true
}
}

function renderCapabilities(data){
capabilities.replaceChildren();

// LLM Provider
const llm=data.llm||data;
if(llm){
const card=createCapabilityCard(
'LLM Provider',
llm.available?'available':'unavailable',
llm.available?'可用':'不可用',
{
'Provider ID':text(llm.provider_id||llm.embedding_provider||'未配置'),
'Model ID':text(llm.model_id||llm.embedding_model||'未配置'),
'支持':formatCapabilities(llm)
}
);
capabilities.append(card)
}

// Embedding Provider
const embedding=data.embedding;
if(embedding){
const card=createCapabilityCard(
'Embedding Provider',
embedding.available?'available':'unavailable',
embedding.available?'可用':'不可用',
{
'Provider ID':text(embedding.provider_id||embedding.embedding_provider||'未配置'),
'Model ID':text(embedding.model_id||embedding.embedding_model||'未配置'),
'维度':embedding.dimensions?String(embedding.dimensions):'未知',
'最大输入字符':embedding.max_text_chars?String(embedding.max_text_chars):'未知'
}
);
capabilities.append(card)
}else if(!data.embedding&&data.available){
// Legacy response without explicit embedding
const card=createCapabilityCard(
'Embedding Provider',
'unavailable',
'未配置',
{'说明':'后端未显式配置 Embedding Provider'}
);
capabilities.append(card)
}
}

function createCapabilityCard(title,statusClass,statusText,meta){
const card=document.createElement('div');
card.className='capability-card';

const header=document.createElement('div');
header.className='capability-header';

const h3=document.createElement('h3');
h3.textContent=title;
header.append(h3);

const status=document.createElement('span');
status.className='capability-status '+statusClass;
status.textContent=statusText;
header.append(status);

card.append(header);

if(meta&&Object.keys(meta).length>0){
const dl=document.createElement('dl');
dl.className='capability-meta';
Object.entries(meta).forEach(([key,value])=>{
const dt=document.createElement('dt');
dt.textContent=key;
const dd=document.createElement('dd');
dd.textContent=value;
dl.append(dt,dd)
});
card.append(dl)
}

return card
}

function formatCapabilities(cap){
const parts=[];
if(bool(cap.supports_chat))parts.push('对话');
if(bool(cap.supports_completion))parts.push('补全');
if(bool(cap.supports_streaming))parts.push('流式');
if(bool(cap.supports_tools))parts.push('工具调用');
if(bool(cap.supports_json_mode))parts.push('JSON 模式');
return parts.length?parts.join('、'):'无明确声明'
}

async function checkHealth(){
try{
const data=await sbApi.json('/api/readiness',{signal:pageRequest.signal});
healthStatus.replaceChildren();const badge=document.createElement('p');badge.className='badge badge-success';badge.textContent='系统就绪';healthStatus.append(badge)
}catch(e){
const msg=sbApi.safeError(e);
healthStatus.replaceChildren();const badge=document.createElement('p');badge.className='badge badge-warn';badge.textContent=msg;healthStatus.append(badge)
}
}

load();
checkHealth()
})();
</script>
</body>
</html>
