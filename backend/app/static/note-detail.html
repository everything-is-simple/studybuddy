<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 笔记详情</title>
<link rel="stylesheet" href="/app/css/tokens.css">
<link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div></header>
<main class="main">
<div class="hero"><div>
<p class="eyebrow">资料笔记 · 详情</p>
<h1 id="page-title">笔记详情</h1>
<p class="lead">查看笔记类型、内容、引用和来源状态。</p>
</div><a class="btn" href="/app/notes.html">返回笔记</a></div>
<section class="card" aria-labelledby="page-title">
<div id="note-status" class="notice" role="status" aria-live="polite">正在加载笔记…</div>
<div id="note-detail" hidden></div>
<button id="retry-note" class="btn" type="button" hidden>重试</button>
</section>
</main>
</div>
<script src="/app/js/api.js"></script>
<script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(function(){
const params=new URLSearchParams(location.search);const noteId=params.get('note_id')||params.get('id');
const pageRequest=sbApi.setPageScope('note-detail');const status=document.querySelector('#note-status');const detail=document.querySelector('#note-detail');const retry=document.querySelector('#retry-note');let generation=0;
function text(value){return typeof value==='string'?value:''}
function showStatus(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}
function field(label,value){const row=document.createElement('div');row.className='detail-row';const name=document.createElement('strong');name.textContent=label+'：';row.append(name,document.createTextNode(text(value)));return row}
function noteTypeLabel(note){const provenance=text(note.provenance)||text(note.note_type)||'user_created';return sbState.label(provenance==='ai_generated'?'ai_draft':provenance==='user_created'?'user':provenance)}
// get_note returns blocks[].sources[].status; there is no top-level source_citation_status.
function derivedSourceStatus(note){const statuses=[];(Array.isArray(note.blocks)?note.blocks:[]).forEach(block=>{(Array.isArray(block.sources)?block.sources:[]).forEach(source=>statuses.push(text(source.status)||'valid'))});if(!statuses.length)return sbState.source('');if(statuses.some(status=>status!=='valid'))return sbState.source(statuses.find(status=>status!=='valid'));return sbState.source('valid')}
function render(note){detail.replaceChildren();const title=document.createElement('h2');title.textContent=text(note.title)||'未命名笔记';detail.append(title);detail.append(field('类型',noteTypeLabel(note)));detail.append(field('状态',sbState.label(text(note.status)||'draft')));const blocks=Array.isArray(note.blocks)?note.blocks:[];blocks.forEach((block,index)=>{const blockBox=document.createElement('div');blockBox.className='detail-block';blockBox.append(field('笔记区块 '+(index+1),''));const body=document.createElement('div');body.className='note-content';body.textContent=text(block.content);blockBox.append(body);const sources=Array.isArray(block.sources)?block.sources:[];if(sources.length){const citations=document.createElement('div');citations.className='citations';citations.textContent='引用：'+sources.map(source=>{const key=text(source.citation_key)||'来源';const sourceStatus=text(source.status)||'valid';return sourceStatus==='valid'?key:key+'（'+sbState.source(sourceStatus)+'）'}).join('、');blockBox.append(citations)}detail.append(blockBox)});if(!blocks.length)detail.append(field('笔记内容','（空）'));const modules=Array.isArray(note.modules)?note.modules:[];detail.append(field('知识模块',modules.length?modules.map(module=>text(module.title)||'未命名模块').join('；'):'未关联'));if(Number(note.source_warning_count)>0){const warning=document.createElement('div');warning.className='notice warn';warning.textContent='来源警告：'+note.source_warning_count+' 个引用不可用';detail.append(warning)}detail.append(field('来源状态',derivedSourceStatus(note)));if(note.user_edited)detail.append(field('编辑记录','已由用户编辑'));detail.hidden=false}
async function load(){const run=++generation;if(!noteId){showStatus('缺少笔记标识，无法加载详情','error');retry.hidden=true;return}showStatus('正在加载笔记…');retry.hidden=true;detail.hidden=true;try{const note=await sbApi.json('/api/study/notes/'+encodeURIComponent(noteId),{signal:pageRequest.signal});if(run!==generation)return;render(note);status.hidden=true}catch(error){if(run!==generation)return;showStatus(sbApi.safeError(error),'error');retry.hidden=false}}
retry.addEventListener('click',load);load();
})();
</script>
</body>
</html>
