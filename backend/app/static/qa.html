<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 问答</title><link rel="stylesheet" href="/app/css/app.css"></head><body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">问答 · 引用可追溯</p><h1>围绕材料提问</h1><p class="lead">问答线程、材料范围和引用定位将在本页逐步迁移。</p></div><a class="btn hero-action" href="/app/materials.html">选择材料</a></div><div class="grid"><section class="card span-8" data-od-id="qa-thread"><h2>当前线程</h2><div id="state" class="notice" role="status" aria-live="polite">正在读取线程…</div><div id="thread" class="empty">暂无线程。现有完整问答工作区仍可从原入口使用。</div></section><aside class="card span-4" data-od-id="qa-citation"><h2>引用</h2><p class="muted">回答中的 citation、revision、chunk 和来源失效状态将在迁移时接入。</p><button class="btn" type="button" disabled>定位引用（待迁移）</button></aside></div><p class="footer-note">当前灰盒不会伪造回答、Provider 成功或引用正文。<a href="/">打开原工作区</a></p></main></div><script src="/app/js/api.js"></script><script src="/app/js/shell.js"></script><script>(async function(){const state=document.querySelector('#state'),thread=document.querySelector('#thread');try{const rows=await sbApi.json('/api/qa/threads');const list=Array.isArray(rows)?rows:Array.isArray(rows.items)?rows.items:[];if(list.length){state.textContent='已读取 '+list.length+' 个线程';thread.textContent='线程列表已就绪，详细时间线和问答提交正在迁移。';thread.className='notice'}else{state.textContent='暂无线程';thread.textContent='还没有问答线程。请从原工作区开始一次提问。'}}catch(e){state.textContent=sbApi.safeError(e);state.className='notice warn';thread.textContent='线程读取失败，请重试或返回原工作区。';thread.className='error'}})()</script></body></html>
