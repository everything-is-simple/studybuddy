<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 问答</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">问答</p><h1>围绕材料提问</h1><p class="lead">基于已索引材料的智能问答，支持引用追溯。</p></div><a class="btn hero-action" href="/app/materials.html">选择材料</a></div><div class="grid"><section class="card span-8" data-od-id="qa-submit"><h2>提问</h2><div id="provider-status" class="notice" role="status" aria-live="polite">正在检查 AI Provider 状态...</div><form class="qa-form" id="qa-form"><div class="field"><label for="question">你的问题</label><textarea id="question" name="question" required placeholder="输入你的问题..." aria-describedby="question-help"></textarea><span id="question-help" class="muted">问答会基于选定的材料范围进行检索</span></div><div class="field"><label for="materials">材料范围</label><input type="text" id="materials" name="materials" placeholder="选择材料或输入 ID" aria-describedby="materials-help"><div id="material-picker" class="material-picker" role="group" aria-label="可选材料"></div><span id="materials-help" class="muted">选择一个或多个材料；也可输入材料 ID，多个用逗号分隔</span></div><div class="field"><label for="retrieval-mode">检索模式</label><select id="retrieval-mode" name="retrieval_mode"><option value="hybrid">混合检索（推荐）</option><option value="lexical">词法检索</option><option value="vector">向量检索</option></select></div><button class="btn mr-8" type="button" id="index-btn">索引当前材料</button><button class="btn btn-primary" type="submit" id="submit-btn">提交问题</button><div id="submit-status" class="notice mt-12" hidden role="status" aria-live="polite"></div></form></section><aside class="card span-4" data-od-id="qa-config"><h2>配置</h2><p class="muted">混合检索结合词法和向量匹配，适合大多数场景。向量检索需要已配置 Embedding Provider。</p><p class="muted mt-12">问答支持幂等提交保护，相同问题不会重复处理。</p></aside></div><section class="card mt-24" data-od-id="qa-threads"><h2>问答历史</h2><div id="thread-status" class="notice" role="status" aria-live="polite">正在加载线程...</div><div id="threads"></div></section></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script>
<script>(function(){
const request=sbApi.setPageScope('qa'),providerStatus=document.querySelector('#provider-status'),form=document.querySelector('#qa-form'),questionInput=document.querySelector('#question'),materialsInput=document.querySelector('#materials'),materialPicker=document.querySelector('#material-picker'),modeSelect=document.querySelector('#retrieval-mode'),indexBtn=document.querySelector('#index-btn'),submitBtn=document.querySelector('#submit-btn'),submitStatus=document.querySelector('#submit-status'),threadStatus=document.querySelector('#thread-status'),threads=document.querySelector('#threads');let threadGeneration=0,materialGeneration=0;
const materialParam=new URLSearchParams(location.search).get('material');if(materialParam)materialsInput.value=materialParam;function ids(){return materialsInput.value.trim().split(',').map(value=>value.trim()).filter(Boolean)}
function syncPicker(){const selected=new Set(ids());materialPicker.querySelectorAll('input').forEach(input=>{input.checked=selected.has(input.value)})}
function renderMaterials(data){const rows=Array.isArray(data)?data:data.items||[];materialPicker.replaceChildren();if(!rows.length){materialPicker.textContent='暂无可用材料，请先导入材料。';return}rows.forEach(row=>{const id=String(row.id||row.material_id||'');if(!id)return;const label=document.createElement('label');label.className='material-choice';const input=document.createElement('input');input.type='checkbox';input.value=id;input.checked=ids().includes(id);input.setAttribute('aria-label','选择 '+(row.original_name||'材料'));input.onchange=()=>{const selected=ids().filter(value=>value!==id);if(input.checked)selected.push(id);materialsInput.value=selected.join(', ')};label.append(input,document.createTextNode(' '+(row.original_name||'未命名材料')));materialPicker.append(label)})}
async function loadMaterials(){const generation=++materialGeneration;try{const data=await sbApi.json('/api/materials?limit=100&offset=0',{signal:request.signal});if(generation===materialGeneration)renderMaterials(data)}catch(_){if(generation===materialGeneration)materialPicker.textContent='材料列表暂时不可用，可手动输入材料 ID。'}}
materialsInput.addEventListener('input',syncPicker);function message(value,kind){submitStatus.hidden=false;submitStatus.className='notice mt-12'+(kind?' '+kind:'');submitStatus.textContent=value}function citationLink(citation,index){const link=document.createElement('a');link.className='citation-link';const available=citation.status!=='source_deleted'&&citation.status!=='source_unavailable';link.href=available?'/app/material-detail.html?material='+encodeURIComponent(citation.material_id||'')+'&citation='+encodeURIComponent(citation.citation_key||''):'';link.textContent='['+(citation.position||index+1)+'] '+(citation.material_name||'材料')+(available?'':'（来源不可用）');if(!available){link.removeAttribute('href');link.setAttribute('aria-disabled','true')}return link}
async function checkCapabilities(){try{const data=await sbApi.json('/api/ai/capabilities',{signal:request.signal}),status=data.llm_status||'not_configured',provider=data.llm_provider||'unknown',model=data.llm_model||'unknown';if(status==='not_configured'){providerStatus.className='notice warn';providerStatus.textContent='AI Provider 未配置，问答功能不可用'}else if(status==='demo'){providerStatus.className='notice';providerStatus.textContent='当前使用 '+provider+'/'+model+'（演示模式）'}else{providerStatus.className='notice';providerStatus.textContent='AI Provider: '+provider+'/'+model+' ('+(data.llm_verification_status||'unverified')+')'}}catch(error){providerStatus.className='notice warn';providerStatus.textContent='AI Provider 状态检查失败，可刷新重试'}}
indexBtn.onclick=async()=>{const materialIds=ids();if(!materialIds.length){message('请先指定要索引的材料 ID','warn');return}indexBtn.disabled=true;message('正在建立索引...');try{for(const materialId of materialIds)await sbApi.json('/api/materials/'+encodeURIComponent(materialId)+'/ai-index',{method:'POST',headers:{'Idempotency-Key':sbApi.idempotencyKey()},signal:request.signal});message('索引建立完成','status-ready')}catch(error){message(sbApi.safeError(error)+' 可重试。','warn')}finally{indexBtn.disabled=false}};
form.onsubmit=async event=>{event.preventDefault();const question=questionInput.value.trim(),materialIds=ids();if(!question)return;if(!materialIds.length){message('请先选择至少一个材料后再提问。','warn');return}submitBtn.disabled=true;message('正在提交问题...');try{const result=await sbSubmit.once('qa-ask',()=>sbApi.json('/api/qa/ask',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':sbApi.idempotencyKey()},body:JSON.stringify({question,material_ids:materialIds,retrieval_mode:modeSelect.value,allow_retrieval_fallback:true,top_k:5}),signal:request.signal}));if(result.answer_text||result.answer){message('回答已生成','status-ready');questionInput.value='';await loadThreads()}else message('问答已记录，但回答生成失败或超时','warn')}catch(error){message(sbApi.safeError(error)+' 可重试。','warn')}finally{submitBtn.disabled=false}};
function renderThread(thread){const item=document.createElement('article');item.className='thread-item';const meta=document.createElement('div');meta.className='thread-meta';meta.textContent='线程 '+(thread.id||thread.thread_id||'未知')+' · '+(thread.updated_at?new Date(thread.updated_at).toLocaleString('zh-CN'):'时间未知');item.append(meta);if(thread.title){const heading=document.createElement('h3');heading.textContent=thread.title;item.append(heading)}const open=document.createElement('button');open.type='button';open.className='btn';open.textContent='查看对话与引用';open.onclick=()=>loadThread(thread.id||thread.thread_id,item);item.append(open);return item}
function renderMessages(data,target){target.replaceChildren();const messages=Array.isArray(data.messages)?data.messages:[];if(!messages.length){target.textContent='此对话暂无消息。';return}messages.forEach(messageItem=>{const row=document.createElement('div');row.className=messageItem.role==='user'?'thread-question':'thread-answer';row.textContent=messageItem.content||'';target.append(row);if(Array.isArray(messageItem.citations)&&messageItem.citations.length){const cite=document.createElement('div');cite.className='citations';const label=document.createElement('span');label.className='muted';label.textContent='引用来源：';cite.append(label);messageItem.citations.forEach((citation,index)=>cite.append(citationLink(citation,index)));target.append(cite)}})}
async function loadThread(id,item){const detail=item.querySelector('.thread-detail')||document.createElement('div');detail.className='thread-detail';detail.textContent='正在加载对话…';if(!detail.parentNode)item.append(detail);try{const data=await sbApi.json('/api/qa/threads/'+encodeURIComponent(id),{signal:request.signal});renderMessages(data,detail)}catch(error){detail.textContent=sbApi.safeError(error)}}
async function loadThreads(){const generation=++threadGeneration;threadStatus.hidden=false;threadStatus.className='notice';threadStatus.textContent='正在加载线程...';threads.replaceChildren();try{const data=await sbApi.json('/api/qa/threads',{signal:request.signal}),list=Array.isArray(data)?data:data.items||[];if(generation!==threadGeneration)return;if(!list.length){threadStatus.textContent='暂无问答历史';return}threadStatus.hidden=true;list.forEach(thread=>threads.append(renderThread(thread)))}catch(error){if(generation!==threadGeneration)return;threadStatus.className='notice warn';threadStatus.textContent=sbApi.safeError(error)}}
loadMaterials();loadThreads();checkCapabilities()})();</script></body></html>
