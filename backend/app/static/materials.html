<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 资料</title><link rel="stylesheet" href="/app/css/app.css"></head><body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">资料库 · 已验证 API</p><h1>你的学习材料</h1><p class="lead">搜索、查看索引状态，并进入材料详情或问答。</p></div><button class="btn btn-primary hero-action" id="refresh" type="button">刷新列表</button></div><section class="card" data-od-id="materials-list"><div class="section-label"><h2>材料</h2><span id="state" class="muted" role="status" aria-live="polite">加载中…</span></div><div id="error" class="error" role="alert" hidden></div><ul id="items" class="list"></ul></section><p class="footer-note">导入、回收站和完整管理行为暂由 <a href="/">原工作区</a> 提供；正式拆屏将在回归通过后逐页切换。</p></main></div><script src="/app/js/api.js"></script><script src="/app/js/shell.js"></script><script>(function(){const items=document.querySelector('#items'),state=document.querySelector('#state'),error=document.querySelector('#error'),refresh=document.querySelector('#refresh');function text(value){return typeof value==='string'?value:''}async function load(){refresh.disabled=true;state.textContent='加载中…';error.hidden=true;try{const data=await sbApi.json('/api/materials');const rows=Array.isArray(data)?data:Array.isArray(data.items)?data.items:[];items.replaceChildren();if(!rows.length){state.textContent='暂无材料';items.innerHTML='<li class="empty">还没有材料。请从原工作区导入第一份资料。</li>';return}state.textContent=rows.length+' 份材料';rows.forEach(row=>{const id=text(row.id||row.material_id);const name=text(row.original_name||row.display_name||row.name)||'未命名材料';const li=document.createElement('li');const link=document.createElement('a');link.href='/app/material-detail.html?material='+encodeURIComponent(id);link.textContent=name;li.append(link);const badge=document.createElement('span');badge.className='badge';badge.textContent=text(row.status)||'可查看';li.append(badge);items.append(li)})}catch(e){state.textContent='加载失败';error.textContent=sbApi.safeError(e);error.hidden=false}finally{refresh.disabled=false}}refresh.addEventListener('click',load);load()})();</script></body></html>
