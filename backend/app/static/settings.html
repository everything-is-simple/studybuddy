<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 设置</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/today.html">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">系统设置</p><h1>运行状态</h1><p class="lead">查看 Provider、系统就绪状态和任务入口。</p></div></div><section class="card"><div id="settings-status" class="notice" role="status" aria-live="polite">正在加载设置…</div><div id="settings-content"></div><a class="btn mt-16" href="/app/settings-provider.html">Provider 状态</a><a class="btn mt-16" href="/app/tasks.html">任务状态</a></section></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){const request=sbApi.setPageScope('settings'),status=document.querySelector('#settings-status'),content=document.querySelector('#settings-content');async function load(){const results=await Promise.allSettled([sbApi.json('/api/ai/capabilities',{signal:request.signal}),sbApi.json('/api/readiness',{signal:request.signal})]);status.textContent='设置状态已加载';status.hidden=true;content.replaceChildren();const provider=document.createElement('p');const capabilities=results[0].status==='fulfilled'?results[0].value:null;provider.textContent='Provider：'+(capabilities?.provider_id||capabilities?.provider||'未配置');content.append(provider);const ready=document.createElement('p');const readiness=results[1].status==='fulfilled'?results[1].value:null;ready.textContent='系统：'+(readiness?.status==='ready'?'就绪':'暂不可用');content.append(ready);if(results.some(result=>result.status==='rejected')){const warning=document.createElement('p');warning.className='notice warn';warning.textContent='部分系统状态暂不可用，可重试';content.append(warning)}}load()})();</script></body></html>
