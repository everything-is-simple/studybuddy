<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 今天</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">今日任务</p>
<h1>你的学习日程</h1>
<p class="lead">查看今日分配的学习任务和进度。</p>
</div>
<div class="stack-actions">
<button id="retry-today" class="btn" type="button" hidden>重新加载</button>
</div>
</div>

<section class="card" data-od-id="today-summary">
<h2>今日概览</h2>
<div id="summary-status" class="notice" role="status" aria-live="polite">正在加载今日概览...</div>
<div id="summary" class="rhythm-summary" hidden></div>
<div id="weekly-status" class="notice mt-16" role="status" aria-live="polite">正在加载近七天趋势…</div><div id="weekly-trend" class="rhythm-summary" hidden></div>
</section>

<section class="card mt-24" data-od-id="today-tasks">
<h2>今日任务</h2>
<div id="task-status" class="notice" role="status" aria-live="polite">正在加载任务列表...</div>
<ul id="tasks" class="task-list"></ul>
</section>
</main>
</div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(async function(){
const pageRequest=sbApi.setPageScope('today');
const summaryStatus=document.querySelector('#summary-status');
const summary=document.querySelector('#summary');
const taskStatus=document.querySelector('#task-status');
const weeklyStatus=document.querySelector('#weekly-status');const weeklyTrend=document.querySelector('#weekly-trend');
const tasks=document.querySelector('#tasks');
const retry=document.querySelector('#retry-today');
let loadGeneration=0;
let activePlanRequest=null;

function text(value){return typeof value==='string'?value:''}

// Keep each notice's layout classes when swapping loading/empty/failed state.
function notice(element,extra){element.hidden=false;element.className=(element.dataset.baseClass||'notice')+(extra?' '+extra:'')}
function pending(element,message){notice(element,'status-loading');element.textContent=message}
function settled(element,message){notice(element,'');element.textContent=message}
function fail(element,error){notice(element,'warn');element.textContent=sbApi.safeError(error);retry.hidden=false}
[summaryStatus,weeklyStatus,taskStatus].forEach(el=>{el.dataset.baseClass=el.className});

// One shared active-plan lookup per load: the three sections used to fetch
// /api/study/plans separately, which tripled the request on every retry.
function activePlan(signal){
if(!activePlanRequest)activePlanRequest=sbApi.json('/api/study/plans',{signal}).then(data=>{
const plans=Array.isArray(data)?data:data.items||[];
return plans.find(item=>item.status==='active')||null
});
return activePlanRequest
}

async function loadSummary(generation){
try{
const plan=await activePlan(pageRequest.signal);
if(generation!==loadGeneration)return;
if(plan){
const data=await sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm/summary`,{signal:pageRequest.signal});
if(generation!==loadGeneration)return;
summaryStatus.hidden=true;
summary.hidden=false;
const cards=[
{label:'当前计划',value:text(plan.title)||'未命名计划'},
{label:'已完成',value:data.item_projection?.completed_count||plan.progress?.completed_count||0},
{label:'待处理',value:data.item_projection?.pending_count||plan.progress?.pending_count||0},
{label:'来源提醒',value:data.source_warning_count||plan.progress?.source_warning_count||0}
];
summary.replaceChildren();
cards.forEach(card=>{
const div=document.createElement('div');
div.className='rhythm-card';
const value=document.createElement('div');
value.className='rhythm-value';
value.textContent=card.value;
const label=document.createElement('div');
label.className='rhythm-label';
label.textContent=card.label;
div.append(value,label);
summary.append(div)
})
}else{
settled(summaryStatus,'暂无节奏数据')
}
}catch(e){
if(generation!==loadGeneration)return;
fail(summaryStatus,e)
}
}

async function loadWeeklyTrend(generation){try{const plan=await activePlan(pageRequest.signal);if(generation!==loadGeneration)return;if(!plan){settled(weeklyStatus,'暂无周趋势数据');return}const data=await sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm/weekly-trend`,{signal:pageRequest.signal});if(generation!==loadGeneration)return;weeklyStatus.hidden=true;weeklyTrend.hidden=false;weeklyTrend.replaceChildren();data.days.forEach(day=>{const card=document.createElement('div');card.className='rhythm-card';const value=document.createElement('div');value.className='rhythm-value';value.textContent=String(day.completed_count||0);const label=document.createElement('div');label.className='rhythm-label';label.textContent=`${day.local_date} · 完成`;card.append(value,label);weeklyTrend.append(card)})}catch(e){if(generation!==loadGeneration)return;fail(weeklyStatus,e)}}

async function loadTasks(generation){
try{
const plan=await activePlan(pageRequest.signal);
if(generation!==loadGeneration)return;
if(!plan){settled(taskStatus,'今日暂无任务');return}
const [rhythm,detail]=await Promise.all([
 sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm`,{signal:pageRequest.signal}),
 sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}`,{signal:pageRequest.signal})
]);
const localDate=new Intl.DateTimeFormat('en-CA',{timeZone:rhythm.settings?.timezone||'UTC',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const allocations=await sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm/allocations`,{signal:pageRequest.signal});
const allocationByItem=new Map(allocations.filter(item=>item.local_date===localDate).map(item=>[item.item_id,item]));
const items=(detail.items||[]).filter(item=>item.status!=='archived'&&allocationByItem.has(item.id));
if(!items.length){
settled(taskStatus,'今日暂无任务');
return
}
taskStatus.hidden=true;
items.forEach(item=>{
const allocation=allocationByItem.get(item.id);
const li=document.createElement('li');
li.className='task-item'+(item.status==='completed'?' completed':'');
li.dataset.itemId=item.id;
li.dataset.localDate=localDate;
const meta=document.createElement('div');
meta.className='task-meta';
const title=document.createElement('div');
title.className='task-title';
title.textContent=text(item.title||item.item_title||'未命名任务');
meta.append(title);
const source=document.createElement('div');
source.className='task-source';
const sourceStatus=sbState.sourceForItem(item,plan.source_links);
source.textContent=`来源状态: ${sbState.source(sourceStatus)}`;
meta.append(source);
li.append(meta);
const materialId=sbState.materialForItem(item,plan.source_links);
const action=document.createElement('a');
action.className='btn';
action.href=materialId?`/app/material-detail.html?material=${encodeURIComponent(materialId)}`:'#';
action.textContent='查看资料';
if(!materialId||sourceStatus!=='valid'){action.setAttribute('aria-disabled','true');action.style.pointerEvents='none';}
const progress=document.createElement('a');
progress.className='btn btn-primary';
progress.href=`/app/plan-detail.html?plan_id=${encodeURIComponent(plan.id)}&item_id=${encodeURIComponent(item.id)}&local_date=${encodeURIComponent(localDate)}&return_to=today`;
progress.textContent=item.status==='completed'?'查看进度':'开始学习';
const minutes=document.createElement('div');minutes.className='task-source';minutes.textContent=`计划 ${allocation.planned_minutes} 分钟 · ${localDate}`;
meta.append(minutes);
li.append(action,progress);
tasks.append(li)
})
}catch(e){
if(generation!==loadGeneration)return;
fail(taskStatus,e)
}
}

function resetSections(){
retry.hidden=true;
activePlanRequest=null;
tasks.replaceChildren();
summary.hidden=true;
weeklyTrend.hidden=true;
pending(summaryStatus,'正在加载今日概览...');
pending(weeklyStatus,'正在加载近七天趋势…');
pending(taskStatus,'正在加载任务列表...')
}

async function loadAll(){
const generation=++loadGeneration;
resetSections();
sbUi.busy(retry,true,'重新加载');
try{
await Promise.all([loadSummary(generation),loadWeeklyTrend(generation),loadTasks(generation)])
}finally{
sbUi.busy(retry,false,'重新加载')
}
}

retry.addEventListener('click',()=>sbSubmit.once('today-reload',loadAll));
await loadAll()
})();
</script>
</body>
</html>
