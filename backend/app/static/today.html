<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 今天</title>
<link rel="stylesheet" href="/app/css/app.css">
<style>
.task-list{list-style:none;padding:0;margin:0}
.task-item{padding:16px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.task-item.completed{opacity:0.6;background:var(--bg-muted)}
.task-meta{flex:1}
.task-title{font-weight:600;margin-bottom:4px}
.task-source{color:var(--muted);font-size:14px}
.task-status{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600}
.task-status.valid{background:var(--success-bg);color:var(--success)}
.task-status.stale{background:var(--warn-bg);color:var(--warn)}
.task-status.unavailable{background:var(--error-bg);color:var(--error)}
.rhythm-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.rhythm-card{padding:16px;border:1px solid var(--border);border-radius:8px;text-align:center}
.rhythm-value{font-size:32px;font-weight:700;color:var(--accent);margin-bottom:4px}
.rhythm-label{color:var(--muted);font-size:14px}
@media(max-width:640px){
.task-item{flex-direction:column;align-items:flex-start}
.rhythm-summary{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">今日任务</p>
<h1>你的学习日程</h1>
<p class="lead">查看今日分配的学习任务和进度。</p>
</div>
</div>

<section class="card" data-od-id="today-summary">
<h2>今日概览</h2>
<div id="summary-status" class="notice" role="status" aria-live="polite">正在加载今日概览...</div>
<div id="summary" class="rhythm-summary" hidden></div>
</section>

<section class="card" data-od-id="today-tasks" style="margin-top:24px">
<h2>今日任务</h2>
<div id="task-status" class="notice" role="status" aria-live="polite">正在加载任务列表...</div>
<ul id="tasks" class="task-list"></ul>
</section>
</main>
</div>
<script src="/app/js/api.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(async function(){
const summaryStatus=document.querySelector('#summary-status');
const summary=document.querySelector('#summary');
const taskStatus=document.querySelector('#task-status');
const tasks=document.querySelector('#tasks');

function text(value){return typeof value==='string'?value:''}

async function loadSummary(){
try{
const data=await sbApi.json('/api/learning/rhythm/summary');
if(data.total_items!==undefined){
summaryStatus.hidden=true;
summary.hidden=false;
const cards=[
{label:'今日任务',value:data.today_count||0},
{label:'已完成',value:data.completed_count||0},
{label:'待处理',value:data.pending_count||0},
{label:'本周进度',value:Math.round((data.weekly_progress||0)*100)+'%'}
];
summary.replaceChildren();
cards.forEach(card=>{
const div=document.createElement('div');
div.className='rhythm-card';
const value=document.createElement('div');
value.className='rhythm-value';
value.textContent=card.value;
const label=document.createElement('div');
label.className='rhythm-label';
label.textContent=card.label;
div.append(value,label);
summary.append(div)
})
}else{
summaryStatus.textContent='暂无节奏数据';
summaryStatus.className='notice'
}
}catch(e){
summaryStatus.className='notice warn';
summaryStatus.textContent=sbApi.safeError(e)
}
}

async function loadTasks(){
try{
const data=await sbApi.json('/api/learning/rhythm/timeline');
const items=Array.isArray(data)?data:data.items||[];
if(!items.length){
taskStatus.textContent='今日暂无任务';
taskStatus.className='notice';
return
}
taskStatus.hidden=true;
items.forEach(item=>{
const li=document.createElement('li');
li.className='task-item'+(item.status==='completed'?' completed':'');
const meta=document.createElement('div');
meta.className='task-meta';
const title=document.createElement('div');
title.className='task-title';
title.textContent=text(item.title||item.item_title||'未命名任务');
meta.append(title);
const source=document.createElement('div');
source.className='task-source';
const sourceStatus=text(item.source_status||'valid');
source.innerHTML=`来源: ${text(item.material_name||'未知材料')} · <span class="task-status ${sourceStatus}">${sourceStatus}</span>`;
meta.append(source);
li.append(meta);
const action=document.createElement('a');
action.className='btn';
action.href=item.material_id?`/app/material-detail.html?material=${encodeURIComponent(item.material_id)}`:'#';
action.textContent=item.status==='completed'?'查看':'开始';
if(!item.material_id)action.style.pointerEvents='none';
li.append(action);
tasks.append(li)
})
}catch(e){
taskStatus.className='notice warn';
taskStatus.textContent=sbApi.safeError(e)
}
}

await Promise.all([loadSummary(),loadTasks()])
})();
</script>
</body>
</html>
