<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 今天</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
<style>
#continue-btn{display:inline-flex;align-items:center;min-height:56px;padding:12px 24px;font-size:20px;font-weight:700}
#today-progress-visual{margin-top:16px}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<h1>今天学什么？</h1>
</div>
<div class="stack-actions">
<a class="btn" href="/app/plans.html">管理计划</a>
<button id="retry-today" class="btn" type="button" hidden title="[1] 重新加载 - 刷新今日学习页面">重新加载</button>
</div>
</div>

<div id="page-loading" class="notice" role="status" aria-live="polite">正在加载今天的学习任务...</div>
<section id="quick-start" class="card" data-od-id="today-quick-start" hidden aria-labelledby="quick-start-heading">
<h2 id="quick-start-heading"><button id="quick-toggle" class="btn" type="button" aria-expanded="true" aria-controls="quick-start-body">继续学习</button></h2>
<div id="quick-start-body">
<p id="quick-start-title" class="item-title"></p>
<p id="quick-start-time" class="muted"></p>
<div id="quick-error" class="notice warn" role="alert" hidden></div>
<div class="stack-actions"><button id="continue-btn" class="btn btn-primary" type="button" data-od-id="today-continue-learning" data-control="today-progress">开始学习</button><a id="quick-detail" class="btn" href="#">查看计划详情</a></div>
</div>
</section>
<section class="card" data-od-id="today-summary">
<h2>今日概览</h2>
<div id="summary-status" class="notice" role="status" aria-live="polite" hidden></div>
<div id="summary" class="rhythm-summary" hidden></div><div id="today-onboarding" class="notice muted" hidden><strong>开始学习只需三步</strong><ol><li><a href="/app/materials.html">导入教材</a>：先导入五年级上册当前课程。</li><li><a href="/app/plans.html">建立学习计划</a>：安排当前学习、预习和复习内容。</li><li><a href="/app/practice.html">开始练习</a>：完成今天的任务并查看进度。</li></ol></div>
<div id="weekly-status" class="notice mt-16" role="status" aria-live="polite" hidden></div><div id="weekly-trend" class="rhythm-summary" hidden></div>
<section id="today-progress-visual" class="today-progress-visual" hidden aria-labelledby="today-progress-title">
<h2 id="today-progress-title">学习进度</h2>
<div class="rhythm-summary">
<div class="rhythm-card"><div id="today-streak" class="rhythm-value">0</div><div class="rhythm-label">连续学习天数</div></div>
<div class="rhythm-card"><div id="today-week-days" class="rhythm-value">0/7</div><div class="rhythm-label">本周已学</div></div>
<div class="rhythm-card"><div id="today-week-rate" class="rhythm-value">0%</div><div class="rhythm-label">本周完成率</div></div>
</div>
<div id="today-week-progress-track" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="本周学习进度"><div id="today-week-progress" class="progress-fill"></div></div>
</section>
</section>

<section class="card mt-24" data-od-id="today-tasks">
<h2>今天的学习</h2>
<div id="task-status" class="notice" role="status" aria-live="polite" hidden></div>
<ul id="tasks" class="task-list"></ul>
<div id="today-exits" class="stack-actions" hidden></div>
</section>
</main>
</div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script><script src="/app/js/templates.js"></script>
<script>
(async function(){
const pageRequest=sbApi.setPageScope('today');
const pageLoading=document.querySelector('#page-loading');
const summaryStatus=document.querySelector('#summary-status');
const onboarding=document.querySelector('#today-onboarding');
const summary=document.querySelector('#summary');
const taskStatus=document.querySelector('#task-status');
const quickStart=document.querySelector('#quick-start');
const quickStartTitle=document.querySelector('#quick-start-title');
const quickStartTime=document.querySelector('#quick-start-time');
const continueButton=document.querySelector('#continue-btn');
const quickDetail=document.querySelector('#quick-detail');
const quickError=document.querySelector('#quick-error');
const quickToggle=document.querySelector('#quick-toggle');
const quickBody=document.querySelector('#quick-start-body');
const weeklyStatus=document.querySelector('#weekly-status');const weeklyTrend=document.querySelector('#weekly-trend');
const todayProgress=document.querySelector('#today-progress-visual');const todayStreak=document.querySelector('#today-streak');const todayWeekDays=document.querySelector('#today-week-days');const todayWeekRate=document.querySelector('#today-week-rate');const todayWeekProgress=document.querySelector('#today-week-progress');const todayWeekProgressTrack=document.querySelector('#today-week-progress-track');
const tasks=document.querySelector('#tasks');
const exits=document.querySelector('#today-exits');
const retry=document.querySelector('#retry-today');
let loadGeneration=0;
let activePlanRequest=null;
const progressBusy=new Set();

function text(value){return typeof value==='string'?value:''}

function pending(element,message){sbTemplates.setState(element,'loading',{message})}
function settled(element,message){sbTemplates.setState(element,'empty',{message})}
function fail(element,error){sbTemplates.setState(element,'failed',{error});sbUi.errorAction(element,error,{retry:loadAll});retry.hidden=false}
quickToggle.addEventListener('click',()=>{quickBody.hidden=!quickBody.hidden;quickToggle.setAttribute('aria-expanded',String(!quickBody.hidden))});

async function submitProgress(planId,itemId,localDate,eventType){
const key=`today-progress-${planId}-${itemId}`;
if(progressBusy.has(key))return;
progressBusy.add(key);
const buttons=[...document.querySelectorAll(`[data-progress-item="${CSS.escape(itemId)}"]`)];
buttons.forEach(button=>sbUi.busy(button,true,button.textContent));
quickError.hidden=true;
try{
await sbSubmit.once(key,()=>sbApi.json(`/api/study/plans/${encodeURIComponent(planId)}/items/${encodeURIComponent(itemId)}/progress`,{method:'POST',body:JSON.stringify({event_type:eventType,metadata:{local_date:localDate}}),signal:pageRequest.signal}));
await loadAll();
}catch(error){
sbUi.errorAction(quickError,error,{retry:()=>submitProgress(planId,itemId,localDate,eventType)});
}finally{progressBusy.delete(key);buttons.forEach(button=>{button.disabled=false;if(button.textContent==='处理中…')button.textContent=button.dataset.idleLabel||'开始学习'})}
}
// Empty states offer the next step instead of a dead end; links live outside the
// notice so swapping notice classes never drops them.
function showExits(links){exits.replaceChildren();links.forEach(entry=>{const link=document.createElement('a');link.className='btn';link.href=entry.href;link.textContent=entry.label;exits.append(link)});exits.hidden=!links.length}
function progressMetrics(days){const rows=Array.isArray(days)?days:[];const learned=rows.filter(day=>Number(day.completed_count||0)>0).length;const ordered=rows.slice().sort((a,b)=>String(a.local_date||'').localeCompare(String(b.local_date||'')));if(ordered.length&&Number(ordered[ordered.length-1].completed_count||0)<=0)ordered.pop();let streak=0;for(let index=ordered.length-1;index>=0&&Number(ordered[index].completed_count||0)>0;index-=1)streak+=1;return {learned,streak,rate:Math.round(Math.min(learned/7*100,100))}}
[summaryStatus,weeklyStatus,taskStatus].forEach(el=>{el.dataset.baseClass=el.className});

// One shared active-plan lookup per load: the three sections used to fetch
// /api/study/plans separately, which tripled the request on every retry.
function activePlan(signal){
if(!activePlanRequest)activePlanRequest=sbApi.json('/api/study/plans',{signal}).then(data=>{
const plans=Array.isArray(data)?data:data.items||[];
return {plans,plan:plans.find(item=>item.status==='active')||null}
});
return activePlanRequest
}

async function loadSummary(generation){
try{
const context=await activePlan(pageRequest.signal);const plan=context.plan;
if(generation!==loadGeneration)return;
if(plan){
const data=await sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm/summary`,{signal:pageRequest.signal});
if(generation!==loadGeneration)return;
summaryStatus.hidden=true;
summary.hidden=false;
const cards=[
{label:'当前计划',value:text(plan.title)||'未命名计划'},
{label:'已完成',value:data.item_projection?.completed_count||plan.progress?.completed_count||0},
{label:'待处理',value:data.item_projection?.pending_count||plan.progress?.pending_count||0},
{label:'来源提醒',value:data.source_warning_count||plan.progress?.source_warning_count||0}
];
summary.replaceChildren();
cards.forEach(card=>{
const div=document.createElement('div');
div.className='rhythm-card';
const value=document.createElement('div');
value.className='rhythm-value';
value.textContent=card.value;
const label=document.createElement('div');
label.className='rhythm-label';
label.textContent=card.label;
div.append(value,label);
summary.append(div)
})
}else{
const noPlan=!context.plans.length;settled(summaryStatus,noPlan?'还没有学习计划':'计划尚未启动');onboarding.hidden=!noPlan
}
}catch(e){
if(generation!==loadGeneration)return;
fail(summaryStatus,e)
}
}

async function loadWeeklyTrend(generation){try{const context=await activePlan(pageRequest.signal);const plan=context.plan;if(generation!==loadGeneration)return;if(!plan){todayProgress.hidden=true;settled(weeklyStatus,context.plans.length?'计划尚未启动，暂无周趋势':'还没有学习计划，暂无周趋势');return}const data=await sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm/weekly-trend`,{signal:pageRequest.signal});if(generation!==loadGeneration)return;const metrics=progressMetrics(data.days);todayStreak.textContent=String(metrics.streak);todayWeekDays.textContent=`${metrics.learned}/7`;todayWeekRate.textContent=`${metrics.rate}%`;todayWeekProgress.style.width=`${Math.min(metrics.learned/7*100,100)}%`;todayWeekProgress.setAttribute('aria-valuenow',String(metrics.rate));todayWeekProgressTrack.setAttribute('aria-label',`本周已学 ${metrics.learned}/7 天，完成率 ${metrics.rate}%`);todayProgress.hidden=false;weeklyStatus.hidden=true;weeklyTrend.hidden=false;weeklyTrend.replaceChildren();(Array.isArray(data.days)?data.days:[]).forEach(day=>{const card=document.createElement('div');card.className='rhythm-card';const value=document.createElement('div');value.className='rhythm-value';value.textContent=String(day.completed_count||0);const label=document.createElement('div');label.className='rhythm-label';label.textContent=`${day.local_date} · 完成`;card.append(value,label);weeklyTrend.append(card)})}catch(e){if(generation!==loadGeneration)return;todayProgress.hidden=true;fail(weeklyStatus,e)}}

async function loadTasks(generation){
try{
const context=await activePlan(pageRequest.signal);const plan=context.plan;
if(generation!==loadGeneration)return;
if(!plan){if(context.plans.length){const candidate=context.plans[0];settled(taskStatus,'计划尚未启动');showExits([{href:`/app/plans.html?plan_id=${encodeURIComponent(candidate.id)}`,label:'前往激活'}])}else{settled(taskStatus,'还没有学习计划');showExits([{href:'/app/plans.html',label:'创建学习计划'}])}return}
const [rhythm,detail]=await Promise.all([
 sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm`,{signal:pageRequest.signal}),
 sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}`,{signal:pageRequest.signal})
]);
const localDate=new Intl.DateTimeFormat('en-CA',{timeZone:rhythm.settings?.timezone||'UTC',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const allocations=await sbApi.json(`/api/study/plans/${encodeURIComponent(plan.id)}/rhythm/allocations`,{signal:pageRequest.signal});
const allocationByItem=new Map(allocations.filter(item=>item.local_date===localDate).map(item=>[item.item_id,item]));
const items=(detail.items||[]).filter(item=>item.status!=='archived'&&allocationByItem.has(item.id));
if(!items.length){
quickStart.hidden=true;
settled(taskStatus,`计划「${text(plan.title)||'未命名计划'}」今日没有安排学习项`);
showExits([
 {href:`/app/plan-detail.html?plan_id=${encodeURIComponent(plan.id)}`,label:'查看计划详情'},
 {href:`/app/plans.html?plan_id=${encodeURIComponent(plan.id)}`,label:'安排今日学习'}
]);
return
}
taskStatus.hidden=true;
const nextItem=items.find(item=>item.status!=='completed')||items[0];
const nextAllocation=allocationByItem.get(nextItem.id);
quickStartTitle.textContent=text(nextItem.title||nextItem.item_title||'未命名任务');
quickStartTime.textContent=`预计 ${nextAllocation.planned_minutes} 分钟`;
quickDetail.href=`/app/plan-detail.html?plan_id=${encodeURIComponent(plan.id)}&item_id=${encodeURIComponent(nextItem.id)}&local_date=${encodeURIComponent(localDate)}&return_to=today`;
continueButton.dataset.progressItem=nextItem.id;
continueButton.textContent=nextItem.status==='completed'?'查看进度':nextItem.status==='in_progress'?'记录完成':'开始学习';
continueButton.onclick=nextItem.status==='completed'?()=>{location.href=quickDetail.href}:()=>submitProgress(plan.id,nextItem.id,localDate,nextItem.status==='in_progress'?'completed':'started');
quickError.hidden=true;
quickStart.hidden=false;
items.forEach(item=>{
const allocation=allocationByItem.get(item.id);
const li=document.createElement('li');
li.className='task-item'+(item.status==='completed'?' completed':'');
li.dataset.itemId=item.id;
li.dataset.localDate=localDate;
const meta=document.createElement('div');
meta.className='task-meta';
const title=document.createElement('div');
title.className='task-title';
title.textContent=text(item.title||item.item_title||'未命名任务');
meta.append(title);
const source=document.createElement('div');
source.className='task-source';
const sourceStatus=sbState.sourceForItem(item,plan.source_links);
source.textContent=`来源：${sbState.sourceDisplay(sourceStatus)}`;
source.title=sbState.displayTitle(sourceStatus);
meta.append(source);
li.append(meta);
const materialId=sbState.materialForItem(item,plan.source_links);
const action=document.createElement('a');
action.className='btn';
action.href=materialId?`/app/material-detail.html?material=${encodeURIComponent(materialId)}`:'#';
action.textContent='查看资料';
if(!materialId||sourceStatus!=='valid'){action.setAttribute('aria-disabled','true');action.style.pointerEvents='none';}
const progress=document.createElement('button');
progress.className='btn btn-primary';
progress.type='button';
progress.dataset.progressItem=item.id;
progress.dataset.control='today-progress';
progress.textContent=item.status==='completed'?'查看进度':item.status==='in_progress'?'记录完成':'开始学习';
progress.onclick=item.status==='completed'?()=>{location.href=`/app/plan-detail.html?plan_id=${encodeURIComponent(plan.id)}&item_id=${encodeURIComponent(item.id)}&return_to=today`}:()=>submitProgress(plan.id,item.id,localDate,item.status==='in_progress'?'completed':'started');
const minutes=document.createElement('div');minutes.className='task-source';minutes.textContent=`计划 ${allocation.planned_minutes} 分钟 · ${localDate}`;
meta.append(minutes);
li.append(action,progress);
tasks.append(li)
})
}catch(e){
if(generation!==loadGeneration)return;
fail(taskStatus,e)
}
}

function resetSections(){
retry.hidden=true;
pageLoading.hidden=false;
todayProgress.hidden=true;
quickStart.hidden=true;
activePlanRequest=null;
tasks.replaceChildren();
exits.hidden=true;
exits.replaceChildren();
summary.hidden=true;
weeklyTrend.hidden=true;
[summaryStatus,weeklyStatus,taskStatus].forEach(el=>{el.hidden=true;el.replaceChildren()})
}

async function loadAll(){
const generation=++loadGeneration;
resetSections();
sbUi.busy(retry,true,'重新加载');
try{
await Promise.all([loadSummary(generation),loadWeeklyTrend(generation),loadTasks(generation)])
}finally{
if(generation===loadGeneration)pageLoading.hidden=true;
sbUi.busy(retry,false,'重新加载')
}
}

retry.addEventListener('click',()=>sbSubmit.once('today-reload',loadAll));
await loadAll()
})();
</script>
</body>
</html>
