<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 练习集</title>
<link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/app/">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div>
</header>
<main class="main">
<div class="hero">
<div>
<p class="eyebrow">练习集</p>
<h1>练习题库</h1>
<p class="lead">查看和管理练习题目，支持选择题、判断题和简答题。</p>
</div>
</div>

<div class="grid">
<section class="card span-4" data-od-id="exercises-sets">
<h2>练习集</h2>
<form id="set-create-form" class="stack"><input id="new-set-title" placeholder="新练习集名称" required><button class="btn btn-primary" type="submit">创建练习集</button></form>
<div id="set-status" class="notice" role="status" aria-live="polite">正在加载练习集...</div>
<ul id="sets" class="set-list"></ul>
<button class="btn" id="refresh-sets" type="button" class="mt-12">刷新列表</button>
</section>

<section class="card span-8" data-od-id="exercises-detail">
<h2 id="set-title">选择练习集</h2>
<div id="set-actions" class="stack" hidden><form id="exercise-create-form" class="stack"><select id="new-exercise-type"><option value="short_answer">简答题</option><option value="multiple_choice">选择题</option><option value="true_false">判断题</option></select><input id="new-exercise-prompt" placeholder="题目" required><input id="new-exercise-answer" placeholder="答案" required><button class="btn" type="button">创建题目</button></form><form id="exercise-generate-form" class="stack"><input id="exercise-topic" placeholder="AI 草稿主题" required><input id="exercise-material-ids" placeholder="材料 ID（逗号分隔）" required><button class="btn" type="submit">生成题目草稿</button></form></div>
<div id="exercise-status" class="notice" role="status" aria-live="polite" hidden></div>
<div id="exercise-detail" class="stack"></div>
<ul id="exercises" class="exercise-list" hidden></ul>
</section>
</div>
</main>
</div>
<script src="/app/js/api.js"></script><script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(function(){
const pageRequest=sbApi.setPageScope('exercises');
const setStatus=document.querySelector('#set-status');
const sets=document.querySelector('#sets');
const refreshSets=document.querySelector('#refresh-sets');
const setTitle=document.querySelector('#set-title');
const exerciseStatus=document.querySelector('#exercise-status');
const exerciseDetail=document.querySelector('#exercise-detail');
const exercises=document.querySelector('#exercises'),setActions=document.querySelector('#set-actions');let busy=false;function setBusy(value){busy=value;document.querySelectorAll('button,input,textarea,select').forEach(node=>node.disabled=value)}function message(error){return ({provider_not_configured:'AI 服务尚未配置',retrieval_not_ready:'材料尚未建立索引',retrieval_empty:'未找到相关材料',citation_invalid:'引用来源不可用',exercise_edit_not_allowed:'该题目不可编辑',exercise_not_ready:'题目尚未就绪'})[error.code]||'练习操作失败，可重试'}async function mutate(action,success){if(busy)return;setBusy(true);try{await action();await loadSets();if(selectedSetId)await selectSet(selectedSetId,setTitle.textContent);if(selectedExerciseId)await viewExercise(selectedExerciseId);exerciseStatus.hidden=false;exerciseStatus.className='notice';exerciseStatus.textContent=success}catch(error){exerciseStatus.hidden=false;exerciseStatus.className='notice warn';exerciseStatus.textContent=message(error)}finally{setBusy(false)}}

let selectedSetId=null;
let selectedExerciseId=null;
let setGeneration=0;
let exerciseGeneration=0;

function text(value){return typeof value==='string'?value:''}function button(label,handler){const node=document.createElement('button');node.className='btn';node.type='button';node.textContent=label;node.onclick=handler;return node}

const typeLabels={
multiple_choice:'选择题',
true_false:'判断题',
short_answer:'简答题'
};

async function loadSets(){
setStatus.textContent='正在加载练习集...';
setStatus.className='notice';
sets.replaceChildren();
try{
const run=++setGeneration;
const data=await sbApi.json('/api/study/exercise-sets',{signal:pageRequest.signal});
if(run!==setGeneration)return;
const items=Array.isArray(data)?data:data.items||[];
if(!items.length){
setStatus.textContent='暂无练习集';
return
}
setStatus.hidden=true;
items.forEach(set=>{
const li=document.createElement('li');
li.className='set-item';
if(set.id===selectedSetId)li.classList.add('selected');
const title=document.createElement('div');
title.className='item-title';
title.textContent=text(set.title)||'未命名练习集';
li.append(title);
const meta=document.createElement('div');
meta.className='muted';
meta.classList.add('item-meta');
meta.textContent=`${set.exercise_count||0} 道题`;
li.append(meta);
const badge=document.createElement('span');
badge.className='status-badge '+(set.status||'draft');
badge.textContent=sbState.label(set.status||'draft');
badge.classList.add('badge-spaced');
li.append(badge);
li.onclick=()=>selectSet(set.id,set.title);
sets.append(li)
})
}catch(e){
setStatus.className='notice warn';
setStatus.textContent=sbApi.safeError(e)
}
}

async function selectSet(setId,title){
selectedSetId=setId;
setTitle.textContent=text(title)||'练习详情';
exerciseStatus.hidden=false;
exerciseStatus.textContent='正在加载练习...';
exerciseStatus.className='notice';
exerciseDetail.replaceChildren();
setActions.hidden=false;
exercises.replaceChildren();
exercises.hidden=true;
document.querySelectorAll('.set-item').forEach(el=>{
el.classList.toggle('selected',el.onclick.toString().includes(setId))
});
try{
const run=++exerciseGeneration;
const data=await sbApi.json(`/api/study/exercises?set_id=${encodeURIComponent(setId)}`,{signal:pageRequest.signal});
if(run!==exerciseGeneration)return;
const items=Array.isArray(data)?data:data.items||[];
if(!items.length){
exerciseStatus.textContent='该练习集暂无题目';
return
}
exerciseStatus.hidden=true;
exercises.hidden=false;
items.forEach(exercise=>{
const li=document.createElement('li');
li.className='exercise-item';
const meta=document.createElement('div');
meta.className='exercise-meta';
const info=document.createElement('div');
const prompt=document.createElement('div');
prompt.className='item-title';
prompt.textContent=text(exercise.prompt)||'题目';
info.append(prompt);
const type=document.createElement('span');
type.className='exercise-type';
type.textContent=typeLabels[exercise.exercise_type]||exercise.exercise_type;
type.className='exercise-type item-description';
info.append(type);
meta.append(info);
const badge=document.createElement('span');
badge.className='status-badge '+(exercise.status||'draft');
badge.textContent=sbState.label(exercise.status||'draft');
meta.append(badge);
li.append(meta);
if(exercise.source_status&&exercise.source_status!=='valid'){
const source=document.createElement('div');
source.className='source-link '+(exercise.source_status||'');
source.textContent='来源: '+sbState.source(exercise.source_status);
li.append(source)
}
li.onclick=()=>viewExercise(exercise.id);
exercises.append(li)
})
}catch(e){
exerciseStatus.className='notice warn';
exerciseStatus.textContent=sbApi.safeError(e)
}
}

async function editExercise(exercise){const form=document.createElement('form');form.className='stack';const prompt=document.createElement('input');prompt.value=text(exercise.prompt);prompt.setAttribute('aria-label','题目内容');const explanation=document.createElement('textarea');explanation.value=text(exercise.explanation);explanation.setAttribute('aria-label','题目解析');const save=document.createElement('button');save.className='btn';save.type='submit';save.textContent='保存题目';form.append(prompt,explanation,save);form.onsubmit=event=>{event.preventDefault();mutate(()=>sbApi.json('/api/study/exercises/'+encodeURIComponent(exercise.id),{method:'PATCH',body:JSON.stringify({prompt:prompt.value,options:exercise.options||[],explanation:explanation.value,citations:exercise.citations||[]}),signal:pageRequest.signal}),'题目已保存')};return form}
async function viewExercise(exerciseId){
selectedExerciseId=exerciseId;
exerciseDetail.replaceChildren();
exerciseStatus.hidden=false;
exerciseStatus.textContent='正在加载题目详情...';
exerciseStatus.className='notice';
try{
const exercise=await sbApi.json(`/api/study/exercises/${encodeURIComponent(exerciseId)}`,{signal:pageRequest.signal});
exerciseStatus.hidden=true;
const container=document.createElement('div');
const prompt=document.createElement('div');
prompt.innerHTML='<strong>题目：</strong>';
const promptText=document.createElement('span');
promptText.textContent=text(exercise.prompt);
prompt.append(promptText);
container.append(prompt);
const type=document.createElement('div');
type.className='mt-8';
type.innerHTML='<strong>类型：</strong>';
const typeText=document.createElement('span');
typeText.textContent=typeLabels[exercise.exercise_type]||exercise.exercise_type;
type.append(typeText);
container.append(type);
if(exercise.exercise_type==='multiple_choice'&&exercise.options){
const options=document.createElement('div');
options.className='mt-8';
options.innerHTML='<strong>选项：</strong>';
const ol=document.createElement('ol');
exercise.options.forEach(opt=>{
const li=document.createElement('li');
li.textContent=text(opt);
ol.append(li)
});
options.append(ol);
container.append(options)
}
const status=document.createElement('div');
status.className='mt-8';
status.innerHTML='<strong>状态：</strong>';
const statusBadge=document.createElement('span');
statusBadge.className='status-badge '+(exercise.status||'draft');
statusBadge.textContent=sbState.label(exercise.status||'draft');
status.append(statusBadge);
container.append(status);
if(exercise.citation_keys&&exercise.citation_keys.length){
const citations=document.createElement('div');
citations.className='mt-12';
citations.innerHTML='<strong>引用来源：</strong>';
exercise.citation_keys.forEach(key=>{
const link=document.createElement('a');
link.href='#';
link.textContent=key;
link.className='citation-link';
link.onclick=e=>{e.preventDefault();alert('Citation: '+key)};
citations.append(link)
});
container.append(citations)
}
if(exercise.status==='draft'){
const actions=document.createElement('div');
actions.className='mt-16';
const confirmBtn=document.createElement('button');
confirmBtn.className='btn btn-primary';
confirmBtn.textContent='确认题目';
confirmBtn.onclick=()=>confirmExercise(exerciseId);
actions.append(confirmBtn);
container.append(actions)
}
if(exercise.status==='draft'){container.append(await editExercise(exercise),button('确认题目',()=>mutate(()=>sbApi.json('/api/study/exercises/'+encodeURIComponent(exercise.id)+'/confirm',{method:'POST',signal:pageRequest.signal}),'题目已确认')),button('拒绝题目',()=>mutate(()=>sbApi.json('/api/study/exercises/'+encodeURIComponent(exercise.id)+'/reject',{method:'POST',signal:pageRequest.signal}),'题目已拒绝')))}if(exercise.status!=='archived')container.append(button('归档题目',()=>mutate(()=>sbApi.json('/api/study/exercises/'+encodeURIComponent(exercise.id)+'/archive',{method:'POST',signal:pageRequest.signal}),'题目已归档')));if(exercise.status==='ready')container.append(button('开始作答',()=>{location.href='/app/practice.html?exercise_id='+encodeURIComponent(exercise.id)}));exerciseDetail.append(container)
}catch(e){
exerciseStatus.className='notice warn';
exerciseStatus.textContent=sbApi.safeError(e)
}
}

async function confirmExercise(exerciseId){
if(!confirm('确认此题目？确认后不可编辑。'))return;
try{
await sbApi.json(`/api/study/exercises/${encodeURIComponent(exerciseId)}/confirm`,{method:'POST'});
alert('题目已确认');
viewExercise(exerciseId)
}catch(e){
alert(sbApi.safeError(e))
}
}

document.querySelector('#set-create-form button').onclick=()=>mutate(()=>sbApi.json('/api/study/exercise-sets',{method:'POST',body:JSON.stringify({title:document.querySelector('#new-set-title').value}),signal:pageRequest.signal}),'练习集已创建');document.querySelector('#exercise-create-form button').onclick=()=>{const type=document.querySelector('#new-exercise-type').value,raw=document.querySelector('#new-exercise-answer').value;let answer=raw;if(type==='multiple_choice')answer=Number(raw);if(type==='true_false')answer=raw.toLowerCase()==='true';mutate(()=>sbApi.json('/api/study/exercise-sets/'+encodeURIComponent(selectedSetId)+'/exercises',{method:'POST',body:JSON.stringify({exercise_type:type,prompt:document.querySelector('#new-exercise-prompt').value,options:type==='multiple_choice'?['选项 A','选项 B']:[],answer_key:answer,explanation:'',citations:[],exercise_kind:'user_created'}),signal:pageRequest.signal}),'题目已创建')};document.querySelector('#exercise-generate-form').onsubmit=event=>{event.preventDefault();mutate(()=>sbApi.json('/api/study/exercise-sets/'+encodeURIComponent(selectedSetId)+'/generate',{method:'POST',headers:{'Idempotency-Key':sbApi.idempotencyKey()},body:JSON.stringify({topic:document.querySelector('#exercise-topic').value,material_ids:document.querySelector('#exercise-material-ids').value.split(',').map(value=>value.trim()).filter(Boolean),count:1,exercise_type:'multiple_choice'}),signal:pageRequest.signal}),'题目草稿已生成')};refreshSets.addEventListener('click',loadSets);
loadSets()
})();
</script>
</body>
</html>
