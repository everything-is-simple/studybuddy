<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 计划详情</title>
<link rel="stylesheet" href="/app/css/tokens.css">
<link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div></header>
<main class="main">
<div class="hero"><div>
<p class="eyebrow">学习计划 · 详情</p>
<h1 id="page-title">计划详情</h1>
<p class="lead">查看计划状态、项目进度和来源状态。</p>
</div><a class="btn" href="/app/plans.html">返回计划</a></div>
<section class="card" aria-labelledby="page-title">
<div id="plan-status" class="notice" role="status" aria-live="polite">正在加载计划…</div>
<div id="plan-detail" hidden></div>
<button id="retry-plan" class="btn" type="button" hidden>重试</button>
</section>
</main>
</div>
<script src="/app/js/api.js"></script>
<script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(function(){
const params=new URLSearchParams(location.search);const planId=params.get('plan_id')||params.get('id');
const pageRequest=sbApi.setPageScope('plan-detail');const status=document.querySelector('#plan-status');const detail=document.querySelector('#plan-detail');const retry=document.querySelector('#retry-plan');let generation=0;
function text(value){return typeof value==='string'?value:''}
function showStatus(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}
function appendSource(parent,state){if(!state||state==='valid')return;const source=document.createElement('div');source.className='source-link '+state;source.textContent='来源：'+sbState.source(state);parent.append(source)}
function render(plan){detail.replaceChildren();const heading=document.createElement('h2');heading.textContent=text(plan.title)||'未命名计划';detail.append(heading);if(plan.status){const badge=document.createElement('span');badge.className='badge';badge.textContent=sbState.label(plan.status);heading.append(' ',badge)}if(plan.description){const description=document.createElement('p');description.className='muted';description.textContent=text(plan.description);detail.append(description)}const items=document.createElement('div');items.className='stack mt-24';const title=document.createElement('h3');title.textContent='计划项目';items.append(title);const list=Array.isArray(plan.items)?plan.items:[];if(!list.length){const empty=document.createElement('div');empty.className='notice muted';empty.textContent='暂无计划项';items.append(empty)}else{list.forEach(item=>{const row=document.createElement('article');row.className='card';const itemTitle=document.createElement('h4');itemTitle.textContent=text(item.title)||'未命名项';row.append(itemTitle);const itemStatus=document.createElement('p');itemStatus.className='muted';itemStatus.textContent='状态：'+sbState.label(item.status||'draft');row.append(itemStatus);appendSource(row,item.source_link_status);items.append(row)})}detail.append(items);detail.hidden=false}
async function load(){const run=++generation;if(!planId){showStatus('缺少计划标识，无法加载详情','error');retry.hidden=true;return}showStatus('正在加载计划…');retry.hidden=true;detail.hidden=true;try{const plan=await sbApi.json('/api/study/plans/'+encodeURIComponent(planId),{signal:pageRequest.signal});if(run!==generation)return;render(plan);status.hidden=true}catch(error){if(run!==generation)return;showStatus(sbApi.safeError(error),'error');retry.hidden=false}}
retry.addEventListener('click',load);load();
})();
</script>
</body>
</html>
