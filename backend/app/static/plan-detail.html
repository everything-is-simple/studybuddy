<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy · 计划详情</title>
<link rel="stylesheet" href="/app/css/tokens.css">
<link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="/app/today.html">StudyBuddy</a>
<nav class="nav" data-nav aria-label="主导航"></nav>
<span class="status-dot" data-system-status>检查系统状态…</span>
</div></header>
<main class="main">
<div class="hero"><div>
<p class="eyebrow">学习计划 · 详情</p>
<h1 id="page-title">计划详情</h1>
<p class="lead">查看计划状态、项目进度和来源状态。</p>
</div><a class="btn" id="back-plan" href="/app/plans.html">返回计划</a></div>
<section class="card" aria-labelledby="page-title">
<div id="plan-status" class="notice" role="status" aria-live="polite">正在加载计划…</div>
<div id="plan-detail" hidden></div>
<div id="progress-status" class="notice" role="status" aria-live="polite" hidden></div>
<button id="retry-plan" class="btn" type="button" hidden>重试</button>
</section>
<section class="card mt-24" aria-labelledby="history-heading">
<div class="section-heading"><div><h2 id="history-heading">进度历史</h2><p class="muted">按最近事件倒序显示这份计划的学习记录。</p></div><button id="refresh-progress" class="btn" type="button">刷新进度</button></div>
<div id="history-status" class="notice mt-12" role="status" aria-live="polite">正在加载进度历史…</div>
<div id="progress-summary" class="rhythm-summary mt-16" hidden></div>
<ul id="progress-events" class="task-list mt-16"></ul>
</section>
</main>
</div>
<script src="/app/js/api.js"></script>
<script src="/app/js/state.js"></script>
<script src="/app/js/shell.js"></script>
<script>
(function(){
const params=new URLSearchParams(location.search);const planId=params.get('plan_id')||params.get('id');const selectedItemId=params.get('item_id');const localDate=params.get('local_date')||'';const returnTo=params.get('return_to')==='today'?'/app/today.html':'/app/plans.html';
const pageRequest=sbApi.setPageScope('plan-detail');const status=document.querySelector('#plan-status');const detail=document.querySelector('#plan-detail');const progressStatus=document.querySelector('#progress-status');const retry=document.querySelector('#retry-plan');const historyStatus=document.querySelector('#history-status');const progressSummary=document.querySelector('#progress-summary');const progressEvents=document.querySelector('#progress-events');const refreshProgress=document.querySelector('#refresh-progress');let generation=0;let progressBusy=false;
// Progress events use their own labels: shared sbState has no started/reopened entry.
const EVENT_LABELS={started:'开始学习',completed:'记录完成',skipped:'跳过',reopened:'重新开始'};
function text(value){return typeof value==='string'?value:''}
function showStatus(message,kind){status.hidden=false;status.className='notice'+(kind?' '+kind:'');status.textContent=message}
function appendSource(parent,state){if(!state||state==='valid')return;const source=document.createElement('div');source.className='source-link '+state;source.textContent='来源：'+sbState.source(state);parent.append(source)}
function progressMessage(message,kind=''){progressStatus.hidden=false;progressStatus.className='notice'+(kind?' '+kind:'');progressStatus.textContent=message}
function historyMessage(message,kind=''){historyStatus.hidden=false;historyStatus.className='notice mt-12'+(kind?' '+kind:'');historyStatus.textContent=message}
function summaryCard(value,label){const card=document.createElement('div');card.className='rhythm-card';const number=document.createElement('div');number.className='rhythm-value';number.textContent=String(value);const caption=document.createElement('div');caption.className='rhythm-label';caption.textContent=label;card.append(number,caption);return card}
function when(value){const date=new Date(text(value));return Number.isNaN(date.getTime())?'':date.toLocaleString('zh-CN',{hour12:false})}
function renderProgress(progress,plan){const summary=progress&&progress.summary||{};const titles=new Map((plan&&Array.isArray(plan.items)?plan.items:[]).map(item=>[item.id,text(item.title)||'未命名项']));progressSummary.replaceChildren();progressSummary.append(summaryCard(summary.completed_count||0,'已完成'),summaryCard(summary.in_progress_count||0,'进行中'),summaryCard(summary.pending_count||0,'待处理'),summaryCard(summary.skipped_count||0,'已跳过'),summaryCard(Math.round((summary.completion_ratio||0)*100)+'%','完成率'));progressSummary.hidden=false;const events=Array.isArray(progress&&progress.events)?progress.events.slice().reverse():[];progressEvents.replaceChildren();if(!events.length){historyMessage('暂无进度记录，记录学习后会显示在这里');return}events.forEach(event=>{const row=document.createElement('li');row.className='plan-item-entry';const title=document.createElement('div');title.className='item-title';title.textContent=(EVENT_LABELS[event.event_type]||sbState.label(event.event_type))+' · '+(titles.get(event.item_id)||'未知学习项');const meta=document.createElement('div');meta.className='item-meta muted';const day=event.metadata&&text(event.metadata.local_date);meta.textContent=[when(event.created_at),day?'计划日期 '+day:''].filter(Boolean).join(' · ');row.append(title,meta);progressEvents.append(row)});historyStatus.hidden=true}
async function recordProgress(item,eventType){if(progressBusy)return;progressBusy=true;progressMessage('正在保存进度…');try{const payload={event_type:eventType,metadata:{local_date:localDate||null}};await sbApi.json(`/api/study/plans/${encodeURIComponent(planId)}/items/${encodeURIComponent(item.id)}/progress`,{method:'POST',body:JSON.stringify(payload),signal:pageRequest.signal});progressMessage(eventType==='started'?'已开始学习':'已完成学习','status-ready');await load()}catch(error){progressMessage(sbApi.safeError(error),'warn')}finally{progressBusy=false}}
function render(plan){detail.replaceChildren();const heading=document.createElement('h2');heading.textContent=text(plan.title)||'未命名计划';detail.append(heading);if(plan.status){const badge=document.createElement('span');badge.className='badge';badge.textContent=sbState.label(plan.status);heading.append(' ',badge)}if(plan.description){const description=document.createElement('p');description.className='muted';description.textContent=text(plan.description);detail.append(description)}const items=document.createElement('div');items.className='stack mt-24';const title=document.createElement('h3');title.textContent='计划项目';items.append(title);const list=Array.isArray(plan.items)?plan.items:[];if(!list.length){const empty=document.createElement('div');empty.className='notice muted';empty.textContent='暂无计划项';items.append(empty)}else{list.forEach(item=>{const row=document.createElement('article');row.className='card';const itemTitle=document.createElement('h4');itemTitle.textContent=text(item.title)||'未命名项';row.append(itemTitle);const itemStatus=document.createElement('p');itemStatus.className='muted';itemStatus.textContent='状态：'+sbState.label(item.status||'draft');row.append(itemStatus);appendSource(row,sbState.sourceForItem(item,plan.source_links));if(item.id===selectedItemId&&['active'].includes(plan.status)&&!['completed','archived'].includes(item.status)){const actions=document.createElement('div');actions.className='stack-actions';const start=document.createElement('button');start.className='btn';start.type='button';start.textContent='开始学习';start.disabled=item.status==='in_progress';start.onclick=()=>recordProgress(item,'started');const complete=document.createElement('button');complete.className='btn btn-primary';complete.type='button';complete.textContent='记录完成';complete.onclick=()=>recordProgress(item,'completed');actions.append(start,complete);row.append(actions)}items.append(row)})}detail.append(items);detail.hidden=false}
// Plan detail and progress history load together so one failure never leaves the
// other section stuck on "正在加载", and both share the single retry control.
async function load(){const run=++generation;if(!planId){showStatus('缺少计划标识，无法加载详情','error');historyMessage('缺少计划标识，无法加载进度历史','warn');retry.hidden=true;return}showStatus('正在加载计划…');historyMessage('正在加载进度历史…');retry.hidden=true;detail.hidden=true;progressSummary.hidden=true;progressEvents.replaceChildren();const settle=promise=>promise.then(data=>({data}),error=>({error}));const [planResult,progressResult]=await Promise.all([settle(sbApi.json('/api/study/plans/'+encodeURIComponent(planId),{signal:pageRequest.signal})),settle(sbApi.json('/api/study/plans/'+encodeURIComponent(planId)+'/progress',{signal:pageRequest.signal}))]);if(run!==generation)return;if(planResult.error){showStatus(sbApi.safeError(planResult.error),'error');retry.hidden=false}else{render(planResult.data);status.hidden=true}if(progressResult.error){historyMessage(sbApi.safeError(progressResult.error),'warn');retry.hidden=false}else{renderProgress(progressResult.data,planResult.data)}}
document.querySelector('#back-plan').href=returnTo;retry.addEventListener('click',load);refreshProgress.addEventListener('click',()=>sbSubmit.once('plan-detail-reload',load));load();
})();
</script>
</body>
</html>
