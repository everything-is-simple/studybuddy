<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy · 资料笔记</title><link rel="stylesheet" href="/app/css/tokens.css"><link rel="stylesheet" href="/app/css/app.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/app/">StudyBuddy</a><nav class="nav" data-nav aria-label="主导航"></nav><span class="status-dot" data-system-status>检查系统状态…</span></div></header><main class="main"><div class="hero"><div><p class="eyebrow">资料笔记 · 编辑与复核</p><h1>学习笔记</h1><p class="lead">记录材料要点，编辑草稿，并在来源有效时确认 AI 笔记。</p></div></div><div class="grid"><section class="card span-4"><h2>新建笔记</h2><div id="note-status" class="notice" role="status" aria-live="polite">正在加载笔记…</div><form id="create-form" class="stack"><div class="field"><label for="new-title">笔记标题</label><input id="new-title" maxlength="400" required></div><div class="field"><label for="new-content">笔记内容</label><textarea id="new-content" maxlength="12000" required></textarea></div><button class="btn btn-primary" type="submit">新建用户笔记</button></form><div class="field mt-16"><label for="module-title">新建并关联知识模块</label><input id="module-title" maxlength="400"><button id="link-module" class="btn" type="button">关联到当前笔记</button></div><div class="field mt-16"><label for="topic">从材料生成引用草稿</label><input id="topic" maxlength="500"><input id="material-id" placeholder="材料 ID" aria-label="材料 ID"><button id="generate" class="btn" type="button">生成 AI 草稿</button></div><ul id="notes" class="note-list" data-od-id="notes-list"></ul><button id="refresh" class="btn mt-12" type="button">刷新列表</button><button id="refresh-notes" class="btn mt-12" type="button">刷新笔记</button></section><section class="card span-8"><h2 id="detail-title">选择笔记</h2><div id="detail-status" class="notice" hidden role="status"></div><div id="note-detail" data-od-id="notes-detail"><p class="muted">请选择一篇笔记查看详情。</p></div></section></div></main></div><script src="/app/js/api.js"></script><script src="/app/js/state.js"></script><script src="/app/js/shell.js"></script><script>(function(){
const request=sbApi.setPageScope('notes'),notesRoot=document.querySelector('#notes'),status=document.querySelector('#note-status'),detailStatus=document.querySelector('#detail-status'),detail=document.querySelector('#note-detail'),title=document.querySelector('#detail-title');let notes=[],selected=null,busy=false,generation=0;
const text=value=>typeof value==='string'?value:'';const json=(url,options)=>sbApi.json(url,Object.assign({signal:request.signal},options||{}));
function setStatus(message,kind){status.className='notice'+(kind?' '+kind:'');status.textContent=message}function setBusy(value){busy=value;document.querySelectorAll('button,input,textarea').forEach(node=>node.disabled=value)}function noteError(error){return ({study_note_provider_not_configured:'AI 笔记服务尚未配置',study_note_generation_empty:'当前材料中未找到可生成笔记的内容',study_note_source_deleted:'来源已删除，无法生成引用草稿',study_note_source_unavailable:'来源不可用，无法生成引用草稿',study_note_edit_not_allowed:'该笔记已确认、拒绝或归档，不能编辑',study_note_confirm_source_invalid:'AI 草稿引用已不可用，不能确认'})[error.code]||'笔记操作失败，可重试'}function button(label,handler,id){const node=document.createElement('button');node.className='btn';node.type='button';node.textContent=label;if(id)node.id=id;node.onclick=handler;return node}
function renderList(){notesRoot.replaceChildren();notes.forEach(note=>{const item=document.createElement('li');item.className='note-item'+(note.id===selected?' selected':'');item.tabIndex=0;item.setAttribute('role','button');const type=note.note_type||note.provenance||'user',labelType=(type==='ai_generated'?'ai_draft':type==='user_created'?'user':type);item.textContent=sbState.label(note.status||labelType||'draft')+' · '+sbState.label(labelType)+' · '+(text(note.title)||'未命名笔记');item.onclick=()=>select(note.id);item.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(note.id)}};notesRoot.append(item)});if(!notes.length)notesRoot.append(Object.assign(document.createElement('li'),{className:'empty',textContent:'暂无笔记'}))}
async function load(){const run=++generation;setStatus('正在加载笔记…');try{const data=await json('/api/study/notes');if(run!==generation)return;notes=Array.isArray(data)?data:data.items||[];renderList();const requested=new URLSearchParams(location.search).get('note_id'),next=notes.find(note=>note.id===requested)||notes.find(note=>note.id===selected);if(next)await select(next.id);else{detail.replaceChildren(Object.assign(document.createElement('p'),{className:'muted',textContent:'请选择一篇笔记查看详情。'}));title.textContent='选择笔记';setStatus(notes.length?'请选择一篇笔记':'暂无笔记')}}catch(error){setStatus(sbApi.safeError(error),'warn')}}
async function mutate(action,success){if(busy)return;setBusy(true);try{const result=await action();if(result&&result.id)selected=result.id;await load();if(result&&result.id&&!notes.some(note=>note.id===result.id))render(result);setStatus(success,'status-ready')}catch(error){setStatus(noteError(error),'warn')}finally{setBusy(false)}}
document.querySelector('#create-form').onsubmit=event=>{event.preventDefault();const noteTitle=document.querySelector('#new-title').value.trim(),content=document.querySelector('#new-content').value.trim();if(!noteTitle||!content){setStatus('请输入笔记标题和内容','warn');return}mutate(()=>json('/api/study/notes',{method:'POST',body:JSON.stringify({title:noteTitle,blocks:[{block_kind:'text',content}]})}),'用户笔记已创建')};document.querySelector('#refresh').onclick=load;document.querySelector('#refresh-notes').onclick=load;document.querySelector('#link-module').onclick=()=>{const moduleTitle=document.querySelector('#module-title').value.trim();if(!selected){setStatus('请先选择当前笔记','warn');return}if(!moduleTitle){setStatus('请输入知识模块名称','warn');return}mutate(async()=>{const module=await json('/api/study/modules',{method:'POST',body:JSON.stringify({title:moduleTitle})});return json('/api/study/notes/'+encodeURIComponent(selected)+'/modules/'+encodeURIComponent(module.id),{method:'POST'})},'知识模块已关联')};document.querySelector('#generate').onclick=()=>{const topic=document.querySelector('#topic').value.trim(),material_id=document.querySelector('#material-id').value.trim();if(!topic||!material_id){setStatus('请输入生成主题和材料 ID','warn');return}mutate(()=>json('/api/study/notes/generate',{method:'POST',body:JSON.stringify({topic,material_id,retrieval_mode:'lexical'})}),'已生成引用草稿')};
async function refreshSources(note){await mutate(()=>json('/api/study/notes/sources/refresh',{method:'POST',body:JSON.stringify({note_id:note.id})}),'笔记来源状态已刷新')}
function render(note){title.textContent=text(note.title)||'笔记详情';detail.replaceChildren();const type=note.note_type||note.provenance||'user',labelType=(type==='ai_generated'?'ai_draft':type==='user_created'?'user':type);detail.append(Object.assign(document.createElement('div'),{className:'notice',textContent:'状态：'+sbState.label(note.status||labelType)+' · '+sbState.label(labelType)}),Object.assign(document.createElement('div'),{className:'muted',textContent:'来源状态: '+sbState.source(note.source_citation_status)}));if(note.source_warning_count)detail.append(Object.assign(document.createElement('div'),{className:'notice warn mt-12',textContent:'来源警告：'+note.source_warning_count+' 个引用不可用'}));const modules=document.createElement('p');modules.className='muted';modules.textContent=(note.modules||[]).length?'知识模块：'+note.modules.map(value=>text(value.title)).join('；'):'知识模块：未关联';detail.append(modules);const form=document.createElement('form');form.className='stack';const input=document.createElement('input');input.value=text(note.title);input.setAttribute('aria-label','笔记标题');const blocks=[];(note.blocks||[]).forEach((block,index)=>{const field=document.createElement('div');field.className='field';const area=document.createElement('textarea');area.value=text(block.content);area.setAttribute('aria-label','笔记区块 '+(index+1));field.append(Object.assign(document.createElement('label'),{textContent:'笔记区块 '+(index+1)}),area);if((block.sources||[]).length)field.append(Object.assign(document.createElement('div'),{className:'citations',textContent:'引用：'+block.sources.map(value=>value.citation_key||'来源').join('、')}));blocks.push({block_kind:block.block_kind,area});form.append(field)});const editable=note.status==='draft';input.disabled=!editable;blocks.forEach(value=>value.area.disabled=!editable);form.prepend(input);if(editable){const save=button('保存笔记编辑',()=>{});save.type='submit';form.append(save)}form.onsubmit=event=>{event.preventDefault();mutate(()=>json('/api/study/notes/'+encodeURIComponent(note.id),{method:'PATCH',body:JSON.stringify({title:input.value,blocks:blocks.map(value=>({block_kind:value.block_kind,content:value.area.value}))})}),'笔记编辑已保存')};detail.append(form);const actions=document.createElement('div');actions.className='stack-actions';if(note.status==='draft'){actions.append(button('确认笔记',()=>transition(note.id,'confirm'),'note-confirm'),button('拒绝草稿',()=>transition(note.id,'reject'),'note-reject'))}if(note.status!=='archived')actions.append(button('归档笔记',()=>transition(note.id,'archive'),'note-archive'));actions.append(button('刷新来源状态',()=>refreshSources(note),'note-refresh-sources'),button('导出 Markdown',()=>{location.href='/api/study/notes/'+encodeURIComponent(note.id)+'/export?format=markdown'},'note-export'));detail.append(actions)}
async function select(id){selected=id;history.replaceState({},'','/app/notes.html?note_id='+encodeURIComponent(id));renderList();detailStatus.hidden=false;detailStatus.className='notice';detailStatus.textContent='正在加载笔记详情…';try{const note=await json('/api/study/notes/'+encodeURIComponent(id));render(note);detailStatus.hidden=true;setStatus('笔记已加载')}catch(error){detailStatus.className='notice warn';detailStatus.textContent=sbApi.safeError(error)}}function transition(id,action){mutate(()=>json('/api/study/notes/'+encodeURIComponent(id)+'/'+action,{method:'POST'}),action==='confirm'?'笔记已确认':action==='reject'?'笔记草稿已拒绝':'笔记已归档')}load()})();</script></body></html>
